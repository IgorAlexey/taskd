<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>taskd</title>
<!--
  Oat UI (knadh/oat, MIT) does the styling; this file adds a handful of rules Oat has no opinion on.
  Left: one link per project. Right: the project's tasks, or the one task you opened.
-->
<link rel="stylesheet" href="/ui/oat.min.css">
<script src="/ui/oat.min.js" defer></script>
<style>
:root { --sidebar-width: 13rem; }
main { padding: var(--space-4) var(--space-8) var(--space-16); }
main > * { max-width: 56rem; }
#q { width: 14rem; margin: 0; }
.icon { width: 1em; height: 1em; vertical-align: -0.125em; fill: currentColor; }
.warn { color: var(--warning); }
.body { white-space: pre-wrap; }
tbody tr { cursor: pointer; }
tbody tr[aria-current] { background-color: var(--accent); }
aside nav .badge { margin-inline-start: auto; }
</style>
</head>
<body data-sidebar-layout>

<!-- Phosphor Icons, Fill weight (MIT, phosphoricons.com), inlined so the page ships in the binary -->
<svg style="display:none" aria-hidden="true">
  <symbol id="i-check" viewBox="0 0 256 256"><path d="M128,24A104,104,0,1,0,232,128,104.11,104.11,0,0,0,128,24Zm45.66,85.66-56,56a8,8,0,0,1-11.32,0l-24-24a8,8,0,0,1,11.32-11.32L112,148.69l50.34-50.35a8,8,0,0,1,11.32,11.32Z"/></symbol>
  <symbol id="i-alert" viewBox="0 0 256 256"><path d="M236.8,188.09,149.35,36.22h0a24.76,24.76,0,0,0-42.7,0L19.2,188.09a23.51,23.51,0,0,0,0,23.72A24.35,24.35,0,0,0,40.55,224h174.9a24.35,24.35,0,0,0,21.33-12.19A23.51,23.51,0,0,0,236.8,188.09ZM120,104a8,8,0,0,1,16,0v40a8,8,0,0,1-16,0Zm8,88a12,12,0,1,1,12-12A12,12,0,0,1,128,192Z"/></symbol>
  <symbol id="i-bolt" viewBox="0 0 256 256"><path d="M213.85,125.46l-112,120a8,8,0,0,1-13.69-7l14.66-73.33L45.19,143.49a8,8,0,0,1-3-13l112-120a8,8,0,0,1,13.69,7L153.18,90.9l57.63,21.61a8,8,0,0,1,3,12.95Z"/></symbol>
  <symbol id="i-clock" viewBox="0 0 256 256"><path d="M128,24A104,104,0,1,0,232,128,104.11,104.11,0,0,0,128,24Zm56,112H128a8,8,0,0,1-8-8V72a8,8,0,0,1,16,0v48h48a8,8,0,0,1,0,16Z"/></symbol>
  <symbol id="i-sun" viewBox="0 0 256 256"><path d="M120,40V16a8,8,0,0,1,16,0V40a8,8,0,0,1-16,0Zm8,24a64,64,0,1,0,64,64A64.07,64.07,0,0,0,128,64ZM58.34,69.66A8,8,0,0,0,69.66,58.34l-16-16A8,8,0,0,0,42.34,53.66Zm0,116.68-16,16a8,8,0,0,0,11.32,11.32l16-16a8,8,0,0,0-11.32-11.32ZM192,72a8,8,0,0,0,5.66-2.34l16-16a8,8,0,0,0-11.32-11.32l-16,16A8,8,0,0,0,192,72Zm5.66,114.34a8,8,0,0,0-11.32,11.32l16,16a8,8,0,0,0,11.32-11.32ZM48,128a8,8,0,0,0-8-8H16a8,8,0,0,0,0,16H40A8,8,0,0,0,48,128Zm80,80a8,8,0,0,0-8,8v24a8,8,0,0,0,16,0V216A8,8,0,0,0,128,208Zm112-88H216a8,8,0,0,0,0,16h24a8,8,0,0,0,0-16Z"/></symbol>
  <symbol id="i-moon" viewBox="0 0 256 256"><path d="M235.54,150.21a104.84,104.84,0,0,1-37,52.91A104,104,0,0,1,32,120,103.09,103.09,0,0,1,52.88,57.48a104.84,104.84,0,0,1,52.91-37,8,8,0,0,1,10,10,88.08,88.08,0,0,0,109.8,109.8,8,8,0,0,1,10,10Z"/></symbol>
  <symbol id="i-plus" viewBox="0 0 256 256"><path d="M228,128a12,12,0,0,1-12,12H140v76a12,12,0,0,1-24,0V140H40a12,12,0,0,1,0-24h76V40a12,12,0,0,1,24,0v76h76A12,12,0,0,1,228,128Z"/></symbol>
  <symbol id="i-list" viewBox="0 0 256 256"><path d="M224,128a8,8,0,0,1-8,8H40a8,8,0,0,1,0-16H216A8,8,0,0,1,224,128ZM40,72H216a8,8,0,0,0,0-16H40a8,8,0,0,0,0,16ZM216,184H40a8,8,0,0,0,0,16H216a8,8,0,0,0,0-16Z"/></symbol>
</svg>

<aside data-sidebar>
  <header class="hstack justify-between">
    <strong>taskd</strong>
    <menu class="buttons" id="theme" aria-label="Colour scheme">
      <li><button type="button" class="small outline" data-theme="light" aria-label="Light"><svg class="icon"><use href="#i-sun"/></svg></button></li>
      <li><button type="button" class="small outline" data-theme="dark" aria-label="Dark"><svg class="icon"><use href="#i-moon"/></svg></button></li>
    </menu>
  </header>
  <nav aria-label="Projects"><ul id="projects"></ul></nav>
  <footer class="vstack">
    <button type="button" id="new"><svg class="icon"><use href="#i-plus"/></svg> New task</button>
    <button type="button" id="newproject" class="outline small">New project</button>
  </footer>
</aside>

<main>
  <div data-sidebar-header>
    <button type="button" data-sidebar-toggle aria-label="Projects"><svg class="icon"><use href="#i-list"/></svg></button>
    <strong>taskd</strong>
  </div>
  <div id="home">
    <div id="status"></div>
    <div class="hstack justify-between mt-4">
      <h1 id="title"></h1>
      <input type="search" id="q" aria-label="Filter tasks" placeholder="Filter">
    </div>
    <div id="list"></div>
  </div>
  <article id="task" hidden></article>
</main>

<dialog id="add">
  <form class="add">
    <header><h3>New task</h3><p>in <span id="addproject"></span></p></header>
    <div>
      <label data-field>Task
        <textarea name="body" required rows="10" data-draft="add" placeholder="The first line is the title.&#10;&#10;The rest is what the worker will read."></textarea>
      </label>
      <div class="hstack gap-4">
        <label data-field>Priority
          <select name="pri"><option value="1">1, first</option><option>2</option><option selected>3</option><option>4</option><option value="5">5, last</option></select>
        </label>
        <label data-field>Wait for <select name="after"></select></label>
      </div>
    </div>
    <footer>
      <button type="button" class="outline" data-close>Cancel</button>
      <button type="submit">Add to the queue</button>
    </footer>
  </form>
</dialog>

<script>
(() => {
  const MIN = 60e3;
  const NAME = /^[A-Za-z0-9._-]{1,64}$/;
  let tasks = [];
  let sel = null;                          /* the task you opened, or null for the list */
  let cur = null;                          /* the row j/k rests on */
  let editing = false;                     /* the opened task's text is in a textarea */
  let listScroll = 0;                      /* where the list was when you left it */
  let project = localStorage.getItem('project') || '';
  let newProject = '';                     /* a project made with the button before it has any task */

  /* ---------- helpers ---------- */
  const $ = (s, r = document) => r.querySelector(s), $$ = (s, r = document) => [...r.querySelectorAll(s)];
  const esc = s => String(s ?? '').replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
  const by = s => tasks.filter(t => t.state === s);
  const get = id => tasks.find(t => t.id === +id);
  const waits = t => (t.after || []).map(get).filter(a => a && a.state !== 'done');
  const order = (a, b) => a.pri - b.pri || a.added - b.added;
  const ready = ts => ts.filter(t => t.state === 'queued' && !waits(t).length).sort(order);
  const projects = () => [...new Set([...tasks.map(t => t.project), newProject].filter(Boolean))].sort();
  const ICON = { stuck: 'alert', claimed: 'bolt', queued: 'clock', done: 'check' };
  const icon = n => `<svg class="icon" aria-hidden="true"><use href="#i-${n}"/></svg>`;
  const ago = ts => {
    if (!ts) return '';
    const m = (Date.now() - ts) / MIN;
    return m < 1 ? 'just now' : m < 60 ? Math.round(m) + ' min ago' : m < 90 ? '1 hour ago' : m < 24 * 60 ? Math.round(m / 60) + ' hours ago' : 'yesterday';
  };
  const until = (ts, warn) => `<span data-until="${ts}" data-warn="${warn}"></span>`;
  const toast = msg => window.ot ? ot.toast(msg, '', { variant: 'danger', duration: 6000 }) : alert(msg);
  const fail = err => toast((err && err.field ? err.field + ': ' : '') + (err && err.error ? err.error : 'Request failed'));
  const json = (method, url, body) => fetch(url, { method, headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(body) });
  const draft = key => sessionStorage.getItem('draft:' + key) || '';

  function mapTask(raw) {
    const nl = (raw.body || '').indexOf('\n');
    const title = nl === -1 ? (raw.body || '') : raw.body.slice(0, nl);
    const rest = nl === -1 ? '' : raw.body.slice(nl + 1).replace(/^\n+/, '');
    const stateMap = { buried: 'stuck', leased: 'claimed', pending: 'queued', done: 'done' };
    return {
      id: raw.id,
      state: stateMap[raw.status] || raw.status,
      title,
      body: rest,
      project: raw.project || '',
      pri: raw.priority,
      after: Array.isArray(raw.after) ? raw.after : [],
      attempts: raw.claim_count || 0,
      worker: raw.worker || '',
      exp: (raw.lease_expires || 0) * 1000,
      added: (raw.created_at || 0) * 1000,
      version: raw.version,
      thread: [],
      threadLoaded: false,
    };
  }

  /* ---------- where you are: ?p= is the project, #id is the opened task ---------- */
  function setProject(p) {
    project = p;
    if (p !== newProject) newProject = '';
    localStorage.setItem('project', p);
  }
  const href = (p, id) => `?p=${encodeURIComponent(p)}${id ? '#' + id : ''}`;
  /* every move goes through the address bar, so the back button always works */
  function go(p, id, push) {
    if (id !== null && sel === null) listScroll = $('main').scrollTop;   /* leaving the list: remember where you were */
    history[push ? 'pushState' : 'replaceState'](push ? { fromList: sel === null } : history.state, '', href(p, id));
    route();
  }
  function route() {
    const u = new URL(location), p = u.searchParams.get('p'), id = +u.hash.slice(1) || null;
    if (p && p !== project) setProject(p);
    const t = id && get(id);
    if (t && t.project !== project) { setProject(t.project); history.replaceState(history.state, '', href(project, id)); }
    if (id !== sel) { editing = false; if (id) cur = id; }
    const wasTask = sel !== null;
    sel = id;
    render();
    if (sel) { if (!wasTask) $('main').scrollTop = 0; if (t) fetchNotes(t); }
    else if (wasTask) $('main').scrollTop = listScroll;
    if (matchMedia('(max-width: 768px)').matches) document.body.removeAttribute('data-sidebar-open');
  }
  function back() {
    if (history.state && history.state.fromList) history.back();
    else go(project, null, false);
  }

  /* ---------- the sidebar ---------- */
  let stuckBy = {};
  function sidebar() {
    $('#projects').innerHTML = projects().map(p =>
      `<li><a href="${href(p)}" data-project="${esc(p)}" ${p === project ? 'aria-current="page"' : ''}>${esc(p)}${stuckBy[p] ? `<span class="badge" data-variant="warning">${stuckBy[p]}</span>` : ''}</a></li>`).join('');
  }

  /* ---------- the list ---------- */
  const COLS = {
    stuck:   ['<th>Task</th><th class="align-right">Attempts</th><th class="align-right">Added</th>', t => `<td class="align-right">${t.attempts}</td><td class="align-right">${ago(t.added)}</td>`],
    claimed: ['<th>Task</th><th>Worker</th><th class="align-right">Lease</th>', t => `<td>${esc(t.worker)}</td><td class="align-right">${until(t.exp, 3)}</td>`],
    queued:  ['<th></th><th>Task</th><th class="align-right">Priority</th>', t => `<td class="align-right">${t.pri}</td>`],
    done:    ['<th>Task</th><th>Worker</th>', t => `<td>${esc(t.worker)}</td>`],
  };
  function list() {
    const q = $('#q').value.trim().toLowerCase();
    const hit = t => !q || [String(t.id), t.title, t.body, t.worker, ...(t.thread || [])].some(x => x && String(x).toLowerCase().includes(q));
    const sets = { stuck: [], claimed: [], queued: [], blocked: [], done: [] };
    for (const t of tasks) {
      if (t.project !== project) continue;
      const bucket = t.state === 'queued' && waits(t).length ? 'blocked' : t.state;
      if (sets[bucket]) sets[bucket].push(t);
    }
    sets.claimed.sort((a, b) => a.exp - b.exp);
    sets.done.sort((a, b) => b.added - a.added || b.id - a.id);
    const rdy = sets.queued.sort(order);
    sets.queued = [...rdy, ...sets.blocked.sort(order)];
    delete sets.blocked;
    $('#title').textContent = project;
    $('#list').innerHTML = Object.entries(sets).map(([state, all]) => {
      const rows = all.filter(hit);
      if (!rows.length) return '';
      return `<section id="${state}" class="mt-8"><h2>${icon(ICON[state])} ${state[0].toUpperCase() + state.slice(1)}</h2><div class="table"><table><thead><tr>${COLS[state][0]}</tr></thead><tbody>` +
        rows.map(t => {
          const w = state === 'queued' ? waits(t) : [];
          const under = w.length ? 'Not claimable until this is done: ' + w.map(a => a.title).join('; ') : '';
          return `<tr data-id="${t.id}" ${t.id === cur ? 'aria-current="true"' : ''}>${state === 'queued' ? `<td class="align-right">${w.length ? '' : rdy.indexOf(t) + 1}</td>` : ''}` +
            `<td><a href="${href(project, t.id)}">${esc(t.title)}</a>${under ? `<br><small class="text-light">${esc(under)}</small>` : ''}</td>${COLS[state][1](t)}</tr>`;
        }).join('') + `</tbody></table></div></section>`;
    }).join('') || `<p class="text-light mt-4">${q ? 'Nothing matches.' : 'Nothing in ' + esc(project) + ' yet.'}</p>`;

    /* the alarm counts every project, not just this one */
    const n = s => by(s).length, s = n('stuck'), is = k => k === 1 ? 'is' : 'are', b = tasks.filter(t => t.state === 'queued' && waits(t).length).length;
    const where = Object.entries(stuckBy).sort().map(([p, k]) => `<a href="${href(p)}#stuck" data-project="${esc(p)}">${k} in ${esc(p)}</a>`);
    const counts = `<a href="#claimed">${n('claimed')} ${is(n('claimed'))} claimed</a>, <a href="#queued">${n('queued')} queued</a>${b ? ` (${b} waiting on other tasks)` : ''}, <a href="#done">${n('done')} done</a>.`;
    $('#status').innerHTML = s
      ? `<div role="alert" data-variant="warning"><p><strong>${s} ${is(s)} stuck</strong> (${where.join(', ')}) and ${s === 1 ? 'needs' : 'need'} an answer from you. ${counts}</p></div>`
      : `<p class="text-light">${counts}</p>`;
  }

  /* ---------- the opened task ---------- */
  /* only this project may be waited on: a dependency across repositories is a mistake, not a feature */
  const others = t => tasks.filter(x => x.id !== t.id && x.project === (t.project || project) && ['queued', 'claimed', 'stuck'].includes(x.state) && !(t.after || []).includes(x.id) && !(x.after || []).includes(t.id));
  const waitOptions = t => `<option value="">nothing</option>${others(t).map(x => `<option value="${x.id}">${esc(x.title)}</option>`).join('')}`;
  const footer = (label, cancel = 'Cancel') => `<footer class="hstack justify-end"><button type="button" class="outline" data-act="cancel">${cancel}</button><button type="submit">${label}</button></footer>`;

  /* the head is rewritten on every change; the forms only when the task, its state, or the edit mode
     changes, so a live reload never rebuilds a control you are using */
  function task() {
    const t = get(sel), el = $('#task');
    if (!t) { el.innerHTML = `<p><button type="button" class="ghost" data-back>&larr; Back</button></p><p>No task ${sel}.</p>`; el.dataset.key = ''; return; }
    const w = waits(t);
    const state = {
      stuck:   () => `Stuck after ${t.attempts === 1 ? 'one attempt' : t.attempts + ' attempts'}. It will not be claimed again until you reply.`,
      claimed: () => `Claimed by ${esc(t.worker || 'unknown')}, attempt ${t.attempts}. The lease expires in ${until(t.exp, 3)}.`,
      queued:  () => w.length ? `Not claimable until ${w.map(a => `<a href="${href(t.project, a.id)}">${esc(a.title)}</a>`).join(' and ')} ${w.length === 1 ? 'has' : 'have'} landed.`
                              : `Number ${ready(tasks.filter(x => x.project === t.project)).indexOf(t) + 1} in the queue.`,
      done:    () => t.worker ? `Done. ${esc(t.worker)}, attempt ${t.attempts}.` : `Done. Attempt ${t.attempts}.`,
    }[t.state]();
    const editable = t.state === 'stuck' || t.state === 'queued';
    const text = editing ? '' : `<p class="body">${esc(t.body)}</p>` + (editable ? `<p><button type="button" class="outline small" data-act="edit">Edit the task text</button></p>` : '');
    const forms = editing ? `<form class="edit"><label data-field>Task text<textarea name="text" rows="12" data-draft="edit:${t.id}">${esc(draft('edit:' + t.id) || t.body)}</textarea></label>${footer('Save')}</form>` : {
      stuck:   `<form class="reply"><label data-field>Reply<textarea name="reply" required rows="6" data-draft="reply:${t.id}" placeholder="Answer the question, or say what should change. The next worker reads the whole thread.">${esc(draft('reply:' + t.id))}</textarea></label>
                <label data-field>Wait for <select name="after">${waitOptions(t)}</select></label>${footer('Reply and requeue')}</form>
                <p class="mt-8"><button type="button" class="outline small" data-variant="danger" data-act="drop">Drop</button></p>`,
      claimed: `<p><button type="button" class="outline" data-variant="danger" data-act="revoke">Revoke</button></p><p class="text-light">Revoking ends this attempt now. The task comes to you as stuck so you can say what should change.</p>`,
      queued:  `<div class="hstack gap-4"><label data-field>Priority <select data-act="pri">${[1, 2, 3, 4, 5].map(p => `<option ${p === t.pri ? 'selected' : ''}>${p}</option>`).join('')}</select></label>
                <label data-field>Wait for <select data-act="after">${waitOptions(t)}</select></label></div>
                <p><button type="button" class="outline small" data-variant="danger" data-act="drop">Drop</button></p>`,
      done:    '',
    }[t.state];
    const key = [t.id, t.state, editing, t.pri, t.after.length].join();
    if (el.dataset.key !== key) { el.innerHTML = `<div data-head></div><div data-forms>${forms}</div>`; el.dataset.key = key; }
    $('[data-head]', el).innerHTML = `<p><button type="button" class="ghost" data-back>&larr; ${esc(t.project)}</button></p>
      <h1>${esc(t.title)}</h1><p>${icon(ICON[t.state])} ${state}</p>${text}` +
      (t.thread.length ? `<h3>Thread</h3><ol>${t.thread.map(l => `<li>${esc(l)}</li>`).join('')}</ol>` : '') +
      `<p class="text-light">Task <code>${t.id}</code> in ${esc(t.project)}, priority ${t.pri}, added ${ago(t.added)}.</p>`;
  }

  function render() {
    stuckBy = {};
    for (const t of tasks) if (t.state === 'stuck') stuckBy[t.project] = (stuckBy[t.project] || 0) + 1;
    sidebar();
    const s = by('stuck').length;
    document.title = (s ? `(${s} stuck) ` : '') + 'taskd';
    $('#home').hidden = sel !== null;
    $('#task').hidden = sel === null;
    if (sel === null) list(); else task();
    tick();
  }

  function tick() {
    const now = Date.now();
    $$('[data-until]').forEach(el => {
      const ms = Math.max(0, el.dataset.until - now), s = Math.round(ms / 1000);
      const c = ms < 10 * MIN ? Math.floor(s / 60) + ':' + String(s % 60).padStart(2, '0') : Math.round(ms / MIN) + ' min';
      el.innerHTML = ms < el.dataset.warn * MIN ? `<strong class="warn">${c}</strong>` : c;
    });
    for (const t of by('claimed')) {
      if (t.exp && now >= t.exp && !t.expired) {
        t.expired = true;
        scheduleReload();
        break;
      }
    }
  }

  async function fetchNotes(t) {
    try {
      const res = await fetch('/tasks/' + t.id);
      if (!res.ok) return;
      const full = await res.json();
      t.thread = (full.notes || []).map(n => `${n.author}: ${n.text}`);
      t.threadLoaded = true;
      if (full.version !== undefined) t.version = full.version;
      if (sel === t.id) render();
    } catch (_) {}
  }

  async function load() {
    try {
      const res = await fetch('/tasks?limit=1000');
      if (!res.ok) return;
      tasks = (await res.json()).map(mapTask);
      if (tasks.some(t => t.project === newProject)) newProject = '';
      const all = projects();
      if (!all.includes(project)) { setProject(all[0] || 'taskd'); if (!all.length) newProject = 'taskd'; }   /* a bookmark to a project that is gone, or a fresh database */
      const t = sel && get(sel);
      if (t && t.project !== project) setProject(t.project);        /* a link to a task lands on its project */
      if (new URL(location).searchParams.get('p') !== project) history.replaceState(history.state, '', href(project, sel));
      render();
      if (t) fetchNotes(t);                                          /* the thread may have grown */
    } catch (_) {}
  }

  /* ---------- the new task dialog ---------- */
  function openAdd() {
    const f = $('#add form');
    $('#addproject').textContent = project;
    f.elements.after.innerHTML = waitOptions({ id: 0, after: [], project });
    f.elements.body.value = draft('add');
    $('#add').showModal();
    f.elements.body.focus();
  }

  /* ---------- events ---------- */
  document.addEventListener('click', e => {
    const a = e.target.closest('a[href]');
    if (a && a.origin === location.origin && (a.search.startsWith('?p=') || a.hash)) {
      e.preventDefault();
      const p = new URLSearchParams(a.search).get('p') || project, id = +a.hash.slice(1) || null;
      if (id) return go(p, id, true);
      if (p !== project || sel !== null) go(p, null, true);
      if (a.hash) $(a.hash)?.scrollIntoView({ block: 'start' });     /* #stuck, #queued: a section, not a task */
      return;
    }
    const tr = e.target.closest('#list tbody tr');
    if (tr) return go(project, +tr.dataset.id, true);
    if (e.target.closest('[data-back]')) return back();
    if (e.target.closest('[data-close]')) return $('#add').close();
  });
  addEventListener('popstate', route);

  $('#q').addEventListener('input', list);
  $('#new').addEventListener('click', openAdd);
  $('#newproject').addEventListener('click', () => {
    const name = (prompt('New project name (letters, digits, . _ -)') || '').trim();
    if (!name) return;
    if (!NAME.test(name)) return toast('A project name is letters, digits, dots, dashes and underscores, up to 64 of them.');
    newProject = name;
    go(name, null, true);
  });

  /* a draft lives in sessionStorage until it is sent or cleared */
  document.addEventListener('input', e => {
    const key = e.target.dataset && e.target.dataset.draft;
    if (key) sessionStorage.setItem('draft:' + key, e.target.value);
  });

  /* light or dark: the choice is kept; with nothing chosen the page follows the system */
  const applyTheme = () => {
    const t = localStorage.getItem('theme') || '';
    document.documentElement.style.colorScheme = t || '';
    const on = t || (matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light');
    $$('#theme button').forEach(b => { b.classList.toggle('outline', b.dataset.theme !== on); b.setAttribute('aria-pressed', String(b.dataset.theme === on)); });
  };
  $('#theme').addEventListener('click', e => {
    const b = e.target.closest('button[data-theme]');
    if (!b) return;
    localStorage.setItem('theme', b.dataset.theme);
    applyTheme();
  });
  matchMedia('(prefers-color-scheme: dark)').addEventListener('change', applyTheme);
  applyTheme();

  $('#task').addEventListener('click', async e => {
    const b = e.target.closest('button[data-act]');
    if (!b) return;
    const t = get(sel), act = b.dataset.act;
    if (act === 'cancel') {
      const f = b.closest('form');
      if (f.matches('.edit')) { sessionStorage.removeItem('draft:edit:' + t.id); editing = false; return render(); }
      sessionStorage.removeItem('draft:reply:' + t.id);
      f.elements.reply.value = '';
      return;
    }
    if (!t) return;
    if (act === 'edit') { editing = true; render(); return $('#task form.edit textarea').focus(); }
    if (act === 'drop') {
      if (!confirm(`Drop “${t.title}”? It leaves the queue.`)) return;
      const res = await fetch('/tasks/' + t.id, { method: 'DELETE' });
      if (!res.ok) return fail(await res.json().catch(() => ({})));
      go(project, null, false);
      return load();
    }
    if (act === 'revoke') {
      const why = prompt(`Why are you revoking ${t.worker}? This goes in the thread.`);
      if (why === null) return;
      if (why.trim()) {
        const res = await json('POST', '/tasks/' + t.id + '/notes', { author: 'you', text: why.trim() });
        if (!res.ok) return fail(await res.json().catch(() => ({})));
      }
      const res = await json('POST', '/tasks/' + t.id + '/bury', { worker: t.worker });
      if (!res.ok) return fail(await res.json().catch(() => ({})));
      return load();
    }
  });

  /* a PATCH carries the version we saw; 409 means someone else got there first */
  async function patch(t, data) {
    if (t.version != null) data.version = t.version;
    const res = await json('PATCH', '/tasks/' + t.id, data);
    if (res.status === 409) { toast('Changed elsewhere, reloading'); load(); return false; }
    if (!res.ok) { fail(await res.json().catch(() => ({}))); return false; }
    return true;
  }

  $('#task').addEventListener('change', async e => {
    const t = get(sel), a = e.target.dataset.act;
    if (!t || !a) return;
    if (a === 'pri' && await patch(t, { priority: +e.target.value })) return load();
    if (a === 'after' && e.target.value && await patch(t, { after: [...t.after, +e.target.value] })) return load();
  });

  $('#task').addEventListener('submit', async e => {
    e.preventDefault();
    const f = e.target, v = new FormData(f), t = get(sel);
    if (f.matches('.edit')) {
      const rest = v.get('text').trim();
      if (!await patch(t, { body: t.title ? (rest ? t.title + '\n\n' + rest : t.title) : rest })) return;
      sessionStorage.removeItem('draft:edit:' + t.id);
      editing = false;
      return load();
    }
    const text = v.get('reply').trim();
    const res = await json('POST', '/tasks/' + t.id + '/notes', { author: 'you', text });
    if (!res.ok) return fail(await res.json().catch(() => ({})));
    if (v.get('after') && !await patch(t, { after: [...t.after, +v.get('after')] })) return;
    const kick = await json('POST', '/tasks/' + t.id + '/kick', {});
    if (!kick.ok) return fail(await kick.json().catch(() => ({})));
    sessionStorage.removeItem('draft:reply:' + t.id);
    return load();
  });

  $('#add form').addEventListener('submit', async e => {
    e.preventDefault();
    const f = e.target, v = new FormData(f);
    const res = await json('POST', '/tasks', { body: v.get('body').trim(), project, priority: +v.get('pri'), after: v.get('after') ? [+v.get('after')] : [] });
    if (!res.ok) return fail(await res.json().catch(() => ({})));
    sessionStorage.removeItem('draft:add');
    f.reset();
    $('#add').close();
    load();
  });

  addEventListener('keydown', e => {
    const typing = /INPUT|TEXTAREA|SELECT/.test(document.activeElement?.tagName);
    if (e.key === 'Enter' && (e.metaKey || e.ctrlKey) && document.activeElement?.form) return document.activeElement.form.requestSubmit();
    if ($('#add').open) return;                                  /* the dialog owns its keys; Escape closes it */
    if (e.key === 'Escape') { if (typing) document.activeElement.blur(); else if (sel !== null) back(); return; }
    if (typing || e.metaKey || e.ctrlKey || e.altKey) return;
    if (e.key === '/') { e.preventDefault(); if (sel === null) $('#q').focus(); }
    if (e.key === 'n') { e.preventDefault(); openAdd(); }
    if (sel !== null) return;
    if (e.key === 'j' || e.key === 'k') {
      const ids = $$('#list tbody tr').map(r => +r.dataset.id), i = ids.indexOf(cur), next = ids[e.key === 'j' ? Math.min(ids.length - 1, i + 1) : Math.max(0, i - 1)];
      if (next && next !== cur) {
        $(`tr[data-id="${cur}"]`)?.removeAttribute('aria-current');
        cur = next;
        const row = $(`tr[data-id="${cur}"]`); row.setAttribute('aria-current', 'true'); row.scrollIntoView({ block: 'nearest' });
      }
    }
    if (e.key === 'Enter' && cur && !/BUTTON|A/.test(document.activeElement?.tagName) && $(`tr[data-id="${cur}"]`)) go(project, cur, true);
  });

  let reloadTimer;
  function scheduleReload() {
    clearTimeout(reloadTimer);
    reloadTimer = setTimeout(load, 100 + Math.random() * 400);
  }

  let hadError = false;
  const es = new EventSource('/api/events');
  es.addEventListener('change', scheduleReload);
  es.onerror = () => { hadError = true; };
  es.onopen = () => {
    if (hadError) {
      hadError = false;
      scheduleReload();
    }
  };

  const u0 = new URL(location);
  if (u0.searchParams.get('p')) setProject(u0.searchParams.get('p'));
  sel = +u0.hash.slice(1) || null;
  cur = sel;
  load();
  setInterval(tick, 1000);
})();
</script>
</body>
</html>
