<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="light dark">
<title>taskd</title>
<!--
  One column and no second pane. Every task is a row in the order you need them, and the row you
  pick unfolds where it sits. A blank task waits at the top of the column. The rail on the left is
  only for getting around: which project, which part of its queue.

  Oat UI (knadh/oat, MIT) styles the semantic HTML and brings the toast and dialog behaviour.
  Everything Oat does sits in CSS @layers, so the unlayered rules below always win.
-->
<link rel="stylesheet" href="/ui/oat.min.css">
<script src="/ui/oat.min.js" defer></script>
<style>
:root {
  color-scheme: light dark;
  /* Radix Colors 3.0: gray for the page, amber for what is selected or primary, red for what is
     stuck, yellow for claimed and green for done. Each step does the job Radix documents for it:
     1 page, 2 subtle surface, 3 control, 4 hover, 6 rules, 7 control borders, 8 focus, 9 solid,
     11 text, 12 text. */
  --gray-1:  light-dark(#fcfcfc, #111111);
  --gray-2:  light-dark(#f9f9f9, #191919);
  --gray-3:  light-dark(#f0f0f0, #222222);
  --gray-4:  light-dark(#e8e8e8, #2a2a2a);
  --gray-6:  light-dark(#d9d9d9, #3a3a3a);
  --gray-7:  light-dark(#cecece, #484848);
  --gray-11: light-dark(#646464, #b4b4b4);
  --gray-12: light-dark(#202020, #eeeeee);
  --amber-3: light-dark(#fff7c2, #302008);
  --amber-8: light-dark(#e2a336, #8f6424);
  --amber-9: #ffc53d;
  --amber-11: light-dark(#ab6400, #ffca16);
  --amber-contrast: #21201c;
  --red-9:   #e5484d;
  --red-11:  light-dark(#ce2c31, #ff9592);
  --yellow-11: light-dark(#9e6c00, #f5e147);
  --green-11: light-dark(#218358, #3dd68c);
  --work: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  --work-size: 0.875rem;

  /* the jobs, each on one step */
  --page: var(--gray-1);    --sheet: var(--gray-2);   --control: var(--gray-3);   --hover: var(--gray-4);
  --rule: var(--gray-6);    --edge: var(--gray-7);    --quiet: var(--gray-11);    --fg: var(--gray-12);
  --picked-bg: var(--amber-3);   --picked: var(--amber-11);   --solid: var(--amber-9);   --focus: var(--amber-8);
  --stuck: var(--red-11);   --claimed: var(--yellow-11);   --done: var(--green-11);

  /* Oat's tokens, pointed at the jobs above */
  --background: var(--page);          --foreground: var(--fg);
  --card: var(--sheet);               --card-foreground: var(--fg);
  --primary: var(--solid);            --primary-foreground: var(--amber-contrast);
  --secondary: var(--control);        --secondary-foreground: var(--fg);
  --muted: var(--control);            --muted-foreground: var(--quiet);
  --faint: var(--sheet);              --accent: var(--hover);
  --danger: var(--red-9);             --danger-foreground: #fff;
  --border: var(--rule);              --input: var(--edge);   --ring: var(--focus);
  --radius-small: 3px; --radius-medium: 4px; --radius-large: 6px;
  --font-sans: var(--work);
  --text-7: var(--work-size);
  --sidebar-width: 13.5rem;
}
html { font-variant-numeric: lining-nums; }
.warn { color: var(--stuck); font-weight: 600; }
a { text-underline-offset: 0.15em; text-decoration-thickness: 1px; }
.icon-svg { width: 1em; height: 1em; fill: currentColor; flex: none; vertical-align: -0.12em; }
.n { font-variant-numeric: lining-nums tabular-nums; }
.icon-svg { color: var(--quiet); }
.stuck .icon-svg, a[href="#stuck"] .icon-svg, #status .icon-svg { color: var(--stuck); }
.claimed .icon-svg, a[href="#claimed"] .icon-svg { color: var(--claimed); }
.done .icon-svg, a[href="#done"] .icon-svg { color: var(--done); }

/* ---------- top: the name and the light switch ---------- */
nav[data-topnav] { gap: 0.75rem; padding: 0.55rem 1.25rem; box-shadow: none; }
nav[data-topnav] h1 { font: 600 1.05rem/1.2 var(--work); margin: 0; }
#theme { margin: 0 0 0 auto; }
#theme button { color: var(--quiet); width: 2.1rem; height: 1.9rem; }
#theme button[aria-pressed="true"] { background: var(--picked-bg); color: var(--picked); }
#theme button[aria-pressed="true"] .icon-svg { color: inherit; }

/* ---------- left: getting around ---------- */
aside[data-sidebar] { box-shadow: none; background: var(--sheet); }
aside[data-sidebar] > nav { padding: 1rem 0.6rem; }
aside[data-sidebar] h2 { font: 600 0.75rem/1.2 var(--work); text-transform: uppercase; color: var(--quiet); margin: 1.5rem 0 0.4rem 0.65rem; }
aside[data-sidebar] h2:first-child { margin-top: 0.2rem; }
aside[data-sidebar] nav a { align-items: center; padding: 0.3rem 0.65rem; text-decoration: none; }
aside[data-sidebar] nav a[aria-current] { background: var(--picked-bg); color: var(--picked); }
aside[data-sidebar] nav a[aria-current] .icon-svg { color: inherit; }
aside[data-sidebar] nav a[aria-disabled="true"] { color: var(--quiet); opacity: 0.6; pointer-events: none; }
aside[data-sidebar] .count { margin-left: auto; color: var(--quiet); }
aside[data-sidebar] .badge { margin-left: auto; padding: 0 0.5rem; }
aside[data-sidebar] .badge .icon-svg { color: inherit; }
#add-project { margin: 0.35rem 0 0 0.1rem; color: var(--quiet); }
/* pointing at a project row shows its menu button over the count, as every sidebar does:
   the row is 2rem tall, the action a 1.25rem square with a 1rem icon, 0.25rem from the edge */
#projects li { position: relative; }
#projects li a { min-height: 2rem; padding-right: 2rem; border-radius: var(--radius-medium); }
#projects li > button { position: absolute; top: 50%; right: 0.25rem; transform: translateY(-50%); width: 1.25rem; height: 1.25rem; padding: 0; border-radius: var(--radius-medium); color: var(--quiet); visibility: hidden; }
#projects li > button .icon-svg { width: 1rem; height: 1rem; }
#projects li > button:hover { background: var(--hover); color: var(--fg); }
#projects li:is(:hover, :focus-within, [data-menu]) > button { visibility: visible; }
#projects li:is(:hover, :focus-within, [data-menu]) :is(.count, .badge) { visibility: hidden; }
@media (hover: none) {                       /* a finger: the action is always there beside the count, a 2rem square filling the row */
  #projects li > button { visibility: visible; width: 2rem; height: 2rem; right: 0; }
  #projects li :is(.count, .badge) { visibility: visible; margin-right: 0.25rem; }
}
#project-menu { position: fixed; inset: auto; margin: 0; padding: 0.25rem; min-width: 8rem; flex-direction: column; background: var(--sheet); color: var(--fg); border: 1px solid var(--rule); border-radius: var(--radius-medium); box-shadow: var(--shadow-medium); }
#project-menu:popover-open { display: flex; }
#project-menu [role="menuitem"] { justify-content: flex-start; border: 0; border-radius: var(--radius-small); }
#project-menu [role="menuitem"][data-variant="danger"] { color: var(--stuck); }

/* ---------- the column ---------- */
main { padding: 1.25rem 2.5rem 6rem; scroll-padding-top: 3rem; }
.ledger { max-width: 58rem; }
#status { margin-bottom: 1.25rem; }
#status p { margin: 0; }
#status [role="alert"] { color: var(--fg); }
#status a { color: inherit; }

/* one row: a blank task and the filter. Writing in the blank drops a panel over the list instead of
   pushing it down, so nothing moves under the pointer when you leave it. A draft stays in the line. */
.top { display: flex; gap: 1rem; margin-bottom: 1.25rem; }
#q { width: 13rem; margin: 0; flex: none; }
form.add { position: relative; z-index: 3; flex: 1; min-width: 0; height: 2.45rem; }
form.add .drop { position: absolute; inset: 0 0 auto 0; }
form.add textarea { display: block; margin: 0; min-height: 2.45rem; height: 2.45rem; resize: none; overflow: hidden; white-space: nowrap; padding: 0.55rem 0.75rem; font: var(--work-size)/1.5 var(--work); }
form.add .more { display: none; }
form.add.open .drop { margin: calc(-0.75rem - 1px); padding: 0.75rem; background: var(--sheet); border: 1px solid var(--rule); border-radius: var(--radius-large); box-shadow: var(--shadow-large); }
form.add.open textarea { height: 12rem; resize: vertical; overflow: auto; white-space: pre-wrap; }
form.add.open .more { display: flex; }
.fields { display: flex; flex-wrap: wrap; align-items: end; gap: 0.75rem 1.25rem; margin-top: 0.75rem; }
.fields label, .fields .field { font-size: var(--work-size); font-weight: normal; color: var(--quiet); margin: 0; }
.fields .field b { display: block; font-weight: normal; color: var(--fg); margin-top: 0.25rem; line-height: 2.15rem; }
.fields select { display: block; width: auto; min-width: 5.5rem; }
.fields label.wait { flex: 1 1 10rem; min-width: 0; }
.fields label.wait select { width: 100%; text-overflow: ellipsis; }
.fields .end { display: flex; gap: 0.6rem; margin-left: auto; }

/* one section per state; the heading carries the column labels so rows need none */
section { margin-bottom: 2.25rem; }
.head { position: sticky; top: -1.25rem; z-index: 2; display: flex; align-items: baseline; background: var(--page); padding: 1rem 0.4rem 0.4rem; border-bottom: 1px solid var(--edge); font: var(--work-size)/1.2 var(--work); color: var(--quiet); }
.head h2 { flex: 1; font: 600 1.1rem/1.2 var(--work); color: var(--fg); margin: 0; }
.head h2 small { font: var(--work-size)/1 var(--work); font-weight: normal; color: var(--quiet); margin-left: 0.5rem; }
.c-n { flex: none; width: 5rem; text-align: right; }
.c-d { flex: none; width: 7.5rem; text-align: right; }
.c-w { flex: none; width: 15rem; padding-left: 1.25rem; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }

/* a row is Oat's accordion with the box taken off, so the list reads as a ledger */
.task { border: 0; border-bottom: 1px solid var(--rule); border-radius: 0; overflow: visible; }
.task + .task { margin-top: 0; }
.task > summary { align-items: baseline; justify-content: flex-start; gap: 0; padding: 0.4rem 0.4rem; border-bottom: 0; font: var(--work-size)/1.4 var(--work); font-weight: normal; user-select: text; }
.task > summary::after { display: none; }
.task > summary:focus-visible { outline-offset: -2px; }
.lead { flex: none; width: 2rem; color: var(--quiet); }
.t { flex: 1; min-width: 0; }
.t a { color: var(--fg); text-decoration: none; }
.t a:hover { text-decoration: underline; color: var(--picked); }
.why { display: block; font-size: var(--work-size); line-height: 1.4; color: var(--quiet); margin-top: 0.1rem; max-width: 40rem; }
.task > summary > :is(.c-n, .c-d, .c-w) { color: var(--quiet); }

/* the picked row unfolds in place */
.task[open] { background: var(--sheet); box-shadow: inset 2px 0 0 var(--solid); }
.task[open] > summary { padding-top: 1rem; }
.task[open] > summary:hover { background: none; }
.task[open] .why { display: none; }
.task > .sheet { margin: 0; padding: 0.4rem 1.5rem 1.5rem 2.4rem; font-size: var(--work-size); line-height: 1.5; animation: none; }
.task.fresh > .sheet { animation: fade-in-up 0.25s both; }
.sheet > * { max-width: 40rem; }
.sheet p { margin: 0 0 1rem; }
.sheet .body { white-space: pre-wrap; }
.sheet .body:empty { display: none; }
.sheet h3 { font: 600 var(--work-size)/1.3 var(--work); color: var(--quiet); margin: 1.5rem 0 0.5rem; }
.thread { list-style: none; padding: 0; margin: 0 0 1rem; }
.thread li { margin: 0 0 0.75rem; white-space: pre-wrap; }
.thread b { display: block; font: var(--work-size)/1.3 var(--work); color: var(--quiet); }
.sheet .facts { color: var(--quiet); }
.sheet textarea { display: block; min-height: 7rem; margin: 0; font: var(--work-size)/1.5 var(--work); }
.sheet form { margin-top: 1.25rem; }
.actions { display: flex; flex-wrap: wrap; align-items: end; gap: 0.75rem 1.25rem; margin-top: 1.25rem; padding-top: 1rem; border-top: 1px solid var(--rule); }
.actions p { flex: 1 1 100%; margin: 0; color: var(--quiet); }
.more-done { margin-top: 0.6rem; }
.empty { padding-top: 1.1rem; }

dialog label { font-weight: normal; color: var(--quiet); }
dialog [data-hint] { display: block; margin-top: 0.35rem; font-size: 0.8rem; }

@media (max-width: 768px) {
  main { padding: 1rem 1rem 5rem; }
  .head { top: -1rem; }
  .top { flex-wrap: wrap; } #q { flex: 1 1 100%; width: auto; }
  .opt { display: none; }
  .c-w { width: 9rem; }
  .task > .sheet { padding: 0.4rem 1rem 1.25rem 1rem; }
  .fields .end { margin-left: 0; flex: 1 1 100%; justify-content: flex-end; }
}
</style>
</head>
<body data-sidebar-layout>

<nav data-topnav>
  <button type="button" data-sidebar-toggle class="ghost" aria-label="Projects"><svg class="icon-svg"><use href="#i-list"/></svg></button>
  <h1>taskd</h1>
  <menu class="buttons" id="theme" aria-label="Colour scheme">
    <li><button type="button" class="outline icon small" data-theme="light" aria-label="Light"><svg class="icon-svg"><use href="#i-sun"/></svg></button></li>
    <li><button type="button" class="outline icon small" data-theme="dark" aria-label="Dark"><svg class="icon-svg"><use href="#i-moon"/></svg></button></li>
  </menu>
</nav>

<aside data-sidebar>
  <nav aria-label="Projects and states">
    <h2>Projects</h2>
    <ul id="projects"></ul>
    <button type="button" class="ghost small" id="add-project"><svg class="icon-svg"><use href="#i-plus"/></svg> New project</button>
    <h2 id="in">In this project</h2>
    <ul id="states"></ul>
  </nav>
</aside>
<div id="project-menu" popover role="menu">
  <button type="button" class="ghost small" role="menuitem" data-act="rename">Rename</button>
  <button type="button" class="ghost small" role="menuitem" data-act="delete" data-variant="danger">Delete</button>
</div>

<main id="main">
  <div class="ledger">
    <div id="status" aria-live="polite"></div>
    <div class="top">
      <form class="add"><div class="drop">
        <textarea name="body" required aria-label="New task" placeholder="Write a new task. The first line is the title."></textarea>
        <div class="fields more">
          <p class="field">Project <b class="project"></b></p>
          <label>Priority <select name="pri"><option value="1">1, first</option><option>2</option><option selected>3</option><option>4</option><option value="5">5, last</option></select></label>
          <label class="wait">Wait for <select name="after"></select></label>
          <span class="end"><button type="button" class="outline" data-act="clear">Clear</button><button type="submit">Add to the queue</button></span>
        </div>
      </div></form>
      <input type="search" id="q" aria-label="Filter tasks" placeholder="Filter">
    </div>
    <div id="list"></div>
  </div>
</main>

<!-- the one dialog: it asks a question, sometimes wants a line or a paragraph back -->
<dialog id="ask" closedby="any">
  <form method="dialog">
    <header><h3></h3><p></p></header>
    <div><label><span></span><input name="line" autocomplete="off"><textarea name="para" rows="4"></textarea><small data-hint></small></label></div>
    <footer><button type="button" class="outline" data-cancel>Cancel</button><button type="submit" value="ok"></button></footer>
  </form>
</dialog>

<script>
(() => {
  const api = (path, opts) => fetch(path, opts);
  const MIN = 60e3;
  const NAME = '[A-Za-z0-9._\\-]{1,64}';
  const DONE_CAP = 30;                     /* done is an archive: show the latest, offer the rest */
  let tasks = [];
  let sel = null;                          /* the open row */
  let editing = null;                      /* the task whose text is being edited */
  let fresh = null;                        /* the row the person just opened, animated once */
  let allDone = false;
  let first = true;
  const threads = new Map();               /* whole threads, by task id, for the rows that were opened */
  let project = new URLSearchParams(location.search).get('p') || store('project') || '';
  let newProject = '';                     /* a project opened with + before it has any task */

  /* ---------- helpers ---------- */
  const $ = (s, r = document) => r.querySelector(s), $$ = (s, r = document) => [...r.querySelectorAll(s)];
  const esc = s => String(s ?? '').replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
  function store(k, v) { try { return v === undefined ? localStorage.getItem(k) : localStorage.setItem(k, v); } catch (_) { return null; } }
  const by = s => tasks.filter(t => t.state === s);
  const get = id => tasks.find(t => t.id === +id);
  const waits = t => (t.after || []).map(get).filter(a => a && a.state !== 'done');
  const order = (a, b) => a.pri - b.pri || a.added - b.added;
  const here = t => t.project === project;
  const projects = () => [...new Set([...tasks.map(t => t.project), newProject].filter(Boolean))].sort();
  const ICON = { stuck: 'alert', claimed: 'bolt', queued: 'clock', done: 'check' };
  const icon = n => `<svg class="icon-svg" aria-hidden="true"><use href="#i-${n}"/></svg>`;
  const cap = s => s[0].toUpperCase() + s.slice(1);
  const short = w => w.length > 30 ? '…' + w.slice(-28) : w;
  const clip = (s, n = 180) => s.length > n ? s.slice(0, n).trimEnd() + '…' : s;
  const ago = ts => {
    if (!ts) return '';
    const m = (Date.now() - ts) / MIN;
    return m < 1 ? 'just now' : m < 60 ? Math.round(m) + ' min ago' : m < 90 ? '1 hour ago' : m < 24 * 60 ? Math.round(m / 60) + ' hours ago' : m < 48 * 60 ? 'yesterday' : Math.round(m / 1440) + ' days ago';
  };
  const until = (ts, warn) => `<span data-until="${ts}" data-warn="${warn}"></span>`;
  const fail = async res => ot.toast(await res.json().then(e => (e.field ? e.field + ': ' : '') + (e.error || 'Request failed'), () => 'Request failed'), 'Not saved', { variant: 'danger', placement: 'bottom-center', duration: 8000 });
  const stale = () => ot.toast('Someone else changed this task. Here is the current version.', 'Reloaded', { placement: 'bottom-center' });
  /* half-written replies and edits outlive a re-render and a reload of the page */
  const draft = k => { try { return sessionStorage.getItem('draft:' + k) || ''; } catch (_) { return ''; } };
  const setDraft = (k, v) => { try { v ? sessionStorage.setItem('draft:' + k, v) : sessionStorage.removeItem('draft:' + k); } catch (_) {} };


  function mapTask(raw) {
    const nl = (raw.body || '').indexOf('\n');
    const title = nl === -1 ? (raw.body || '') : raw.body.slice(0, nl);
    const rest = nl === -1 ? '' : raw.body.slice(nl + 1).replace(/^\n+/, '');
    const stateMap = { buried: 'stuck', leased: 'claimed', pending: 'queued', done: 'done' };
    return {
      id: raw.id, state: stateMap[raw.status] || raw.status, status: raw.status,
      title, body: rest, rawBody: raw.body || '', project: raw.project || '',
      pri: raw.priority, after: Array.isArray(raw.after) ? raw.after : [],
      attempts: raw.claim_count || 0, worker: raw.worker || '',
      exp: (raw.lease_expires || 0) * 1000, added: (raw.created_at || 0) * 1000,
      version: raw.version, thread: threads.get(raw.id) || (raw.last_note ? [{ author: raw.last_note.author, text: raw.last_note.text }] : []),
    };
  }

  /* the one place the active project changes */
  function setProject(p) {
    project = p;
    if (p !== newProject) newProject = '';
    allDone = false;
    store('project', p);
  }
  /* the address: ?p= is the project, &t= the open task. Opening a row is a step, so Back retraces
     the rows you opened; closing one, or anything else, rewrites the entry you are on. */
  const href = (p, id) => '?p=' + encodeURIComponent(p) + (id ? '&t=' + id : '');
  function syncURL(push = false) {
    try { history[push ? 'pushState' : 'replaceState'](null, '', href(project, sel)); } catch (_) {}
  }
  addEventListener('popstate', () => {
    const u = new URLSearchParams(location.search), p = u.get('p');
    if (p && p !== project) { setProject(p); $('#q').value = ''; }
    show(+u.get('t') || null);
  });

  /* ---------- the rail: which project, which part of its queue ---------- */
  let stuckBy = {};
  function rail(sets) {
    $('#projects').innerHTML = projects().map(p => {
      const q = tasks.filter(t => t.project === p && t.state === 'queued').length;
      return `<li><a href="${href(p)}" data-project="${esc(p)}" ${p === project ? 'aria-current="page"' : ''}>${esc(p)}` +
        (stuckBy[p] ? `<span class="badge n" data-variant="danger" aria-label="${stuckBy[p]} stuck">${icon('alert')}${stuckBy[p]}</span>` : `<span class="count n" aria-label="${q} queued">${q || ''}</span>`) +
        `</a><button type="button" class="ghost icon small" data-menu-for="${esc(p)}" aria-label="More for ${esc(p)}" aria-haspopup="menu">${icon('dots')}</button></li>`;
    }).join('');
    $('#in').textContent = 'In ' + project;
    $('#states').innerHTML = Object.entries(sets).map(([s, all]) =>
      `<li><a href="#${s}" ${all.length ? '' : 'aria-disabled="true" tabindex="-1"'}>${icon(ICON[s])}${cap(s)}<span class="count n">${all.length}</span></a></li>`).join('');
  }

  /* ---------- the column: every task, and the open one unfolded where it sits ---------- */
  const HEAD = {
    stuck:   [['Attempts', 'c-n'], ['Added', 'c-d opt']],
    claimed: [['Worker', 'c-w opt'], ['Lease', 'c-n']],
    queued:  [['Priority', 'c-n']],
    done:    [['Worker', 'c-w opt']],
  };
  const META = {
    stuck:   t => [t.attempts, ago(t.added)],
    claimed: t => [esc(short(t.worker)), until(t.exp, 3)],
    queued:  t => [t.pri],
    done:    t => [esc(short(t.worker))],
  };

  /* only this project may be waited on: a dependency across repositories is a mistake, not a feature */
  const others = t => tasks.filter(x => x.id !== t.id && x.project === (t.project || project) && ['queued', 'claimed', 'stuck'].includes(x.state) && !(t.after || []).includes(x.id) && !(x.after || []).includes(t.id));
  const waitOpts = t => `<option value="">nothing</option>${others(t).map(x => `<option value="${x.id}">${esc(x.title)}</option>`).join('')}`;
  const waitFor = (t, attr) => `<label class="wait">Wait for <select ${attr}>${waitOpts(t)}</select></label>`;

  function sheet(t) {
    const w = waits(t);
    const state = {
      stuck:   () => `Stuck after ${t.attempts === 1 ? 'one attempt' : t.attempts + ' attempts'}. It will not be claimed again until you reply.`,
      claimed: () => `Claimed by ${esc(t.worker || 'unknown')}, attempt ${t.attempts}. The lease expires in ${until(t.exp, 3)}.`,
      queued:  () => w.length ? `Not claimable until ${w.map(a => `<a href="${href(a.project, a.id)}" data-task="${a.id}">${esc(a.title)}</a>`).join(' and ')} ${w.length === 1 ? 'has' : 'have'} landed.`
                              : '',
      done:    () => t.worker ? `Done. ${esc(t.worker)}, attempt ${t.attempts}.` : `Done. Attempt ${t.attempts}.`,
    }[t.state]();
    const editable = t.state === 'stuck' || t.state === 'queued';
    const pris = [...new Set([1, 2, 3, 4, 5, t.pri])].sort((a, b) => a - b);
    const acts = {
      stuck:   `<form class="reply"><textarea name="reply" required aria-label="Reply" placeholder="Answer the question, or say what should change. The next worker reads the whole thread.">${esc(draft(t.id + ':reply'))}</textarea>
                <div class="fields">${waitFor(t, 'name="after"')}<span class="end"><button type="button" class="outline" data-variant="danger" data-act="drop">Drop</button><button type="submit">Reply and requeue</button></span></div></form>`,
      claimed: `<div class="actions"><button type="button" class="outline" data-variant="danger" data-act="revoke">Revoke</button><p>Revoking ends this attempt now. The task comes to you as stuck so you can say what should change.</p></div>`,
      queued:  `<div class="actions fields"><label>Priority <select data-act="pri">${pris.map(p => `<option ${p === t.pri ? 'selected' : ''}>${p}</option>`).join('')}</select></label>
                ${waitFor(t, 'data-act="after"')}<span class="end"><button type="button" class="outline" data-variant="danger" data-act="drop">Drop</button></span></div>`,
      done:    '',
    }[t.state];
    const edit = editing === t.id
      ? `<form class="edit"><textarea name="text" aria-label="Task text" required>${esc(draft(t.id + ':text') || t.body)}</textarea>
         <div class="fields"><span class="end"><button type="button" class="outline" data-act="cancel">Cancel</button><button type="submit">Save</button></span></div></form>`
      : '';
    const text = edit ? '' : `<p class="body">${esc(t.body)}</p>` + (editable ? `<p><button type="button" class="outline small" data-act="edit">Edit the task text</button></p>` : '');
    const heads = [`${state ? `<p>${state}</p>` : ''}${text}`,
      (t.thread.length ? `<h3>Thread</h3><ol class="thread">${t.thread.map(n => `<li><b>${esc(n.author)}</b>${esc(n.text)}</li>`).join('')}</ol>` : '') +
      `<p class="facts">Task <code>${t.id}</code> in ${esc(t.project)}, priority ${t.pri}, added ${ago(t.added)}.</p>`];
    /* the forms depend on this much; while it holds, an update rewrites the heads and leaves the forms alone */
    return { key: [t.state, edit !== '', t.pri, t.after.length].join(), heads, html: `<div class="sheet"><div data-head>${heads[0]}</div>${edit}<div data-head>${heads[1]}</div>${acts}</div>` };
  }

  /* one row. The node is kept across renders; only what changed is written. */
  function row(el, { t, state }) {
    const w = state === 'queued' ? waits(t) : [];
    const last = t.thread[t.thread.length - 1];
    const why = w.length ? 'Not claimable until this is done: ' + w.map(a => a.title).join('; ')
              : state === 'stuck' && last ? last.author + ': ' + clip(last.text) : '';
    const lead = icon(ICON[state]);
    const open = t.id === sel;
    el.className = `task ${state}${open && fresh === t.id ? ' fresh' : ''}`;
    el.dataset.id = t.id;
    let sum = $(':scope > summary', el);
    if (!sum) { sum = document.createElement('summary'); el.append(sum); }
    sum.innerHTML = `<span class="lead n">${lead}</span><span class="t"><a href="${href(t.project, t.id)}" tabindex="-1">${esc(t.title)}</a>${why ? `<span class="why">${esc(why)}</span>` : ''}</span>` +
      META[state](t).map((v, i) => `<span class="${HEAD[state][i][1]} n">${v}</span>`).join('');
    const had = $(':scope > .sheet', el);
    if (!open) { el.open = false; had?.remove(); el.dataset.key = ''; return; }
    const { key, heads, html } = sheet(t);
    el.open = true;
    if (had && el.dataset.key === key) $$('[data-head]', had).forEach((h, i) => { h.innerHTML = heads[i]; });
    else { had?.remove(); el.insertAdjacentHTML('beforeend', html); el.dataset.key = key; }
  }

  /* keyed reconciliation: a child that is no longer wanted goes first, one that is still wanted is
     updated in place, a new one is made, and order is fixed with the fewest moves */
  function reconcile(parent, items, make, update) {
    const live = new Map([...parent.children].map(c => [c.dataset.k, c])), wanted = new Set(items.map(it => it.k));
    for (const [k, el] of live) if (!wanted.has(k)) { el.remove(); live.delete(k); }
    items.forEach((it, i) => {
      let node = live.get(it.k);
      if (!node) { node = make(it); node.dataset.k = it.k; }
      update(node, it);
      if (parent.children[i] !== node) parent.insertBefore(node, parent.children[i] || null);
    });
  }
  const part = {
    make: it => document.createElement(it.t ? 'details' : it.tag),
    update: (el, it) => it.t ? row(el, it) : (el.innerHTML = it.html, el.className = it.cls || ''),
  };

  function list(sets) {
    const q = $('#q').value.trim().toLowerCase();
    const hit = t => !q || [String(t.id), t.title, t.body, t.worker, ...t.thread.map(n => n.text)].some(x => x && String(x).toLowerCase().includes(q));
    const sections = [];
    for (const [state, all] of Object.entries(sets)) {
      let rows = all.filter(hit);
      if (!rows.length) continue;
      const total = rows.length;
      if (state === 'done' && !q && !allDone) rows = rows.slice(0, DONE_CAP);
      sections.push({ k: state, items: [
        { k: 'head', tag: 'header', cls: 'head', html: `<h2>${cap(state)}${rows.length < total ? `<small>latest ${rows.length} of ${total}</small>` : ''}</h2>${HEAD[state].map(([l, c]) => `<span class="${c}">${l}</span>`).join('')}` },
        ...rows.map(t => ({ k: String(t.id), t, state })),
        ...(rows.length < total ? [{ k: 'more', tag: 'p', cls: 'more-done', html: `<button type="button" class="ghost small" data-act="all-done">Show all ${total} done</button>` }] : []),
      ] });
    }
    if (!sections.length) sections.push({ k: 'empty', tag: 'p', cls: 'empty', html: q ? 'Nothing matches “' + esc(q) + '”.' : 'Nothing in ' + esc(project) + ' yet. Write its first task above.' });
    reconcile($('#list'), sections,
      it => { const el = document.createElement(it.items ? 'section' : it.tag); if (it.items) el.id = it.k; return el; },
      (el, it) => it.items ? reconcile(el, it.items, part.make, part.update) : part.update(el, it));
    fresh = null;
  }


  /* the fire alarm: always every project, never just this one */
  function alarm() {
    const n = s => by(s).length, s = n('stuck'), is = k => k === 1 ? 'is' : 'are', b = tasks.filter(t => t.state === 'queued' && waits(t).length).length;
    const where = Object.entries(stuckBy).sort().map(([p, k]) => `<a href="#stuck" class="warn" data-project="${esc(p)}">${k} in ${esc(p)}</a>`);
    const counts = `${n('claimed')} ${is(n('claimed'))} claimed, ${n('queued')} queued${b ? ` (${b} waiting on other tasks)` : ''}, ${n('done')} done.`;
    $('#status').innerHTML = s
      ? `<div role="alert" data-variant="danger"><p>${icon('alert')} <span class="warn">${s} ${is(s)} stuck</span> (${where.join(', ')}) and ${s === 1 ? 'needs' : 'need'} an answer from you. ${counts}</p></div>`
      : `<p class="text-light">${counts}</p>`;
    document.title = (s ? `(${s} stuck) ` : '') + 'taskd';
  }

  function composer() {
    const f = $('form.add'), a = f.after, was = a.value;
    $('.project', f).textContent = project;
    a.innerHTML = waitOpts({ after: [], id: 0 });
    if ([...a.options].some(o => o.value === was)) a.value = was;     /* a pick from another project does not follow you: that is the link we refuse */
  }

  function render() {
    stuckBy = {};
    for (const t of tasks) if (t.state === 'stuck') stuckBy[t.project] = (stuckBy[t.project] || 0) + 1;
    /* everything below the alarm is one project. One walk buckets it. */
    const sets = { stuck: [], claimed: [], queued: [], blocked: [], done: [] };
    for (const t of tasks) {
      if (!here(t)) continue;
      const bucket = t.state === 'queued' && waits(t).length ? 'blocked' : t.state;
      if (sets[bucket]) sets[bucket].push(t);        /* a state this page does not know is not a reason to die */
    }
    sets.claimed.sort((a, b) => a.exp - b.exp);
    sets.done.sort((a, b) => b.added - a.added || b.id - a.id);
    sets.queued = [...sets.queued.sort(order), ...sets.blocked.sort(order)];
    delete sets.blocked;
    if (sets.done.findIndex(t => t.id === sel) >= DONE_CAP) allDone = true;     /* a link to an old task still opens it */
    const cursor = document.activeElement?.matches?.('#list summary') && document.activeElement.parentElement.dataset.id;   /* where j and k were */
    rail(sets); list(sets); alarm(); composer(); tick();
    if (cursor && !document.activeElement?.matches?.('summary')) $(`details[data-id="${cursor}"] > summary`)?.focus({ preventScroll: true });
  }

  function tick() {
    const now = Date.now();
    $$('[data-until]').forEach(el => {
      const ms = Math.max(0, el.dataset.until - now), s = Math.round(ms / 1000);
      const c = ms < 10 * MIN ? Math.floor(s / 60) + ':' + String(s % 60).padStart(2, '0') : Math.round(ms / MIN) + ' min';
      el.innerHTML = ms < el.dataset.warn * MIN ? `<strong>${c}</strong>` : c;
    });
    for (const t of by('claimed')) {
      if (t.exp && now >= t.exp && !t.expired) { t.expired = true; scheduleReload(); break; }
    }
  }

  function show(id) {
    sel = fresh = id;
    editing = null;
    const picked = id && get(id);
    if (picked && picked.project !== project) { setProject(picked.project); $('#q').value = ''; }   /* the open task and the list agree on the project */
    render();
    if (picked) fetchThread(picked.id);
  }
  function select(id, scroll = true) {
    id = id ? +id : null;
    if (id === sel) return;
    show(id);
    syncURL(id !== null);
    if (id && scroll) $(`details[data-id="${id}"]`)?.scrollIntoView({ block: 'nearest' });
  }

  /* the list carries each task's last note; the open row shows the whole thread, one request */
  async function fetchThread(id) {
    try {
      const res = await api('/tasks/' + id);
      if (!res.ok) return;
      const full = await res.json(), notes = (full.notes || []).map(n => ({ author: n.author, text: n.text }));
      const same = JSON.stringify(notes) === JSON.stringify(threads.get(id) || []);
      threads.set(id, notes);
      const t = get(id);
      if (!t) return;
      t.thread = notes;
      if (full.version !== undefined) t.version = full.version;
      if (!same) render();
    } catch (_) {}
  }

  async function load() {
    let raw;
    try {
      const res = await api('/tasks?limit=1000');
      if (!res.ok) throw 0;
      raw = await res.json();
    } catch (_) { return; }
    tasks = raw.map(mapTask);
    if (tasks.some(t => t.project === newProject)) newProject = '';   /* the + project has a task now; the data carries it */
    const all = projects(), was = project;
    if (!all.includes(project)) { setProject(all[0] || 'taskd'); if (!all.length) newProject = 'taskd'; }   /* a bookmark to a project that is gone, or a fresh database */
    if (sel && get(sel) && get(sel).project !== project) setProject(get(sel).project);   /* a link to a task lands on its project */
    if (first && !sel) sel = tasks.find(t => t.state === 'stuck' && here(t))?.id || null;   /* you arrive, the thing that needs you is already open */
    if (project !== was || first) syncURL();
    first = false;
    render();
    if (sel) fetchThread(sel);
  }

  /* ---------- the dialog: replaces prompt, confirm and alert ---------- */
  function ask({ title, text = '', ok, danger = false, line, para }) {
    const d = $('#ask'), f = $('form', d), field = line || para;
    $('h3', d).textContent = title;
    $('header p', d).textContent = text;
    $('header p', d).hidden = !text;
    $('form > div', d).hidden = !field;
    f.line.hidden = !line; f.line.disabled = !line; f.para.hidden = !para; f.para.disabled = !para;
    f.reset();
    if (field) {
      $('label span', d).textContent = field.label;
      $('[data-hint]', d).textContent = field.hint || '';
      const el = line ? f.line : f.para;
      el.required = !!field.required;
      el.placeholder = field.placeholder || '';
      el.value = field.value || '';
      if (line) field.pattern ? f.line.setAttribute('pattern', field.pattern) : f.line.removeAttribute('pattern');
    }
    const go = $('button[type="submit"]', d);
    go.textContent = ok;
    danger ? go.setAttribute('data-variant', 'danger') : go.removeAttribute('data-variant');
    d.returnValue = '';
    d.showModal();
    return new Promise(done => d.addEventListener('close', () => done(d.returnValue !== 'ok' ? null : line ? f.line.value.trim() : para ? f.para.value.trim() : true), { once: true }));
  }
  $('#ask [data-cancel]').addEventListener('click', () => $('#ask').close('cancel'));

  /* ---------- events ---------- */
  const patch = async (t, data) => {
    if (t.version != null) data.if_version = t.version;
    const res = await api('/tasks/' + t.id, { method: 'PATCH', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(data) });
    if (res.status === 409) { stale(); await load(); return false; }
    if (!res.ok) { fail(res); return false; }
    return true;
  };
  const post = (path, data) => api(path, { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(data) });

  $('#list').addEventListener('click', async e => {
    const sum = e.target.closest('summary');
    if (sum) {
      if (e.target.closest('a') && (e.metaKey || e.ctrlKey || e.shiftKey)) return;   /* a row is still a link you can open elsewhere */
      e.preventDefault();
      if (e.detail && !getSelection().isCollapsed) return;   /* dragging over a title to copy it is not a click */
      const id = +sum.parentElement.dataset.id;
      return select(id === sel ? null : id);
    }
    const link = e.target.closest('.sheet a[data-task]');
    if (link) { e.preventDefault(); return select(link.dataset.task); }
    const b = e.target.closest('button[data-act]');
    if (!b) return;
    const act = b.dataset.act, t = get(sel);
    if (act === 'all-done') { allDone = true; return render(); }
    if (!t) return;
    if (act === 'edit') { editing = t.id; render(); return $('form.edit textarea')?.focus(); }
    if (act === 'cancel') { editing = null; setDraft(t.id + ':text', ''); return render(); }
    if (act === 'drop') {
      if (!await ask({ title: 'Drop this task?', text: `“${t.title}” leaves the queue for good.`, ok: 'Drop', danger: true })) return;
      const res = await api('/tasks/' + t.id, { method: 'DELETE' });
      if (!res.ok) return fail(res);
      select(null);
      ot.toast(t.title, 'Dropped', { placement: 'bottom-center' });
      return load();
    }
    if (act === 'revoke') {
      const why = await ask({ title: 'Revoke this attempt?', text: `${t.worker || 'The worker'} stops now and the task comes to you as stuck.`, ok: 'Revoke', danger: true,
        para: { label: 'Why? This goes in the thread.', placeholder: 'Optional, but the next worker reads it.' } });
      if (why === null) return;
      if (why) { const r = await post('/tasks/' + t.id + '/notes', { author: 'you', text: why }); if (!r.ok) return fail(r); }
      const r = await post('/tasks/' + t.id + '/bury', { worker: t.worker });
      if (!r.ok) return fail(r);
      return load();
    }
  });

  $('#list').addEventListener('input', e => {
    if (e.target.matches('textarea[name]') && sel) setDraft(sel + ':' + e.target.name, e.target.value);
  });

  $('#list').addEventListener('change', async e => {
    const t = get(sel), a = e.target.dataset.act;
    if (!t || !a) return;
    if (a === 'pri' && await patch(t, { priority: +e.target.value })) return load();
    if (a === 'after' && e.target.value && await patch(t, { after: [...t.after, +e.target.value] })) return load();
  });

  $('#list').addEventListener('submit', async e => {
    e.preventDefault();
    const f = e.target, v = new FormData(f), t = get(sel);
    if (!t) return;
    if (f.matches('.edit')) {
      const rest = v.get('text').trim();
      if (!await patch(t, { body: t.title ? (rest ? t.title + '\n\n' + rest : t.title) : rest })) return;
      editing = null; setDraft(t.id + ':text', '');
      return load();
    }
    if (f.matches('.reply')) {
      const note = await post('/tasks/' + t.id + '/notes', { author: 'you', text: v.get('reply').trim() });
      if (!note.ok) return fail(note);
      setDraft(t.id + ':reply', '');
      if (v.get('after') && !await patch(t, { after: [...t.after, +v.get('after')] })) return;
      const kick = await post('/tasks/' + t.id + '/kick', {});
      if (!kick.ok) return fail(kick);
      ot.toast(t.title, 'Replied and requeued', { placement: 'bottom-center' });
      return load();
    }
  });

  /* the blank task at the top of the column */
  const add = $('form.add');
  const shut = () => { add.classList.remove('open'); add.body.scrollTop = 0; if (add.contains(document.activeElement)) document.activeElement.blur(); };
  add.addEventListener('focusin', () => add.classList.add('open'));
  addEventListener('pointerdown', e => { if (!add.contains(e.target)) add.classList.remove('open'); });
  addEventListener('focusin', e => { if (!add.contains(e.target)) add.classList.remove('open'); });
  add.addEventListener('click', e => {
    if (!e.target.closest('[data-act="clear"]')) return;
    add.reset(); shut();
  });
  add.addEventListener('submit', async e => {
    e.preventDefault();
    const v = new FormData(add), body = v.get('body').trim();
    const res = await post('/tasks', { body, project, priority: +v.get('pri'), after: v.get('after') ? [+v.get('after')] : [] });
    if (!res.ok) return fail(res);
    add.reset(); shut();
    ot.toast(body.split('\n')[0], 'Added to the queue', { placement: 'bottom-center' });
    await load();
  });

  function go(p, open) {
    setProject(p);
    sel = open || null; editing = null;
    $('#q').value = '';
    document.body.removeAttribute('data-sidebar-open');
    syncURL();
    render();
    if (sel) fetchThread(sel);
  }
  /* the row menu: one popover, opened beside whichever row asked for it */
  const menu = $('#project-menu');
  let menuFor = null, menuRow = null;
  function openMenu(btn) {
    menuFor = btn.dataset.menuFor;
    menuRow = btn.parentElement;
    menuRow.dataset.menu = '';
    menu.showPopover();                          /* laid out first, so it can be measured */
    const r = btn.getBoundingClientRect();
    menu.style.top = r.bottom + 2 + 'px';
    menu.style.left = Math.min(r.left, innerWidth - menu.offsetWidth - 8) + 'px';
    $('[role="menuitem"]', menu).focus();
  }
  menu.addEventListener('toggle', e => {
    if (e.newState !== 'closed') return;
    if (menuRow) delete menuRow.dataset.menu;
    menuRow = menuFor = null;
  });
  menu.addEventListener('click', e => {
    const act = e.target.closest('[role="menuitem"]')?.dataset.act, p = menuFor;
    if (!act) return;
    menu.hidePopover();
    if (act === 'rename') renameProject(p); else dropProject(p);
  });
  menu.addEventListener('keydown', e => {
    const items = $$('[role="menuitem"]', menu), i = items.indexOf(document.activeElement);
    if (e.key === 'ArrowDown' || e.key === 'ArrowUp') { e.preventDefault(); items[(i + (e.key === 'ArrowDown' ? 1 : items.length - 1)) % items.length].focus(); }
  });
  async function renameProject(p) {
    const name = await ask({ title: 'Rename ' + p, ok: 'Rename', line: { label: 'Name', required: true, pattern: NAME, value: p, hint: 'Every task in it moves to the new name.' } });
    if (!name || name === p) return;
    if (p === newProject) { newProject = name; return go(name); }   /* a name with no task behind it is renamed in place */
    const res = await api('/projects/' + encodeURIComponent(p), { method: 'PATCH', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ name }) });
    if (!res.ok) return fail(res);
    if (p === project) { setProject(name); syncURL(); }
    await load();
  }
  $('#projects').addEventListener('click', e => {
    const more = e.target.closest('button[data-menu-for]');
    if (more) return openMenu(more);
    const a = e.target.closest('a[data-project]');
    if (!a || e.metaKey || e.ctrlKey || e.shiftKey) return;
    e.preventDefault();
    go(a.dataset.project);                         /* walking away from an empty + project closes it */
    $('#main').scrollTop = 0;
  });
  async function dropProject(p) {
    if (p === newProject) {                      /* the + project is a name with no task behind it */
      newProject = '';
      return go(projects()[0] || 'taskd');
    }
    const mine = tasks.filter(t => t.project === p);
    const open = mine.filter(t => t.state !== 'done').length;
    const typed = await ask({
      title: 'Delete ' + p + '?',
      text: `Every task in it goes: ${open} open and ${mine.length - open} done, with their threads.`,
      ok: 'Delete the project', danger: true,
      line: { label: 'Type the project name to confirm', required: true, pattern: p.replace(/[.*+?^${}()|[\]\\]/g, '\\$&') },
    });
    if (!typed) return;
    const res = await api('/projects/' + encodeURIComponent(p), { method: 'DELETE' });
    if (!res.ok) return fail(res);             /* 409 while a worker holds a task: the daemon decides */
    ot.toast(p, 'Deleted', { placement: 'bottom-center' });
    await load();                              /* if the open project is the one that went, load() lands on the first remaining */
  }
  $('#add-project').addEventListener('click', async () => {
    const name = await ask({ title: 'New project', ok: 'Open it', line: { label: 'Name', required: true, pattern: NAME, placeholder: 'taskd-web', hint: 'Letters, digits, dots, dashes and underscores, up to 64. It exists once it has a task.' } });
    if (!name) return;
    newProject = name;
    go(name);
    add.body.focus();
  });
  const jump = href => { document.body.removeAttribute('data-sidebar-open'); $(href)?.scrollIntoView({ block: 'start' }); };
  $('#states').addEventListener('click', e => {
    const a = e.target.closest('a');
    if (a) { e.preventDefault(); jump(a.getAttribute('href')); }
  });
  $('#status').addEventListener('click', e => {
    const a = e.target.closest('a[data-project]');
    if (!a) return;
    e.preventDefault();
    const p = a.dataset.project, s = tasks.find(t => t.state === 'stuck' && t.project === p);   /* the alarm takes you to the thing that is on fire */
    if (p !== project) go(p, s?.id); else if (s) select(s.id, false);
    jump('#stuck');
  });
  $('#q').addEventListener('input', render);

  /* light or dark: the choice is kept; with nothing chosen the page follows the system */
  const applyTheme = () => {
    const t = store('theme') || '';
    document.documentElement.style.colorScheme = t || '';
    $$('#theme button').forEach(b => b.setAttribute('aria-pressed', String(b.dataset.theme === (t || (matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light')))));
  };
  $('#theme').addEventListener('click', e => {
    const b = e.target.closest('button[data-theme]');
    if (!b) return;
    store('theme', b.dataset.theme);
    applyTheme();
  });
  matchMedia('(prefers-color-scheme: dark)').addEventListener('change', applyTheme);
  applyTheme();

  addEventListener('keydown', e => {
    const el = document.activeElement, typing = /INPUT|TEXTAREA|SELECT/.test(el?.tagName);
    if ($('#ask').open) return;
    if (e.key === 'Enter' && (e.metaKey || e.ctrlKey) && el?.form) return el.form.requestSubmit();
    if (e.key === 'Escape') { add.contains(el) ? shut() : typing ? el.blur() : select(null); return; }
    if (typing || e.metaKey || e.ctrlKey || e.altKey) return;
    if (e.key === '/') { e.preventDefault(); $('#q').focus(); }
    if (e.key === 'n') { e.preventDefault(); $('#main').scrollTop = 0; add.body.focus(); }
    if (e.key === 'j' || e.key === 'k') {
      /* j and k move a cursor, enter opens: rows unfolding under a moving cursor would make the list jump */
      const rows = $$('#list summary'), at = el?.matches?.('summary') ? el : $(`details[data-id="${sel}"] > summary`), i = rows.indexOf(at);
      const next = rows[e.key === 'j' ? Math.min(rows.length - 1, i + 1) : Math.max(0, i - 1)];
      if (next) { next.focus({ preventScroll: true, focusVisible: true }); next.scrollIntoView({ block: 'nearest' }); }
    }
  });

  let reloadTimer;
  function scheduleReload() {
    clearTimeout(reloadTimer);
    reloadTimer = setTimeout(load, 100 + Math.random() * 400);
  }

  let hadError = false, es;
  try {
    es = new EventSource('/api/events');
    es.addEventListener('change', scheduleReload);
    es.onerror = () => { hadError = true; };
    es.onopen = () => { if (hadError) { hadError = false; scheduleReload(); } };
  } catch (_) {}

  sel = +new URLSearchParams(location.search).get('t') || null;
  load();
  setInterval(tick, 1000);
})();
</script>
</body>
</html>
