<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="light dark">
<title>taskd</title>
<!--
  Two regions and one rule between them. Left: every task, in the order you need them.
  Right: the task you picked, or, when you have picked nothing, a blank task to write.
  The page never scrolls; each side scrolls on its own.
  Colour: Radix Colors, neutral gray plus blue for links and red for things about to go wrong.
-->
<style>
:root {
  color-scheme: light dark;
  /* Radix Colors 3.0 (gray, blue, red), each step used for the job Radix documents for it:
     1 page background, 3 control background, 4 hovered, 5 pressed, 6 separators,
     7 control borders, 8 hovered borders and focus, 11 coloured text, 12 text. */
  --bg:      light-dark(#fcfcfc, #111111);   /* gray 1 */
  --control: light-dark(#f0f0f0, #222222);   /* gray 3 */
  --hover:   light-dark(#e8e8e8, #2a2a2a);   /* gray 4 */
  --press:   light-dark(#e0e0e0, #313131);   /* gray 5 */
  --rule:    light-dark(#d9d9d9, #3a3a3a);   /* gray 6 */
  --edge:    light-dark(#cecece, #484848);   /* gray 7 */
  --edge-hi: light-dark(#bbbbbb, #606060);   /* gray 8 */
  --quiet:   light-dark(#646464, #b4b4b4);   /* gray 11 */
  --fg:      light-dark(#202020, #eeeeee);   /* gray 12 */
  --link:    light-dark(#0d74ce, #70b8ff);   /* blue 11 */
  --focus:   light-dark(#5eb1ef, #2870bd);   /* blue 8 */
  --tint:    light-dark(#e6f4fe, #0d2847);   /* blue 3, the selected row */
  --warn:    light-dark(#ce2c31, #ff9592);   /* red 11 */

  /* Two voices. The document speaks in a sturdy reading serif: Carter's Charter, then his Sitka on
     Windows. Tables and controls are working matter and use the platform's own UI face, the one the
     native buttons were drawn for. Sans runs smaller so its x-height matches the serif beside it. */
  --read: Charter, "Bitstream Charter", "Charis SIL", "Sitka Text", Cambria, Georgia, serif;
  --work: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  --work-size: 0.89rem;
}
html { background: var(--bg); color: var(--fg); }
html { font: 18px/1.5 var(--read); font-variant-numeric: lining-nums; }
html, body { height: 100%; }
body { margin: 0 auto; max-width: 88rem; padding: 1.25rem 2rem 0; display: grid; grid-template-rows: auto minmax(0, 1fr); height: 100dvh; overflow: hidden; box-sizing: border-box; }
table { font-family: var(--work); font-size: var(--work-size); }

/* One control. Buttons, menus and fields share a height, a border, a radius and a face;
   the only difference is that things you type into are lighter than things you press. */
button, select, input, textarea {
  font: var(--work-size)/1.2 var(--work); color: var(--fg); box-sizing: border-box; margin: 0;
  border: 1px solid var(--edge); border-radius: 3px;
}
button, select, input { height: 2rem; padding: 0 0.7rem; }
textarea { padding: 0.5rem 0.7rem; line-height: 1.45; }
input, textarea { background: var(--bg); }
::placeholder { color: var(--quiet); opacity: 1; }
button, select { background: var(--control); cursor: pointer; }
button:hover, select:hover { background: var(--hover); border-color: var(--edge-hi); }
input:hover, textarea:hover { border-color: var(--edge-hi); }
button:active { background: var(--press); }
:focus-visible { outline: 2px solid var(--focus); outline-offset: 1px; }
a, a:visited { color: var(--link); text-underline-offset: 0.15em; text-decoration-thickness: 1px; }
strong, .warn { color: var(--warn); }
header, #pane, table, th, .actions, form.reply { border-color: var(--rule) !important; }
code { font: 0.88em ui-monospace, "SF Mono", Menlo, Consolas, monospace; }
p { margin: 0 0 1rem; }

header { display: flex; flex-wrap: wrap; align-items: baseline; gap: 0.25rem 1.5rem; padding-bottom: 1rem; border-bottom: 1px solid; }
h1 { font-size: 1.45rem; font-weight: normal; line-height: 1.1; margin: 0; }
header p { margin: 0; flex: 1 1 24rem; }
header form { display: flex; align-items: center; gap: 0.6rem; }
header input { width: 14rem; }

main { display: grid; grid-template-columns: minmax(0, 1.3fr) minmax(0, 1fr); min-height: 0; }
#list, #pane { overflow-y: auto; min-height: 0; padding-bottom: 4rem; }
#list { padding-right: 2.5rem; }
#pane { border-left: 1px solid; padding: 1.1rem 0.25rem 4rem 2.5rem; }

/* the list */
section { margin-bottom: 2.25rem; }
h2 { font-size: 1.45rem; font-weight: normal; font-style: italic; line-height: 1.2; margin: 0; }
#list h2 { position: sticky; top: 0; z-index: 1; background: var(--bg); padding: 1.1rem 0 0.5rem; }
table { width: 100%; border-collapse: collapse; border-bottom: 1px solid; }
th { font-weight: normal; text-align: left; border-bottom: 1px solid; }
th, td { padding: 0.28rem 1.25rem 0.28rem 0; vertical-align: baseline; white-space: nowrap; }
th:first-child, td:first-child { padding-left: 0.4rem; }
th:last-child, td:last-child { padding-right: 0.4rem; }
.n { text-align: right; font-variant-numeric: lining-nums tabular-nums; }
td.task { width: 100%; white-space: normal; }
td.task a { text-decoration: none; }
td.task a:hover, tr[aria-current] td.task a { text-decoration: underline; }
td.task .why { display: block; font: italic 1rem/1.45 var(--read); margin-top: 0.1rem; }
tbody tr { cursor: pointer; }
tbody tr[aria-current] td { background: var(--tint); }

/* the pane */
#pane h2 { margin-bottom: 0.75rem; }
#pane h3 { font-size: 1rem; font-weight: normal; font-style: italic; margin: 1.5rem 0 0.25rem; }
#pane > * { max-width: 36rem; }
.body { white-space: pre-wrap; }
#pane ol { margin: 0 0 1rem; padding-left: 1.3rem; }
.actions { display: flex; flex-wrap: wrap; gap: 0.6rem 1rem; margin-top: 1.5rem; padding-top: 1rem; border-top: 1px solid; }
.actions p { flex: 1 1 100%; margin: 0.4rem 0 0; }
form.add textarea, form.reply textarea, form.edit textarea { display: block; width: 100%; min-height: 7rem; resize: vertical; margin-bottom: 0.9rem; }
form.add textarea { height: 42dvh; }
form.reply { margin-top: 1.5rem; padding-top: 1rem; border-top: 1px solid; }
form.reply .row, .actions { align-items: end; }
form.reply .row { display: flex; flex-wrap: wrap; gap: 0.75rem 1.5rem; }
form.reply .row button { margin-left: auto; }
/* every labelled control in the pane: label above, control below, one row that wraps */
#pane label { display: block; }
#pane label > input, #pane label > select { display: block; margin-top: 0.15rem; }
#pane label.wait { flex: 1 1 8rem; min-width: 0; }             /* sits beside the other fields and takes the slack */
#pane form .row::after { content: ""; flex-basis: 100%; height: 0; order: 8; }   /* fields on one line, the action on the next */
#pane form .row button { order: 9; margin-left: auto; }
#pane label.wait select { width: 100%; min-width: 0; text-overflow: ellipsis; }
form.add .row { display: flex; flex-wrap: wrap; align-items: end; gap: 0.75rem 1.5rem; }
form.add label { display: block; }
form.add label > * { display: block; }
form.add button { margin-left: auto; }

@media (max-width: 820px) {
  body { height: auto; overflow: visible; padding: 1rem 1rem 3rem; display: block; }
  main { display: flex; flex-direction: column; }
  #list, #pane { overflow: visible; padding: 0; border: 0; }
  #pane { order: 2; border-top: 1px solid; padding-top: 1rem; }
  body.reading #pane { order: -1; border-top: 0; border-bottom: 1px solid; margin-bottom: 1rem; padding-bottom: 1rem; }
  #list h2 { position: static; }
  .opt { display: none; }
}
</style>
</head>
<body>

<header>
  <h1>taskd</h1>
  <p id="status"></p>
  <form id="tools">
    <input type="search" id="q" aria-label="Filter tasks" placeholder="Filter">
    <button type="button" id="new" hidden>New task</button>
  </form>
</header>

<main>
  <div id="list"></div>
  <div id="pane" aria-live="polite"></div>
</main>

<script>
(() => {
  const MIN = 60e3;
  let tasks = [];
  let sel = null;

  /* ---------- helpers ---------- */
  const $ = (s, r = document) => r.querySelector(s), $$ = (s, r = document) => [...r.querySelectorAll(s)];
  const esc = s => String(s ?? '').replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
  const by = s => tasks.filter(t => t.state === s);
  const get = id => tasks.find(t => t.id === +id);
  const waits = t => (t.after || []).map(get).filter(a => a && a.state !== 'done');
  const order = (a, b) => a.pri - b.pri || a.added - b.added;
  const ready = () => by('queued').filter(t => !waits(t).length).sort(order);
  const blocked = () => by('queued').filter(t => waits(t).length).sort(order);
  const ago = ts => {
    if (!ts) return '';
    const m = (Date.now() - ts) / MIN;
    return m < 1 ? 'just now' : m < 60 ? Math.round(m) + ' min ago' : m < 90 ? '1 hour ago' : m < 24 * 60 ? Math.round(m / 60) + ' hours ago' : 'yesterday';
  };
  const until = (ts, warn) => `<span data-until="${ts}" data-warn="${warn}"></span>`;

  function mapTask(raw) {
    const nl = (raw.body || '').indexOf('\n');
    const title = nl === -1 ? (raw.body || '') : raw.body.slice(0, nl);
    const rest = nl === -1 ? '' : raw.body.slice(nl + 1).replace(/^\n+/, '');
    const stateMap = { buried: 'stuck', leased: 'claimed', pending: 'queued', done: 'done' };
    return {
      id: raw.id,
      state: stateMap[raw.status] || raw.status,
      status: raw.status,
      title,
      body: rest,
      rawBody: raw.body || '',
      project: raw.project || '',
      pri: raw.priority,
      after: Array.isArray(raw.after) ? raw.after : [],
      attempts: raw.claim_count || 0,
      worker: raw.worker || '',
      exp: (raw.lease_expires || 0) * 1000,
      added: (raw.created_at || 0) * 1000,
      version: raw.version,
      thread: [],
      threadLoaded: false,
    };
  }

  /* ---------- left: every task ---------- */
  const COLS = {
    stuck:   ['<th>Task</th><th class="n">Attempts</th><th class="n opt">Added</th>', t => `<td class="n">${t.attempts}</td><td class="n opt">${ago(t.added)}</td>`],
    claimed: ['<th>Task</th><th>Worker</th><th class="n">Lease</th>', t => `<td>${esc(t.worker)}</td><td class="n">${until(t.exp, 3)}</td>`],
    queued:  ['<th></th><th>Task</th><th class="n opt">Project</th><th class="n">Priority</th>', t => `<td class="n opt">${esc(t.project)}</td><td class="n">${t.pri}</td>`],
    done:    ['<th>Task</th><th class="n opt">Project</th>', t => `<td class="n opt">${esc(t.project)}</td>`],
  };

  function list() {
    const q = $('#q').value.trim().toLowerCase();
    const hit = t => !q || [String(t.id), t.title, t.body, t.project, t.worker, ...(t.thread || [])].some(x => x && String(x).toLowerCase().includes(q));
    const rdy = ready(), sets = { stuck: by('stuck'), claimed: by('claimed').sort((a, b) => a.exp - b.exp), queued: [...rdy, ...blocked()], done: by('done').sort((a, b) => b.added - a.added || b.id - a.id) };
    $('#list').innerHTML = Object.entries(sets).map(([state, all]) => {
      const rows = all.filter(hit);
      if (!rows.length) return '';
      return `<section id="${state}"><h2>${state[0].toUpperCase() + state.slice(1)}</h2><table><thead><tr>${COLS[state][0]}</tr></thead><tbody>` +
        rows.map(t => {
          const w = state === 'queued' ? waits(t) : [];
          const under = state === 'queued' && w.length ? 'Not claimable until this is done: ' + w.map(a => a.title).join('; ') : '';
          return `<tr data-id="${t.id}" ${t.id === sel ? 'aria-current="true"' : ''}>${state === 'queued' ? `<td class="n">${w.length ? '' : rdy.indexOf(t) + 1}</td>` : ''}` +
          `<td class="task"><a href="#${t.id}">${esc(t.title)}</a>${under ? `<span class="why">${esc(under)}</span>` : ''}</td>${COLS[state][1](t)}</tr>`;
        }).join('') +
        `</tbody></table></section>`;
    }).join('') || '<p style="padding-top:1.1rem">Nothing matches.</p>';

    const n = s => by(s).length, s = n('stuck'), is = k => k === 1 ? 'is' : 'are', b = blocked().length;
    $('#status').innerHTML = (s ? `<a href="#stuck" class="warn">${s} ${is(s)} stuck</a> and ${s === 1 ? 'needs' : 'need'} an answer from you. ` : '') +
      `<a href="#claimed">${n('claimed')} ${is(n('claimed'))} claimed</a>, <a href="#queued">${n('queued')} queued</a>${b ? ` (${b} waiting on other tasks)` : ''}, <a href="#done">${n('done')} done</a>.`;
    document.title = (s ? `(${s} stuck) ` : '') + 'taskd';
    tick();
  }

  /* ---------- right: the task you picked, or a blank one ---------- */
  const others = t => tasks.filter(x => x.id !== t.id && ['queued', 'claimed', 'stuck'].includes(x.state) && !(t.after || []).includes(x.id) && !(x.after || []).includes(t.id)).sort((a, b) => (b.project === t.project) - (a.project === t.project));
  const waitFor = t => `<label class="wait">Wait for <select name="after"><option value="">nothing</option>${others(t).map(x => `<option value="${x.id}">${esc(x.title)}</option>`).join('')}</select></label>`;

  function pane() {
    const t = get(sel), el = $('#pane');
    document.body.classList.toggle('reading', !!t);
    $('#new').hidden = !t;
    if (!t) {
      if ($('form.add', el) && $$('textarea', el).some(a => a.value)) return;
      el.dataset.key = '';
      el.innerHTML = `<h2>New task</h2><form class="add">
        <textarea name="body" required aria-label="Task" placeholder="The first line is the title.&#10;&#10;The rest is what the worker will read."></textarea>
        <div class="row"><label>Project <input name="project" value="taskd" size="8" required></label>
          <label>Priority <select name="pri"><option value="1">1, first</option><option>2</option><option selected>3</option><option>4</option><option value="5">5, last</option></select></label>
          ${waitFor({ after: [], id: 0 })}
          <button>Add to the queue</button></div></form>`;
      return;
    }
    const key = [t.id, t.state, (t.thread || []).length, t.pri, (t.after || []).length, (t.body || '').length].join();
    if (el.dataset.key === key && $$('textarea', el).some(a => a.value)) return tick();
    el.dataset.key = key;

    const w = waits(t), pos = ready().indexOf(t) + 1;
    const state = {
      stuck:   () => `Stuck after ${t.attempts === 1 ? 'one attempt' : t.attempts + ' attempts'}. It will not be claimed again until you reply.`,
      claimed: () => `Claimed by ${esc(t.worker || 'unknown')}, attempt ${t.attempts}. The lease expires in ${until(t.exp, 3)}.`,
      queued:  () => w.length ? `Not claimable until ${w.map(a => `<a href="#${a.id}">${esc(a.title)}</a>`).join(' and ')} ${w.length === 1 ? 'has' : 'have'} landed.`
                              : `Number ${pos} in the queue.`,
      done:    () => t.worker ? `Done. ${esc(t.worker)}, attempt ${t.attempts}.` : `Done. Attempt ${t.attempts}.`,
    }[t.state]();
    const editable = t.state === 'stuck' || t.state === 'queued';
    const acts = {
      stuck:   `<form class="reply"><textarea name="reply" required aria-label="Reply" placeholder="Answer the question, or say what should change. The next worker reads the whole thread."></textarea>
                <div class="row">${waitFor(t)}<button>Reply and requeue</button></div></form>
                <div class="actions"><button data-act="drop">Drop</button></div>`,
      claimed: `<div class="actions"><button data-act="revoke">Revoke</button><p>Revoking ends this attempt now. The task comes to you as stuck so you can say what should change.</p></div>`,
      queued:  `<div class="actions"><label>Priority <select data-act="pri">${[1, 2, 3, 4, 5].map(p => `<option ${p === t.pri ? 'selected' : ''}>${p}</option>`).join('')}</select></label>
                ${waitFor(t).replace('name="after"', 'data-act="after"')}<button data-act="drop">Drop</button></div>`,
      done:    '',
    }[t.state];
    el.innerHTML = `<h2>${esc(t.title)}</h2><p>${state}</p>${t.body ? `<p class="body">${esc(t.body)}</p>` : `<p class="body"></p>`}` +
      (editable ? `<p><button data-act="edit">Edit the task text</button></p>` : '') +
      (t.thread && t.thread.length ? `<h3>Thread</h3><ol>${t.thread.map(l => `<li>${esc(l)}</li>`).join('')}</ol>` : '') +
      `<p>Task <code>${t.id}</code> in ${esc(t.project)}, priority ${t.pri}, added ${ago(t.added)}.</p>${acts}`;
    tick();
  }

  function tick() {
    const now = Date.now();
    $$('[data-until]').forEach(el => {
      const ms = Math.max(0, el.dataset.until - now), s = Math.round(ms / 1000);
      const c = ms < 10 * MIN ? Math.floor(s / 60) + ':' + String(s % 60).padStart(2, '0') : Math.round(ms / MIN) + ' min';
      el.innerHTML = ms < el.dataset.warn * MIN ? `<strong>${c}</strong>` : c;
    });
    for (const t of by('claimed')) {
      if (t.exp && now >= t.exp && !t.expired) {
        t.expired = true;
        scheduleReload();
        break;
      }
    }
  }

  const render = () => { list(); pane(); };

  function select(id) {
    id = id ? +id : null;
    if (id && sel === id) return;
    sel = id;
    history.replaceState(null, '', id ? '#' + id : location.pathname);
    $('#pane').innerHTML = '';
    $('#pane').dataset.key = '';
    render();
    $('#pane').scrollTop = 0;
    if (sel) {
      const t = get(sel);
      if (t) fetchNotes(t);
    }
  }

  async function fetchNotes(t) {
    try {
      const res = await fetch('/tasks/' + t.id);
      if (!res.ok) return;
      const full = await res.json();
      t.thread = (full.notes || []).map(n => `${n.author}: ${n.text}`);
      t.threadLoaded = true;
      if (full.version !== undefined) t.version = full.version;
      if (sel === t.id) pane();
    } catch (_) {}
  }

  function showWarn(err) {
    let p = $('#pane p.warn');
    if (!p) {
      p = document.createElement('p');
      p.className = 'warn';
      $('#pane').prepend(p);
    }
    p.textContent = (err && err.field ? err.field + ': ' : '') + (err && err.error ? err.error : 'Request failed');
  }

  function showWarnMsg(msg) {
    let p = $('#pane p.warn');
    if (!p) {
      p = document.createElement('p');
      p.className = 'warn';
      $('#pane').prepend(p);
    }
    p.textContent = msg;
  }

  async function load() {
    try {
      const res = await fetch('/tasks?limit=1000');
      if (!res.ok) return;
      const raw = await res.json();
      tasks = raw.map(mapTask);
      render();
      if (sel) {
        const t = get(sel);
        if (t && !t.threadLoaded) fetchNotes(t);
      }
    } catch (_) {}
  }

  /* ---------- events ---------- */
  $('#list').addEventListener('click', e => {
    const tr = e.target.closest('tbody tr');
    if (tr) { e.preventDefault(); select(tr.dataset.id); }
  });
  $('#status').addEventListener('click', e => {
    const a = e.target.closest('a');
    if (a) { e.preventDefault(); $(a.getAttribute('href'))?.scrollIntoView({ block: 'start' }); }
  });
  $('#new').addEventListener('click', () => {
    select(null);
    $('form.add textarea')?.focus();
  });
  $('#q').addEventListener('input', list);
  $('#tools').addEventListener('submit', e => e.preventDefault());

  $('#pane').addEventListener('click', async e => {
    const link = e.target.closest('a[href^="#"]');
    if (link) { e.preventDefault(); return select(link.getAttribute('href').slice(1)); }
    const b = e.target.closest('button[data-act]');
    if (!b) return;
    const t = get(sel), act = b.dataset.act;
    if (!t) return;
    if (act === 'drop') {
      if (!confirm(`Drop “${t.title}”? It leaves the queue.`)) return;
      const res = await fetch('/tasks/' + t.id, { method: 'DELETE' });
      if (!res.ok) {
        const err = await res.json().catch(() => ({}));
        return showWarn(err);
      }
      select(null);
      return load();
    }
    if (act === 'revoke') {
      const why = prompt(`Why are you revoking ${t.worker}? This goes in the thread.`);
      if (why === null) return;
      if (why.trim()) {
        const noteRes = await fetch('/tasks/' + t.id + '/notes', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ author: 'you', text: why.trim() }),
        });
        if (!noteRes.ok) {
          const err = await noteRes.json().catch(() => ({}));
          return showWarn(err);
        }
      }
      const buryRes = await fetch('/tasks/' + t.id + '/bury', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ worker: t.worker }),
      });
      if (!buryRes.ok) {
        const err = await buryRes.json().catch(() => ({}));
        return showWarn(err);
      }
      return load();
    }
    if (act === 'edit') {
      const p = $('.body', $('#pane'));
      const f = document.createElement('form');
      f.className = 'edit';
      f.innerHTML = `<textarea name="text" aria-label="Task text" required></textarea><button>Save</button>`;
      f.text.value = t.body;
      if (p) p.replaceWith(f);
      b.parentElement.remove();
      return f.text.focus();
    }
  });

  $('#pane').addEventListener('change', async e => {
    const t = get(sel), a = e.target.dataset.act;
    if (!t || !a) return;
    if (a === 'pri') {
      const patchData = { priority: +e.target.value };
      if (t.version != null) patchData.version = t.version;
      const res = await fetch('/tasks/' + t.id, {
        method: 'PATCH',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify(patchData),
      });
      if (res.status === 409) {
        showWarnMsg('Changed elsewhere, reloading');
        return load();
      }
      if (!res.ok) {
        const err = await res.json().catch(() => ({}));
        return showWarn(err);
      }
      return load();
    }
    if (a === 'after' && e.target.value) {
      const patchData = { after: [...t.after, +e.target.value] };
      if (t.version != null) patchData.version = t.version;
      const res = await fetch('/tasks/' + t.id, {
        method: 'PATCH',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify(patchData),
      });
      if (res.status === 409) {
        showWarnMsg('Changed elsewhere, reloading');
        return load();
      }
      if (!res.ok) {
        const err = await res.json().catch(() => ({}));
        return showWarn(err);
      }
      return load();
    }
  });

  $('#pane').addEventListener('submit', async e => {
    e.preventDefault();
    const f = e.target, v = new FormData(f), t = get(sel);
    if (f.matches('.edit')) {
      const newRest = v.get('text').trim();
      const newBody = t.title ? (newRest ? t.title + '\n\n' + newRest : t.title) : newRest;
      const patchData = { body: newBody };
      if (t.version != null) patchData.version = t.version;
      const res = await fetch('/tasks/' + t.id, {
        method: 'PATCH',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify(patchData),
      });
      if (res.status === 409) {
        showWarnMsg('Changed elsewhere, reloading');
        return load();
      }
      if (!res.ok) {
        const err = await res.json().catch(() => ({}));
        return showWarn(err);
      }
      $('#pane').dataset.key = '';
      return load();
    }
    if (f.matches('.reply')) {
      const text = v.get('reply').trim();
      const noteRes = await fetch('/tasks/' + t.id + '/notes', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ author: 'you', text }),
      });
      if (!noteRes.ok) {
        const err = await noteRes.json().catch(() => ({}));
        return showWarn(err);
      }
      if (v.get('after')) {
        const patchData = { after: [...t.after, +v.get('after')] };
        if (t.version != null) patchData.version = t.version;
        const patchRes = await fetch('/tasks/' + t.id, {
          method: 'PATCH',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(patchData),
        });
        if (patchRes.status === 409) {
          showWarnMsg('Changed elsewhere, reloading');
          return load();
        }
        if (!patchRes.ok) {
          const err = await patchRes.json().catch(() => ({}));
          return showWarn(err);
        }
      }
      const kickRes = await fetch('/tasks/' + t.id + '/kick', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({}),
      });
      if (!kickRes.ok) {
        const err = await kickRes.json().catch(() => ({}));
        return showWarn(err);
      }
      $('#pane').dataset.key = '';
      return load();
    }
    const body = v.get('body').trim();
    const project = v.get('project').trim();
    const priority = +v.get('pri');
    const after = v.get('after') ? [+v.get('after')] : [];
    const res = await fetch('/tasks', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ body, project, priority, after }),
    });
    if (!res.ok) {
      const err = await res.json().catch(() => ({}));
      return showWarn(err);
    }
    f.reset();
    await load();
  });

  addEventListener('keydown', e => {
    const typing = /INPUT|TEXTAREA|SELECT/.test(document.activeElement?.tagName);
    if (e.key === 'Enter' && (e.metaKey || e.ctrlKey) && document.activeElement?.form) return document.activeElement.form.requestSubmit();
    if (e.key === 'Escape') { typing ? document.activeElement?.blur() : select(null); return; }
    if (typing || e.metaKey || e.ctrlKey || e.altKey) return;
    if (e.key === '/') { e.preventDefault(); $('#q').focus(); }
    if (e.key === 'n') { e.preventDefault(); $('#new').click(); }
    if (e.key === 'j' || e.key === 'k') {
      const ids = $$('#list tbody tr').map(r => r.dataset.id), i = ids.indexOf(String(sel)), next = ids[e.key === 'j' ? Math.min(ids.length - 1, i + 1) : Math.max(0, i - 1)];
      if (next) { select(+next); $(`tr[data-id="${next}"]`)?.scrollIntoView({ block: 'nearest' }); }
    }
  });

  let reloadTimer;
  function scheduleReload() {
    clearTimeout(reloadTimer);
    reloadTimer = setTimeout(load, 100 + Math.random() * 400);
  }

  let hadError = false;
  const es = new EventSource('/api/events');
  es.addEventListener('change', scheduleReload);
  es.onerror = () => { hadError = true; };
  es.onopen = () => {
    if (hadError) {
      hadError = false;
      scheduleReload();
    }
  };

  sel = location.hash.slice(1) ? +location.hash.slice(1) : null;
  load();
  setInterval(tick, 1000);
})();
</script>
</body>
</html>
