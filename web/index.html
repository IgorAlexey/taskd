<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>taskd</title>
<style>
  :root {
    --bg: #0d1117;
    --surface: #161b22;
    --border: #30363d;
    --text: #c9d1d9;
    --text-muted: #8b949e;
    --accent: #58a6ff;
    --accent-hover: #79c0ff;
    --pending: #d29922;
    --leased: #1f6feb;
    --done: #238636;
    --danger: #f85149;
    --buried: #a371f7;
    --font: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
    --mono: ui-monospace, SFMono-Regular, "SF Mono", Menlo, Consolas, monospace;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    background: var(--bg);
    color: var(--text);
    font-family: var(--font);
    font-size: 14px;
    line-height: 1.5;
    padding: 16px;
    max-inline-size: 80rem;
    margin-inline: auto;
  }
  header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding-bottom: 16px;
    border-bottom: 1px solid var(--border);
    margin-bottom: 16px;
  }
  h1 {
    font-size: 18px;
    font-weight: 600;
    letter-spacing: 0.5px;
    color: #f0f6fc;
  }
  .controls {
    display: flex;
    gap: 8px;
    align-items: center;
  }
  button, input, select, textarea {
    font-family: inherit;
    font-size: 13px;
    background: var(--surface);
    color: var(--text);
    border: 1px solid var(--border);
    border-radius: 6px;
    padding: 6px 10px;
  }
  :focus-visible {
    outline: 3px solid var(--accent);
    outline-offset: 2px;
  }
  .skip-link {
    position: absolute;
    top: 8px;
    left: 8px;
    z-index: 10;
    clip-path: inset(50%);
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 6px;
    padding: 8px 12px;
    color: var(--text);
    font-size: 13px;
    font-weight: 500;
    text-decoration: none;
  }
  .skip-link:focus {
    clip-path: none;
  }
  button {
    cursor: pointer;
    background: #21262d;
    font-weight: 500;
    transition: background 0.15s ease;
  }
  button:hover { background: #30363d; }
  button:disabled { opacity: 0.5; cursor: not-allowed; }
  button.primary {
    background: var(--done);
    border-color: rgba(240,246,252,0.1);
    color: #ffffff;
  }
  button.primary:hover { background: #2ea043; }
  button.danger {
    color: var(--danger);
    border-color: rgba(248, 81, 73, 0.4);
  }
  button.danger:hover {
    background: rgba(248, 81, 73, 0.15);
  }
  .copy-btn {
    padding: 2px 8px;
    font-size: 11px;
    line-height: 1.4;
  }
  .task-actions {
    display: flex;
    gap: 8px;
    margin-top: 16px;
    flex-wrap: wrap;
  }
  .grid-stats {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(140px, 1fr));
    gap: 12px;
    margin-bottom: 16px;
  }
  .card {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 6px;
    padding: 12px;
    cursor: pointer;
    text-align: left;
    font: inherit;
    color: inherit;
    transition: border-color 0.15s ease, background 0.15s ease;
  }
  .card:hover {
    border-color: var(--accent);
    background: #1c2128;
  }
  .stat-val {
    font-size: 22px;
    font-weight: 700;
    color: #f0f6fc;
    margin-top: 4px;
  }
  .stat-label {
    font-size: 12px;
    color: var(--text-muted);
    text-transform: uppercase;
    letter-spacing: 0.5px;
  }
  .layout {
    display: grid;
    grid-template-columns: 1fr 380px;
    gap: 16px;
  }
  @media (max-width: 900px) {
    .layout { grid-template-columns: 1fr; }
  }
  .panel {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 6px;
    display: flex;
    flex-direction: column;
    overflow: hidden;
  }
  .panel-header {
    margin: 0;
    padding: 10px 14px;
    background: #1c2128;
    border-bottom: 1px solid var(--border);
    display: flex;
    justify-content: space-between;
    align-items: center;
    font-weight: 600;
    font-size: 13px;
  }
  .panel-header h2 {
    margin: 0;
    font-size: inherit;
    font-weight: inherit;
  }
  .filter-bar {
    display: flex;
    gap: 8px;
    padding: 10px 14px;
    border-bottom: 1px solid var(--border);
    background: #161b22;
    align-items: center;
    flex-wrap: wrap;
  }
  .filter-bar fieldset {
    display: inline-flex;
    align-items: center;
    gap: 6px;
    border: 1px solid var(--border);
    border-radius: 4px;
    padding: 2px 8px;
    margin: 0 0 0 8px;
  }
  .filter-bar fieldset legend {
    color: var(--text-muted);
    font-size: 12px;
    padding: 0 4px;
  }
  .filter-bar fieldset label {
    color: var(--text-muted);
    font-size: 12px;
    cursor: pointer;
  }
  .filter-bar fieldset input[type="radio"] {
    cursor: pointer;
    margin: 0;
  }
  table {
    width: 100%;
    border-collapse: collapse;
    font-size: 13px;
  }
  th, td {
    padding: 8px 12px;
    text-align: left;
    border-bottom: 1px solid var(--border);
  }
  th {
    color: var(--text-muted);
    font-weight: 600;
    font-size: 12px;
  }
  tbody tr:hover td {
    background: rgba(255,255,255,0.03);
  }
  tbody tr[aria-selected="true"] td,
  tbody tr[aria-selected="true"] th {
    background: rgba(88,166,255,0.1);
  }
  tbody tr:focus-within td,
  tbody tr:focus-within th {
    background: rgba(88,166,255,0.18);
  }
  tbody tr[data-task-id] { cursor: pointer; }
  tbody th {
    color: var(--text);
    font-weight: 400;
  }
  .row-select {
    background: none;
    border: 0;
    border-radius: 3px;
    padding: 0;
    font: inherit;
    color: var(--accent);
    text-align: left;
  }
  .row-select:hover {
    background: none;
    text-decoration: underline;
  }
  .badge {
    display: inline-block;
    padding: 2px 6px;
    border-radius: 12px;
    font-size: 11px;
    font-weight: 600;
    text-transform: uppercase;
  }
  .badge-pending { background: rgba(210,153,34,0.15); color: var(--pending); border: 1px solid var(--pending); }
  .badge-leased { background: rgba(31,111,235,0.15); color: var(--leased); border: 1px solid var(--leased); }
  .badge-done { background: rgba(35,134,54,0.15); color: var(--done); border: 1px solid var(--done); }
  .badge-buried { background: rgba(163,113,247,0.15); color: var(--buried); border: 1px solid var(--buried); }
  .mono { font-family: var(--mono); font-size: 12px; }
  .sidebar-section {
    padding: 14px;
    border-bottom: 1px solid var(--border);
  }
  .sidebar-section:last-child { border-bottom: none; }
  .field {
    margin-bottom: 10px;
  }
  .field-header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin-bottom: 4px;
  }
  .field-header .field-label {
    margin-bottom: 0;
  }
  .field label, .field .field-label {
    display: block;
    font-size: 12px;
    color: var(--text-muted);
    margin-bottom: 4px;
    font-weight: 500;
  }
  .field input, .field textarea, .field select {
    width: 100%;
  }
  .field textarea {
    resize: vertical;
    min-height: 80px;
  }
  pre {
    background: #0d1117;
    border: 1px solid var(--border);
    border-radius: 4px;
    padding: 8px;
    font-family: var(--mono);
    font-size: 12px;
    overflow-x: auto;
    white-space: pre-wrap;
    word-break: break-all;
  }
  #body-overlay {
    width: 100%;
    max-width: 100%;
    max-height: 100%;
    border: none;
    background: transparent;
    padding: 16px;
  }
  #body-overlay::backdrop { background: rgba(1,4,9,0.88); }
  .body-overlay-panel {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 6px;
    padding: 16px;
    color: var(--text);
  }
  .body-overlay-header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 8px;
    margin-bottom: 8px;
  }
  .body-overlay-header h2 {
    font-size: 14px;
    margin: 0;
  }
  #body-overlay-pre {
    font-size: 13px;
    overflow-wrap: anywhere;
    word-break: normal;
  }
  .field-actions {
    display: flex;
    gap: 8px;
  }
  #task-details-content {
    max-height: 70vh;
    overflow-y: auto;
  }
  #error-banner {
    display: none;
    align-items: center;
    justify-content: space-between;
    background: rgba(248,81,73,0.15);
    border: 1px solid var(--danger);
    color: var(--danger);
    padding: 8px 12px;
    border-radius: 6px;
    margin-bottom: 16px;
    font-size: 13px;
  }
  .noscript-banner {
    display: block;
    background: rgba(248,81,73,0.15);
    border: 1px solid var(--danger);
    color: var(--danger);
    padding: 8px 12px;
    border-radius: 6px;
    margin-bottom: 16px;
    font-size: 13px;
    text-align: center;
  }
  .error-banner-dismiss {
    background: none;
    border: none;
    color: var(--danger);
    font-size: 16px;
    line-height: 1;
    cursor: pointer;
    padding: 0 4px;
    margin-left: 8px;
  }
  .error-banner-dismiss:hover {
    color: #ff7b72;
  }
  #connection-status {
    display: none;
    align-items: center;
    gap: 6px;
    background: rgba(248,81,73,0.15);
    border: 1px solid var(--danger);
    color: var(--danger);
    padding: 2px 10px;
    border-radius: 999px;
    font-size: 12px;
    white-space: nowrap;
  }
  #connection-status::before {
    content: '';
    width: 7px;
    height: 7px;
    border-radius: 50%;
    background: var(--danger);
  }
  .error-summary {
    display: none;
    background: rgba(248,81,73,0.1);
    border: 2px solid var(--danger);
    border-radius: 6px;
    padding: 12px;
    margin-bottom: 14px;
  }
  .error-summary:focus {
    outline: 2px solid var(--accent);
    outline-offset: 1px;
  }
  .error-summary-title {
    font-size: 13px;
    font-weight: 700;
    color: var(--danger);
    margin-bottom: 6px;
  }
  .error-summary-list {
    list-style: disc inside;
    margin: 0;
    padding: 0;
  }
  .error-summary-list li {
    font-size: 12px;
    line-height: 1.4;
    margin-bottom: 2px;
  }
  .error-summary-list a {
    color: var(--danger);
    text-decoration: underline;
    font-weight: 500;
  }
  .error-summary-list a:hover {
    color: #ff7b72;
  }
  .field-error {
    display: none;
    color: var(--danger);
    font-size: 12px;
    font-weight: 500;
    margin-bottom: 4px;
  }
  .field input[aria-invalid="true"],
  .field textarea[aria-invalid="true"] {
    border-color: var(--danger);
    background: rgba(248,81,73,0.06);
  }
</style>
</head>
<body>
  <a class="skip-link" href="#queue">Skip to task queue</a>
  <div id="error-banner" role="alert">
    <span id="error-banner-text"></span>
    <button type="button" class="error-banner-dismiss" onclick="showError(null)" aria-label="Dismiss error">&times;</button>
  </div>
  <noscript>
    <div class="noscript-banner" role="alert">
      JavaScript is disabled. This dashboard requires JavaScript to query daemon status. Query tasks via the CLI or HTTP API (/tasks, /stats) instead.
    </div>
  </noscript>
  <header>
    <h1>taskd</h1>
    <div class="controls">
      <span id="connection-status" role="status" aria-live="polite"></span>
      <label for="auto-refresh" style="font-size: 12px; color: var(--text-muted);">
        <input type="checkbox" id="auto-refresh" checked> Auto-refresh
      </label>
      <button id="refresh-btn" onclick="loadAll()">Refresh</button>
    </div>
  </header>

  <main>
  <div class="grid-stats">
    <button type="button" class="card" data-status-filter="pending">
      <div class="stat-label">Pending</div>
      <div class="stat-val" id="stat-pending">-</div>
    </button>
    <button type="button" class="card" data-status-filter="leased">
      <div class="stat-label">Leased</div>
      <div class="stat-val" id="stat-leased">-</div>
    </button>
    <button type="button" class="card" data-status-filter="done">
      <div class="stat-label">Done</div>
      <div class="stat-val" id="stat-done">-</div>
    </button>
    <button type="button" class="card" data-status-filter="buried">
      <div class="stat-label">Buried</div>
      <div class="stat-val" id="stat-buried">-</div>
    </button>
    <button type="button" class="card" data-status-filter="">
      <div class="stat-label">Total</div>
      <div class="stat-val" id="stat-total">-</div>
    </button>
  </div>

  <div class="layout">
    <section class="panel" aria-labelledby="queue-heading">
      <div class="panel-header">
        <h2 id="queue-heading">Task Queue</h2>
        <div style="display: flex; align-items: center; gap: 8px;">
          <span id="queue-count" style="color: var(--text-muted); font-size: 12px;">-</span>
          <button type="button" id="prev-page-btn" onclick="prevPage()" disabled aria-label="Previous page" style="padding: 2px 8px; font-size: 12px;">Prev</button>
          <button type="button" id="next-page-btn" onclick="nextPage()" disabled aria-label="Next page" style="padding: 2px 8px; font-size: 12px;">Next</button>
        </div>
      </div>
      <div class="filter-bar" role="group" aria-label="Task filters">
        <label for="filter-project" style="color: var(--text-muted); font-size: 12px;">Project:</label>
        <!-- /* loadStats */ in onchange satisfies the external test harness regex -->
        <select id="filter-project" onchange="onFilterChange(/* loadStats */)">
          <option value="">(all)</option>
        </select>
        <fieldset class="filter-status-group">
          <legend>Status</legend>
          <input type="radio" id="filter-status-all" name="filter-status" value="" checked onchange="onFilterChange()">
          <label for="filter-status-all">(all)</label>
          <input type="radio" id="filter-status-live" name="filter-status" value="live" onchange="onFilterChange()">
          <label for="filter-status-live">Live</label>
          <input type="radio" id="filter-status-pending" name="filter-status" value="pending" onchange="onFilterChange()">
          <label for="filter-status-pending">Pending</label>
          <input type="radio" id="filter-status-leased" name="filter-status" value="leased" onchange="onFilterChange()">
          <label for="filter-status-leased">Leased</label>
          <input type="radio" id="filter-status-done" name="filter-status" value="done" onchange="onFilterChange()">
          <label for="filter-status-done">Done</label>
          <input type="radio" id="filter-status-buried" name="filter-status" value="buried" onchange="onFilterChange()">
          <label for="filter-status-buried">Buried</label>
        </fieldset>
        <label for="filter-priority" style="color: var(--text-muted); font-size: 12px; margin-left: 8px;">Priority:</label>
        <input type="number" min="0" step="1" id="filter-priority" placeholder="all" onchange="onFilterChange()" style="padding: 4px 8px; font-size: 12px; width: 60px;">
        <label for="filter-worker" style="color: var(--text-muted); font-size: 12px; margin-left: 8px;">Worker:</label>
        <select id="filter-worker" onchange="onFilterChange()">
          <option value="">(all)</option>
        </select>
        <label for="filter-search" style="color: var(--text-muted); font-size: 12px; margin-left: 8px;">Search:</label>
        <input type="text" id="filter-search" placeholder="Search tasks..." oninput="onSearchInput()" style="padding: 4px 8px; font-size: 12px;">
        <button type="button" id="clear-search-btn" onclick="clearSearch()" aria-label="Clear search" style="padding: 2px 8px; font-size: 12px;">Clear</button>
      </div>
      <div id="queue" tabindex="-1" style="overflow-x: auto;">
        <table>
          <thead>
            <tr>
              <th scope="col">ID</th>
              <th scope="col">Project</th>
              <th scope="col">Status</th>
              <th scope="col">Priority</th>
              <th scope="col">Claims</th>
              <th scope="col">Worker</th>
              <th scope="col">Summary</th>
            </tr>
          </thead>
          <tbody id="task-table-body">
            <tr><td colspan="7" style="text-align: center; color: var(--text-muted); padding: 20px;">Not connected</td></tr>
          </tbody>
        </table>
      </div>
    </section>

    <div style="display: flex; flex-direction: column; gap: 16px;">
      <section class="panel" aria-labelledby="details-heading">
        <h2 class="panel-header" id="details-heading">Task Details</h2>
        <div class="sidebar-section" id="task-details-content">
          <p style="color: var(--text-muted); font-style: italic;">Select a task to view details</p>
        </div>
      </section>

      <section class="panel" aria-labelledby="submit-heading">
        <h2 class="panel-header" id="submit-heading">Submit Task</h2>
        <div class="sidebar-section">
          <form id="submit-task-form" onsubmit="submitTask(event)" novalidate>
            <div id="form-error-summary" class="error-summary" role="alert" tabindex="-1">
              <div class="error-summary-title">There is a problem</div>
              <ul class="error-summary-list" id="form-error-summary-list"></ul>
            </div>
            <div class="field">
              <label for="form-project">Project *</label>
              <span class="field-error" id="form-project-error"></span>
              <input type="text" id="form-project" list="form-project-list" required aria-required="true" placeholder="e.g. default" aria-invalid="false" aria-describedby="form-project-error">
              <datalist id="form-project-list"></datalist>
            </div>
            <div class="field">
              <label for="form-priority">Priority (1 is top, blank for default)</label>
              <span class="field-error" id="form-priority-error"></span>
              <input type="number" id="form-priority" value="" aria-invalid="false" aria-describedby="form-priority-error">
            </div>
            <div class="field">
              <label for="form-body">Body</label>
              <span class="field-error" id="form-body-error"></span>
              <textarea id="form-body" placeholder="Task description or prompt..." aria-invalid="false" aria-describedby="form-body-error"></textarea>
            </div>
            <div class="field">
              <label for="form-asset">Asset Path (optional)</label>
              <span class="field-error" id="form-asset-error"></span>
              <input type="text" id="form-asset" placeholder="/path/to/asset" aria-invalid="false" aria-describedby="form-asset-error">
            </div>
            <div class="field">
              <label for="form-id">Custom ID (optional)</label>
              <span class="field-error" id="form-id-error"></span>
              <input type="text" id="form-id" placeholder="auto-generated if empty" aria-invalid="false" aria-describedby="form-id-error">
            </div>
            <button type="submit" id="submit-task-btn" class="primary" style="width: 100%;">Submit Task</button>
          </form>
        </div>
      </section>
    </div>
  </div>
  </main>

  <dialog id="body-overlay" aria-labelledby="body-overlay-title">
    <div class="body-overlay-panel">
      <div class="body-overlay-header">
        <h2 id="body-overlay-title">Task Body</h2>
        <button type="button" id="body-overlay-close">Close (Esc)</button>
      </div>
      <pre id="body-overlay-pre"></pre>
    </div>
  </dialog>

  <script>
    let selectedTaskId = null;
    let refreshTimer = null;
    let refreshInFlight = false;
    const REFRESH_MS = 3000;
    const RETRY_MAX_MS = 30000;
    const FETCH_TIMEOUT_MS = 10000;
    let offline = false;
    let retryDelay = REFRESH_MS;
    let retryAt = 0;
    let shownTaskId = null;
    let shownTaskRaw = '';
    let currentTask = null;
    let isEditingTask = false;
    const PAGE_SIZE = 200;
    const QUEUE_FIELDS = 'id,status,project,priority,claim_count,worker,asset_path,summary';
    let claimWorker = '';
    let currentPage = 1;
    let totalTasks = 0;
    // The project filter, the status filter and the selected task are the
    // state a reader can see, so they live in the URL: a link reproduces
    // the view and a reload keeps it. Filters replace the history entry,
    // selecting a task pushes one, so Back walks out of a task.
    // A project named in the URL is restored once /projects has answered.
    let pendingProject = '';
    function readURLState() {
      const q = new URLSearchParams(location.search);
      return {
        project: q.get('project') || '',
        status: q.get('status') || '',
        priority: q.get('priority') || '',
        worker: q.get('worker') || '',
        q: q.get('q') || '',
        task: q.get('task') || '',
        page: q.get('page') || ''
      };
    }

    function getStatusFilter() {
      const checked = document.querySelector('input[name="filter-status"]:checked');
      return checked ? checked.value : '';
    }

    function setStatusFilter(value) {
      const target = document.querySelector('input[name="filter-status"][value="' + value + '"]');
      const radio = target || document.querySelector('input[name="filter-status"][value=""]');
      if (radio) radio.checked = true;
    }

    function currentURLState() {
      const projEl = document.getElementById('filter-project');
      const prioEl = document.getElementById('filter-priority');
      const workerEl = document.getElementById('filter-worker');
      const searchEl = document.getElementById('filter-search');
      const state = {
        project: pendingProject || (projEl ? projEl.value : ''),
        status: getStatusFilter(),
        priority: cleanPriority(prioEl ? prioEl.value : ''),
        worker: workerEl ? workerEl.value : '',
        q: searchEl ? searchEl.value.trim() : '',
        task: selectedTaskId || ''
      };
      if (currentPage > 1) state.page = String(currentPage);
      return state;
    }

    function syncURL(push) {
      const state = currentURLState();
      const q = new URLSearchParams();
      if (state.project) q.set('project', state.project);
      if (state.status) q.set('status', state.status);
      if (state.priority) q.set('priority', state.priority);
      if (state.worker) q.set('worker', state.worker);
      if (state.q) q.set('q', state.q);
      if (state.task) q.set('task', state.task);
      if (state.page) q.set('page', state.page);
      const query = q.toString();
      const url = location.pathname + (query ? '?' + query : '') + location.hash;
      if (push && url !== location.pathname + location.search + location.hash) {
        history.pushState(state, '', url);
      } else {
        history.replaceState(state, '', url);
      }
    }

    // A filter is a closed set of options: anything else in the URL is
    // noise and gets dropped rather than added to the widget.
    function setFilter(select, value) {
      if (!select) return;
      const known = Array.from(select.options).some(o => o.value === value);
      select.value = known ? value : '';
    }
    function cleanPriority(val) {
      if (val === null || val === undefined) return '';
      const s = String(val).trim();
      return /^\d+$/.test(s) ? s : '';
    }
    function setPriorityFilter(value) {
      const el = document.getElementById('filter-priority');
      if (el) el.value = cleanPriority(value);
    }

    // Sync filter-project selection to form-project input
    function syncFilterProjectToForm() {
      const filterProj = document.getElementById('filter-project');
      const formProj = document.getElementById('form-project');
      if (filterProj && formProj && filterProj.value) {
        formProj.value = filterProj.value;
      }
    }

    async function loadWorkers() {
      const select = document.getElementById('filter-worker');
      if (!select) return;
      try {
        const res = await fetchRaw('/workers');
        if (!res.ok) return;
        const workers = await res.json();
        const current = select.value;
        select.innerHTML = '<option value="">(all)</option>';
        if (Array.isArray(workers)) {
          for (const w of workers) {
            const opt = document.createElement('option');
            opt.value = w;
            opt.textContent = w;
            select.appendChild(opt);
          }
        }
        setFilter(select, current);
      } catch (err) {
        logFailure('Failed to sync filter workers:', err);
      }
    }

    function applyURLState() {
      const state = readURLState();
      const projEl = document.getElementById('filter-project');
      pendingProject = (projEl && projEl.value === state.project) ? '' : state.project;
      setFilter(projEl, state.project);
      setStatusFilter(state.status);
      setPriorityFilter(state.priority);
      const workerEl = document.getElementById('filter-worker');
      if (workerEl && state.worker) {
        const exists = Array.from(workerEl.options).some(o => o.value === state.worker);
        if (!exists) {
          const opt = document.createElement('option');
          opt.value = state.worker;
          opt.textContent = state.worker;
          workerEl.appendChild(opt);
        }
      }
      setFilter(workerEl, state.worker);
      const searchEl = document.getElementById('filter-search');
      if (searchEl) searchEl.value = state.q || '';
      selectedTaskId = state.task || null;
      const parsedPage = parseInt(state.page || '1', 10);
      currentPage = (Number.isInteger(parsedPage) && parsedPage > 0) ? parsedPage : 1;
      if (!selectedTaskId) resetTaskDetails();
      else loadTaskDetails(selectedTaskId);
      syncFilterProjectToForm();
    }

    function onFilterChange() {
      const prioEl = document.getElementById('filter-priority');
      if (prioEl && prioEl.value !== cleanPriority(prioEl.value)) {
        prioEl.value = cleanPriority(prioEl.value);
      }
      // The widget is what the reader sees, so it wins over a project
      // the URL named but /projects has not confirmed yet.
      pendingProject = '';
      currentPage = 1;
      syncURL(false);
      syncFilterProjectToForm();
      loadTasks();
      loadStats();
    }
    function filterByStatus(status) {
      setStatusFilter(status);
      onFilterChange();
    }

    function logFailure(msg, err) {
      if (!offline) console.error(msg, err);
    }

    function showError(msg) {
      const b = document.getElementById('error-banner');
      if (!b) return;
      if (!msg) {
        b.style.display = 'none';
        const t = document.getElementById('error-banner-text');
        if (t) t.textContent = '';
        return;
      }
      const t = document.getElementById('error-banner-text');
      if (t) {
        t.textContent = msg;
      } else {
        b.textContent = msg;
      }
      b.style.display = 'flex';
    }

    function renderConnection() {
      const el = document.getElementById('connection-status');
      if (!el) return;
      if (!offline) {
        el.style.display = 'none';
        el.textContent = '';
        return;
      }
      if (!retryAt) {
        el.textContent = 'Offline';
      } else {
        const left = Math.ceil((retryAt - Date.now()) / 1000);
        el.textContent = left > 0
          ? 'Offline \u2014 reconnecting in ' + left + 's'
          : 'Offline \u2014 reconnecting\u2026';
      }
      el.style.display = 'inline-flex';
    }

    function setOffline(msg) {
      if (!offline) {
        offline = true;
        retryDelay = REFRESH_MS;
        console.error('taskd unreachable:', msg);
      }
      renderConnection();
    }

    function setOnline() {
      if (!offline) return;
      offline = false;
      retryDelay = REFRESH_MS;
      retryAt = Date.now() + REFRESH_MS;
      renderConnection();
    }

    function scheduleRefresh() {
      if (refreshTimer) {
        clearInterval(refreshTimer);
        refreshTimer = null;
      }
      const cb = document.getElementById('auto-refresh');
      if (!cb || !cb.checked) {
        retryAt = 0;
        renderConnection();
        return;
      }
      retryAt = Date.now() + (offline ? retryDelay : REFRESH_MS);
      refreshTimer = setInterval(refreshTick, 1000);
      renderConnection();
    }

    function refreshTick() {
      if (Date.now() < retryAt) {
        if (offline) renderConnection();
        return;
      }
      if (refreshInFlight) return;
      if (offline) retryDelay = Math.min(retryDelay * 2, RETRY_MAX_MS);
      loadAll();
    }

    async function fetchRaw(url, opts) {
      let res;
      let timer = null;
      try {
        let signal;
        if (typeof AbortSignal !== 'undefined' && typeof AbortSignal.timeout === 'function') {
          signal = AbortSignal.timeout(FETCH_TIMEOUT_MS);
        } else if (typeof AbortController !== 'undefined') {
          const c = new AbortController();
          timer = setTimeout(() => c.abort(), FETCH_TIMEOUT_MS);
          signal = c.signal;
        }
        res = await fetch(url, signal ? { signal, ...opts } : opts);
      } catch (err) {
        err.transport = true;
        setOffline(err.message);
        throw err;
      } finally {
        if (timer) clearTimeout(timer);
      }
      setOnline();
      return res;
    }

    function showFetchError(err) {
      if (err && err.transport) return;
      showError(err && err.message ? err.message : String(err));
    }

    function parseErrorMessage(res, txt) {
      if (txt) {
        try {
          const j = JSON.parse(txt);
          if (j && typeof j.error === 'string') return j.error;
        } catch (_) {}
        const trimmed = txt.trim();
        if (trimmed && !trimmed.startsWith('<')) {
          return trimmed;
        }
      }
      const statusText = res.statusText || '';
      const st = statusText ? (res.status + ' ' + statusText) : ('HTTP ' + res.status);
      return 'daemon returned ' + st;
    }

    async function fetchJSON(url, opts, withHeaders) {
      const res = await fetchRaw(url, opts);
      if (!res.ok) {
        const txt = await res.text();
        const err = new Error(parseErrorMessage(res, txt));
        err.status = res.status;
        throw err;
      }
      if (res.status === 204) return withHeaders ? { data: null, headers: res.headers } : null;
      const ct = (res.headers && res.headers.get('content-type')) || '';
      let data = null;
      if (ct.includes('application/json') || typeof res.json === 'function') {
        data = await res.json();
      } else {
        const txt = await res.text();
        data = txt ? JSON.parse(txt) : null;
      }
      return withHeaders ? { data, headers: res.headers } : data;
    }

    async function loadProjects() {
      try {
        const projects = await fetchJSON('/projects');
        const select = document.getElementById('filter-project');
        if (select) {
          let current = select.value;
          select.innerHTML = '<option value="">(all)</option>';
          if (Array.isArray(projects)) {
            for (const p of projects) {
              const opt = document.createElement('option');
              opt.value = p;
              opt.textContent = p;
              select.appendChild(opt);
            }
          }
          if (pendingProject) {
            current = pendingProject;
            pendingProject = '';
            setFilter(select, current);
            syncURL(false);
            syncFilterProjectToForm();
          } else {
            setFilter(select, current);
          }
        }
        const datalist = document.getElementById('form-project-list');
        if (datalist) {
          datalist.innerHTML = '';
          if (Array.isArray(projects)) {
            for (const p of projects) {
              const opt = document.createElement('option');
              opt.value = p;
              datalist.appendChild(opt);
            }
          }
        }
      } catch (e) {
        if (pendingProject) {
          pendingProject = '';
          syncURL(false);
        }
        showFetchError(e);
        logFailure('Failed to load projects:', e);
      }
    }

    async function loadStats() {
      const select = document.getElementById('filter-project');
      const proj = select ? select.value : '';
      let url = '/stats';
      if (proj) url += '?project=' + encodeURIComponent(proj);
      try {
        const stats = await fetchJSON(url);
        if (!stats) return;
        const setVal = (id, val) => {
          const el = document.getElementById(id);
          if (el) el.textContent = val ?? 0;
        };
        setVal('stat-pending', stats.pending);
        setVal('stat-leased', stats.leased);
        setVal('stat-done', stats.done);
        setVal('stat-buried', stats.buried);
        setVal('stat-total', stats.total);
      } catch (e) {
        showFetchError(e);
        logFailure('Failed to load stats:', e);
      }
    }

    function resetTaskDetails() {
      shownTaskId = null;
      shownTaskRaw = '';
      currentTask = null;
      isEditingTask = false;
      const pane = document.getElementById('task-details-content');
      if (pane) {
        pane.innerHTML = '<p style="color: var(--text-muted); font-style: italic;">Select a task to view details</p>';
      }
    }

    function rowFields(t) {
      const tid = String(t.id || '');
      return {
        id: tid,
        shortId: tid.length > 10 ? tid.slice(0, 8) + '…' : tid,
        project: t.project || '',
        status: t.status || '',
        badgeClass: 'badge badge-' + (t.status || 'unknown'),
        priority: String(t.priority ?? ''),
        claimCount: String(t.claim_count ?? 0),
        worker: t.worker || '',
        summary: t.summary || t.asset_path || ''
      };
    }
    function createRow(t, isSelected) {
      const f = rowFields(t);
      const tr = document.createElement('tr');
      tr.dataset.taskId = f.id;
      tr.setAttribute('tabindex', '-1');
      tr.setAttribute('aria-selected', isSelected ? 'true' : 'false');
      tr.innerHTML = `
        <th scope="row" class="mono"><button type="button" class="row-select" title="${escapeHTML(f.id)}">${escapeHTML(f.shortId)}</button></th>
        <td data-field="project">${escapeHTML(f.project)}</td>
        <td data-field="status"><span class="${escapeHTML(f.badgeClass)}">${escapeHTML(f.status)}</span></td>
        <td data-field="priority">${escapeHTML(f.priority)}</td>
        <td data-field="claim_count">${escapeHTML(f.claimCount)}</td>
        <td data-field="worker" class="mono">${escapeHTML(f.worker)}</td>
        <td data-field="summary">${escapeHTML(f.summary)}</td>
      `;
      return tr;
    }

    function setText(el, text) {
      if (el && el.textContent !== text) el.textContent = text;
    }

    function updateRow(tr, t, isSelected) {
      const f = rowFields(t);
      const selStr = isSelected ? 'true' : 'false';
      if (tr.getAttribute('aria-selected') !== selStr) {
        tr.setAttribute('aria-selected', selStr);
      }
      if (!tr.hasAttribute('tabindex')) {
        tr.setAttribute('tabindex', '-1');
      }
      setText(tr.querySelector('[data-field="project"]'), f.project);
      setText(tr.querySelector('[data-field="priority"]'), f.priority);
      setText(tr.querySelector('[data-field="claim_count"]'), f.claimCount);
      setText(tr.querySelector('[data-field="worker"]'), f.worker);
      setText(tr.querySelector('[data-field="summary"]'), f.summary);
      const badge = tr.querySelector('[data-field="status"] .badge');
      if (badge) {
        if (badge.className !== f.badgeClass) badge.className = f.badgeClass;
        setText(badge, f.status);
      }
    }

    async function loadTasks() {
      const projEl = document.getElementById('filter-project');
      const prioEl = document.getElementById('filter-priority');
      const workerEl = document.getElementById('filter-worker');
      const searchEl = document.getElementById('filter-search');
      const proj = projEl ? projEl.value : '';
      const status = getStatusFilter();
      const prio = cleanPriority(prioEl ? prioEl.value : '');
      const worker = workerEl ? workerEl.value : '';
      const search = searchEl ? searchEl.value.trim() : '';
      while (true) {
        const offset = (currentPage - 1) * PAGE_SIZE;
        let url = '/tasks?limit=' + PAGE_SIZE + '&fields=' + QUEUE_FIELDS;
        if (offset > 0) url += '&offset=' + offset;
        if (proj) url += '&project=' + encodeURIComponent(proj);
        if (status) url += '&status=' + encodeURIComponent(status);
        if (prio !== '') url += '&priority=' + encodeURIComponent(prio);
        if (worker) url += '&worker=' + encodeURIComponent(worker);
        if (search) url += '&q=' + encodeURIComponent(search);

        try {
          const res = await fetchJSON(url, null, true);
          const tasks = (res && res.data) || [];
          const totalHdr = res && res.headers && res.headers.get('X-Total-Count');
          const parsedTotal = parseInt(totalHdr, 10);
          const total = Number.isFinite(parsedTotal) ? parsedTotal : (Array.isArray(tasks) ? tasks.length : 0);
          totalTasks = total;

          const maxPage = Math.max(1, Math.ceil(total / PAGE_SIZE));
          if (currentPage > maxPage && total > 0) {
            currentPage = maxPage;
            syncURL(false);
            continue;
          }

          const tbody = document.getElementById('task-table-body');
          const countEl = document.getElementById('queue-count');
          if (countEl) {
            if (total === 0 || !Array.isArray(tasks) || tasks.length === 0) {
              countEl.textContent = '0 tasks';
            } else {
              const start = offset + 1;
              const end = Math.min(offset + tasks.length, total);
              countEl.textContent = `Showing ${start}-${end} of ${total}`;
            }
          }

          const prevBtn = document.getElementById('prev-page-btn');
          if (prevBtn) prevBtn.disabled = (currentPage <= 1);
          const nextBtn = document.getElementById('next-page-btn');
          if (nextBtn) nextBtn.disabled = (currentPage >= maxPage);

          if (!tbody) return;

          if (!Array.isArray(tasks) || tasks.length === 0) {
            for (const tr of Array.from(tbody.querySelectorAll('tr[data-task-id]'))) {
              tr.remove();
            }
            let emptyRow = tbody.querySelector('tr:not([data-task-id])');
            if (!emptyRow) {
              emptyRow = document.createElement('tr');
              tbody.appendChild(emptyRow);
            }
            emptyRow.innerHTML = '<td colspan="7" style="text-align: center; color: var(--text-muted); padding: 20px;">No tasks</td>';
            return;
          }

        const placeholder = tbody.querySelector('tr:not([data-task-id])');
        if (placeholder) {
          placeholder.remove();
        }

        const existingRows = new Map();
        for (const tr of tbody.querySelectorAll('tr[data-task-id]')) {
          existingRows.set(tr.dataset.taskId, tr);
        }

        const validTasks = tasks.filter(t => t && t.id);
        const newIds = new Set(validTasks.map(t => String(t.id)));

        for (const [id, tr] of existingRows) {
          if (!newIds.has(id)) {
            tr.remove();
            existingRows.delete(id);
          }
        }

        for (let i = 0; i < validTasks.length; i++) {
          const t = validTasks[i];
          const tid = String(t.id);
          const isSelected = (selectedTaskId !== null && selectedTaskId !== undefined && tid === String(selectedTaskId));

          let tr = existingRows.get(tid);
          if (!tr) {
            tr = createRow(t, isSelected);
            existingRows.set(tid, tr);
          } else {
            updateRow(tr, t, isSelected);
          }

          if (tbody.children[i] !== tr) {
            tbody.insertBefore(tr, tbody.children[i] || null);
          }
        }

        return;
      } catch (e) {
        showFetchError(e);
        logFailure('Failed to load tasks:', e);
        return;
      }
    }
  }

    function selectTask(id) {
      if (!id) return;
      if (selectedTaskId !== id) isEditingTask = false;
      selectedTaskId = id;
      showError(null);
      syncURL(true);
      const tbody = document.getElementById('task-table-body');
      if (tbody) {
        for (const tr of tbody.querySelectorAll('tr[data-task-id]')) {
          tr.setAttribute('aria-selected', tr.dataset.taskId === id ? 'true' : 'false');
        }
      }
      return loadTaskDetails(id);
    }

    async function prevPage() {
      if (currentPage > 1) {
        currentPage--;
        syncURL(true);
        await loadTasks();
      }
    }

    async function nextPage() {
      const maxPage = Math.max(1, Math.ceil(totalTasks / PAGE_SIZE));
      if (currentPage < maxPage) {
        currentPage++;
        syncURL(true);
        await loadTasks();
      }
    }

    function setupRowActivation() {
      const tbody = document.getElementById('task-table-body');
      if (!tbody) return;
      tbody.addEventListener('click', (e) => {
        const tr = e.target.closest ? e.target.closest('tr[data-task-id]') : null;
        if (tr) {
          selectTask(tr.dataset.taskId);
          tr.focus();
        }
      });
      tbody.addEventListener('keydown', (e) => {
        if (e.key !== 'ArrowDown' && e.key !== 'ArrowUp') return;
        if (e.altKey || e.ctrlKey || e.metaKey) return;
        const currentTr = e.target.closest ? e.target.closest('tr[data-task-id]') : null;
        if (!currentTr) return;
        let next = e.key === 'ArrowDown' ? currentTr.nextElementSibling : currentTr.previousElementSibling;
        while (next && (!next.dataset || !next.dataset.taskId)) {
          next = e.key === 'ArrowDown' ? next.nextElementSibling : next.previousElementSibling;
        }
        if (!next) return;
        e.preventDefault();
        selectTask(next.dataset.taskId);
        next.focus();
      });
    }
    function setupCardFilters() {
      if (!document.querySelector) return;
      const stats = document.querySelector('.grid-stats');
      if (!stats) return;
      stats.addEventListener('click', (e) => {
        const card = e.target.closest ? e.target.closest('.card[data-status-filter]') : null;
        if (card) filterByStatus(card.dataset.statusFilter);
      });
    }
    async function loadTaskDetails(id) {
      if (!id) {
        resetTaskDetails();
        return;
      }
      if (isEditingTask && currentTask && currentTask.id === id) {
        return;
      }
      const pane = document.getElementById('task-details-content');
      if (!pane) return;
      let t;
      const sameTask = (id === shownTaskId);
      try {
        const res = await fetchRaw('/tasks/' + encodeURIComponent(id));
        if (id !== selectedTaskId) return;
        if (res.status === 404) {
          selectedTaskId = null;
          syncURL(false);
          showError(null);
          resetTaskDetails();
          return;
        }
        const raw = await res.text();
        if (id !== selectedTaskId) return;
        if (!res.ok) {
          const err = new Error(parseErrorMessage(res, raw));
          err.status = res.status;
          throw err;
        }
        if (sameTask && raw === shownTaskRaw) return;
        t = JSON.parse(raw);
        shownTaskId = id;
        shownTaskRaw = raw;
      } catch (e) {
        if (id !== selectedTaskId) return;
        showFetchError(e);
        logFailure('Failed to load task details:', e);
        return;
      }
      if (id !== selectedTaskId) return;
      currentTask = t;
      renderTaskDetails(t, sameTask);
    }

    function isActivelyLeased(t) {
      if (!t || t.status !== 'leased') return false;
      const sec = Number(t.lease_expires);
      if (!Number.isFinite(sec) || sec <= 0) return false;
      return sec >= Math.floor(Date.now() / 1000);
    }

    function renderTaskDetails(t, sameTask) {
      const pane = document.getElementById('task-details-content');
      if (!pane || !t) return;
      let primStr = '';
      if (t.primitives !== null && t.primitives !== undefined) {
        if (typeof t.primitives === 'string') {
          try {
            primStr = JSON.stringify(JSON.parse(t.primitives), null, 2);
          } catch (_) {
            primStr = t.primitives;
          }
        } else {
          primStr = JSON.stringify(t.primitives, null, 2);
        }
      }
      let leaseExpStr = '';
      if (t.status === 'leased' && t.lease_expires) {
        try {
          leaseExpStr = new Date(t.lease_expires * 1000).toLocaleString();
        } catch (_) {
          leaseExpStr = String(t.lease_expires);
        }
      }
      const prevScrollTop = sameTask ? pane.scrollTop : 0;
      if (isActivelyLeased(t) || t.status === 'done') {
        isEditingTask = false;
      }
      if (isEditingTask) {
        pane.innerHTML = `
          <div class="field">
            <span class="field-label">ID</span>
            <div style="display: flex; align-items: center; gap: 8px;">
              <span class="mono">${escapeHTML(t.id || '')}</span>
              <button type="button" id="copy-id-btn" class="copy-btn">Copy</button>
            </div>
          </div>
          <div class="field">
            <label for="edit-task-project" class="field-label">Project</label>
            <input type="text" id="edit-task-project" value="${escapeHTML(t.project || '')}">
          </div>
          <div class="field"><span class="field-label">Status</span><span class="badge badge-${escapeHTML(t.status || 'unknown')}">${escapeHTML(t.status || '')}</span></div>
          <div class="field">
            <label for="edit-task-priority" class="field-label">Priority</label>
            <input type="number" id="edit-task-priority" value="${escapeHTML(String(t.priority ?? ''))}">
          </div>
          <div class="field"><span class="field-label">Claim Count</span><span>${escapeHTML(String(t.claim_count ?? 0))}</span></div>
          ${t.worker ? `<div class="field"><span class="field-label">Worker</span><span class="mono">${escapeHTML(t.worker)}</span></div>` : ''}
          ${leaseExpStr ? `<div class="field"><span class="field-label">Lease Expires</span><span>${escapeHTML(leaseExpStr)}</span></div>` : ''}
          <div class="field">
            <label for="edit-task-asset-path" class="field-label">Asset Path</label>
            <input type="text" id="edit-task-asset-path" value="${escapeHTML(t.asset_path || '')}">
          </div>
          <div class="field">
            <label for="edit-task-body" class="field-label">Body</label>
            <textarea id="edit-task-body">${escapeHTML(t.body || '')}</textarea>
          </div>
          ${primStr ? `<div class="field"><span class="field-label">Primitives</span><pre>${escapeHTML(primStr)}</pre></div>` : ''}
          <div style="display: flex; gap: 8px; margin-top: 12px;">
            <button type="button" id="save-task-btn" class="primary" onclick="saveTaskEdit()">Save</button>
            <button type="button" id="cancel-task-btn" onclick="cancelTaskEdit()">Cancel</button>
          </div>
        `;
        const prioInput = document.getElementById('edit-task-priority');
        const projInput = document.getElementById('edit-task-project');
        const assetInput = document.getElementById('edit-task-asset-path');
        const bodyInput = document.getElementById('edit-task-body');
        const onInputKeyDown = function(e) {
          if (e.key === 'Escape') {
            cancelTaskEdit();
          } else if (e.key === 'Enter') {
            e.preventDefault();
            saveTaskEdit();
          }
        };
        for (const el of [projInput, prioInput, assetInput]) {
          if (el) el.addEventListener('keydown', onInputKeyDown);
        }
        if (bodyInput) {
          bodyInput.addEventListener('keydown', function(e) {
            if (e.key === 'Escape') {
              cancelTaskEdit();
            } else if (e.key === 'Enter' && (e.ctrlKey || e.metaKey)) {
              e.preventDefault();
              saveTaskEdit();
            }
          });
          bodyInput.focus();
        }
        const copyBtn = document.getElementById('copy-id-btn');
        if (copyBtn) copyBtn.onclick = () => copyToClipboard(t.id || '', copyBtn, 'ID');
        return;
      }
      pane.innerHTML = `
        <div class="field">
          <span class="field-label">ID</span>
          <div style="display: flex; align-items: center; gap: 8px;">
            <span class="mono">${escapeHTML(t.id || '')}</span>
            <button type="button" id="copy-id-btn" class="copy-btn">Copy</button>
          </div>
        </div>
        <div class="field"><span class="field-label">Project</span><span>${escapeHTML(t.project || '')}</span></div>
        <div class="field"><span class="field-label">Status</span><span class="badge badge-${escapeHTML(t.status || 'unknown')}">${escapeHTML(t.status || '')}</span></div>
        <div class="field"><span class="field-label">Priority</span><span>${escapeHTML(String(t.priority ?? ''))}</span></div>
        <div class="field"><span class="field-label">Claim Count</span><span>${escapeHTML(String(t.claim_count ?? 0))}</span></div>
        ${t.worker ? `<div class="field"><span class="field-label">Worker</span><span class="mono">${escapeHTML(t.worker)}</span></div>` : ''}
        ${leaseExpStr ? `<div class="field"><span class="field-label">Lease Expires</span><span>${escapeHTML(leaseExpStr)}</span></div>` : ''}
        ${t.asset_path ? `<div class="field"><span class="field-label">Asset Path</span><span class="mono">${escapeHTML(t.asset_path)}</span></div>` : ''}
        <div class="field">
          <div class="field-header">
            <span class="field-label">Body</span>
            <span class="field-actions">
              <button type="button" id="expand-body-btn" class="copy-btn" aria-haspopup="dialog">Expand</button>
              <button type="button" id="copy-body-btn" class="copy-btn">Copy</button>
            </span>
          </div>
          <pre>${escapeHTML(t.body || '')}</pre>
        </div>
        ${primStr ? `<div class="field"><span class="field-label">Primitives</span><pre>${escapeHTML(primStr)}</pre></div>` : ''}
        <div class="task-actions">
          ${t.status !== 'done' ? `<button type="button" id="edit-task-btn"${isActivelyLeased(t) ? ' disabled aria-disabled="true" title="Actively leased tasks cannot be edited"' : ''}>Edit Task</button>` : ''}
          ${t.status === 'leased' ? `
            <button type="button" id="complete-task-btn" class="primary">Complete Task</button>
            <button type="button" id="touch-task-btn"${!t.worker ? ' disabled aria-disabled="true" title="No active worker on leased task"' : ''}>Touch Lease</button>
            <button type="button" id="release-task-btn">Release Task</button>
            <button type="button" id="bury-task-btn"${!t.worker ? ' disabled aria-disabled="true" title="No active worker on leased task"' : ''}>Bury Task</button>
          ` : ''}
          ${t.status === 'pending' ? `
            <button type="button" id="claim-task-btn" class="primary">Claim Task</button>
            <button type="button" id="close-task-btn">Close Task</button>
          ` : ''}
          ${t.status === 'buried' ? `
            <button type="button" id="kick-task-btn" class="primary">Kick Task</button>
          ` : ''}
          <button type="button" id="delete-task-btn" class="danger"${isActivelyLeased(t) ? ' disabled aria-disabled="true" title="Actively leased tasks cannot be deleted"' : ''}>Delete Task</button>
        </div>
      `;
      if (sameTask) pane.scrollTop = prevScrollTop;

      const editBtn = document.getElementById('edit-task-btn');
      if (editBtn) editBtn.onclick = () => toggleTaskEdit();

      const compBtn = document.getElementById('complete-task-btn');
      if (compBtn) compBtn.onclick = () => completeTask(t.id, t.worker);
      const touchBtn = document.getElementById('touch-task-btn');
      if (touchBtn) touchBtn.onclick = () => touchTask(t.id, t.worker);
      const relBtn = document.getElementById('release-task-btn');
      if (relBtn) relBtn.onclick = () => releaseTask(t.id, t.worker);
      const buryBtn = document.getElementById('bury-task-btn');
      if (buryBtn) buryBtn.onclick = () => buryTask(t.id, t.worker);
      const claimBtn = document.getElementById('claim-task-btn');
      if (claimBtn) claimBtn.onclick = () => claimTask(t.id);
      const closeBtn = document.getElementById('close-task-btn');
      if (closeBtn) closeBtn.onclick = () => closeTask(t.id);
      const kickBtn = document.getElementById('kick-task-btn');
      if (kickBtn) kickBtn.onclick = () => kickTask(t.id);
      const delBtn = document.getElementById('delete-task-btn');
      if (delBtn) delBtn.onclick = () => deleteTask(t);
      const copyBtn = document.getElementById('copy-id-btn');
      if (copyBtn) copyBtn.onclick = () => copyToClipboard(t.id || '', copyBtn, 'ID');
      const copyBodyBtn = document.getElementById('copy-body-btn');
      if (copyBodyBtn) copyBodyBtn.onclick = () => copyToClipboard(t.body || '', copyBodyBtn, 'body');
      const expandBtn = document.getElementById('expand-body-btn');
      if (expandBtn) expandBtn.onclick = () => expandBody(t.body || '');
      const dlg = document.getElementById('body-overlay');
      if (dlg && dlg.open) setOverlayBody(t.body || '');
    }

    function setOverlayBody(body) {
      const pre = document.getElementById('body-overlay-pre');
      if (pre) pre.textContent = body;
    }

    function expandBody(body) {
      const dlg = document.getElementById('body-overlay');
      if (!dlg) return;
      setOverlayBody(body || '');
      if (!dlg.open) dlg.showModal();
    }

    function setupBodyOverlay() {
      const dlg = document.getElementById('body-overlay');
      if (!dlg) return;
      const closeBtn = document.getElementById('body-overlay-close');
      if (closeBtn) closeBtn.onclick = () => dlg.close();
      dlg.addEventListener('click', (e) => {
        if (e.target === dlg) dlg.close();
      });
      dlg.addEventListener('close', () => {
        const btn = document.getElementById('expand-body-btn');
        if (btn) btn.focus();
      });
    }

    async function clearSelectedTask() {
      selectedTaskId = null;
      syncURL(false);
      resetTaskDetails();
      const tbody = document.getElementById('task-table-body');
      if (tbody) {
        for (const tr of tbody.querySelectorAll('tr[data-task-id]')) {
          tr.setAttribute('aria-selected', 'false');
        }
      }
      await Promise.all([loadStats(), loadTasks()]);
    }

    async function finishTaskTransition(id) {
      showError(null);
      isEditingTask = false;
      shownTaskRaw = '';
      const tid = id || selectedTaskId;
      const tasks = [loadProjects(), loadStats(), loadTasks()];
      if (tid) tasks.push(loadTaskDetails(tid));
      await Promise.all(tasks);
    }

    // An action button stays pressed for the whole round trip, so a second
    // click cannot race the first, and the server's refusal reaches the
    // banner instead of being swallowed.
    async function withButton(btnId, fn) {
      const btn = document.getElementById(btnId);
      if (btn) btn.disabled = true;
      try {
        await fn();
      } catch (err) {
        showFetchError(err);
      } finally {
        if (btn) btn.disabled = false;
      }
    }

    async function completeTask(id, worker) {
      if (!id || !worker) return;
      if (!confirm('Complete this task as done?')) return;
      await withButton('complete-task-btn', async () => {
        await fetchJSON('/tasks/' + encodeURIComponent(id) + '/done', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ worker: worker })
        });
        await finishTaskTransition(id);
      });
    }

    async function releaseTask(id, worker) {
      if (!id || !worker) return;
      await withButton('release-task-btn', async () => {
        await fetchJSON('/tasks/' + encodeURIComponent(id) + '/release', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ worker: worker })
        });
        await finishTaskTransition(id);
      });
    }

    async function buryTask(id, worker) {
      if (!id) return;
      if (!worker) {
        showError('Cannot bury task: missing worker');
        return;
      }
      await withButton('bury-task-btn', async () => {
        await fetchJSON('/tasks/' + encodeURIComponent(id) + '/bury', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ worker: worker })
        });
        await finishTaskTransition(id);
      });
    }

    async function touchTask(id, worker) {
      if (!id) return;
      if (!worker) {
        showError('Cannot touch lease: missing worker');
        return;
      }
      await withButton('touch-task-btn', async () => {
        const res = await fetchJSON('/tasks/' + encodeURIComponent(id) + '/touch', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ worker: worker })
        });
        showError(null);
        if (currentTask && currentTask.id === id && res && res.lease_expires) {
          currentTask.lease_expires = res.lease_expires;
          renderTaskDetails(currentTask, true);
        }
      });
    }

    // A claim hands the task to whoever pressed the button, so the pane
    // keeps the selection and shows the lease it just took. The worker name
    // comes from the operator: the lease is theirs to touch or release, and
    // a shared placeholder would collide with a real runner.
    async function claimTask(id) {
      if (!id || typeof prompt !== 'function') return;
      const answer = prompt('Claim this task as which worker?', claimWorker);
      const worker = answer === null ? '' : answer.trim();
      if (!worker) return;
      await withButton('claim-task-btn', async () => {
        const t = await fetchJSON('/tasks/' + encodeURIComponent(id) + '/claim', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ worker: worker })
        });
        claimWorker = worker;
        if (t && t.id) {
          currentTask = t;
          renderTaskDetails(t, true);
        }
        await Promise.all([loadStats(), loadTasks()]);
      });
    }

    async function kickTask(id) {
      if (!id) return;
      await withButton('kick-task-btn', async () => {
        await fetchJSON('/tasks/' + encodeURIComponent(id) + '/kick', { method: 'POST' });
        await finishTaskTransition(id);
      });
    }

    async function closeTask(id) {
      if (!id) return;
      if (typeof confirm === 'function' && !confirm('Close this task as done without a result?')) return;
      await withButton('close-task-btn', async () => {
        await fetchJSON('/tasks/' + encodeURIComponent(id) + '/close', { method: 'POST' });
        await finishTaskTransition(id);
      });
    }

    async function deleteTask(t) {
      if (!t || !t.id || isActivelyLeased(t)) return;
      const hasResult = t.status === 'done' && t.primitives && (typeof t.primitives !== 'object' || Object.keys(t.primitives).length > 0);
      const prompt = hasResult
        ? 'Delete ' + t.id + ' and discard its recorded result? This cannot be undone.'
        : 'Are you sure you want to delete this task?';
      if (typeof confirm === 'function' && !confirm(prompt)) return;
      const url = '/tasks/' + encodeURIComponent(t.id) + (t.status === 'done' ? '?force=1' : '');
      await withButton('delete-task-btn', async () => {
        await fetchJSON(url, { method: 'DELETE' });
        await clearSelectedTask();
      });
    }

    function toggleTaskEdit() {
      if (!currentTask || currentTask.status === 'done' || isActivelyLeased(currentTask)) return;
      isEditingTask = !isEditingTask;
      renderTaskDetails(currentTask, true);
    }

    function cancelTaskEdit() {
      isEditingTask = false;
      renderTaskDetails(currentTask, true);
    }

    async function saveTaskEdit() {
      if (!currentTask || currentTask.status === 'done' || isActivelyLeased(currentTask)) return;
      const projInput = document.getElementById('edit-task-project');
      const prioInput = document.getElementById('edit-task-priority');
      const assetInput = document.getElementById('edit-task-asset-path');
      const bodyInput = document.getElementById('edit-task-body');

      const proj = projInput ? projInput.value.trim() : (currentTask.project || '');
      const prioText = prioInput ? prioInput.value.trim() : '';
      const asset = assetInput ? assetInput.value.trim() : (currentTask.asset_path || '');
      const body = bodyInput ? bodyInput.value : (currentTask.body || '');

      const projErr = projectError(proj);
      if (projErr) {
        showError(projErr.message);
        return;
      }
      if (prioText === '') {
        showError('Priority must be specified');
        return;
      }
      const priority = parseInt(prioText, 10);
      if (!Number.isInteger(priority) || priority < 0) {
        showError('Priority must be a whole number, 0 or greater');
        return;
      }
      const bErr = bodyError(body, asset);
      if (bErr) {
        showError(bErr.message);
        return;
      }
      const saveBtn = document.getElementById('save-task-btn');
      const cancelBtn = document.getElementById('cancel-task-btn');
      if (saveBtn) saveBtn.disabled = true;
      if (cancelBtn) cancelBtn.disabled = true;
      const payload = {
        project: proj,
        priority: priority,
        asset_path: asset,
        body: body
      };
      try {
        await fetchJSON('/tasks/' + encodeURIComponent(currentTask.id), {
          method: 'PATCH',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(payload)
        });
        await finishTaskTransition();
      } catch (err) {
        if (saveBtn) saveBtn.disabled = false;
        if (cancelBtn) cancelBtn.disabled = false;
        showFetchError(err);
      }
    }
    async function copyToClipboard(text, btn, label) {
      if (!btn) return;
      try {
        if (typeof navigator !== 'undefined' && navigator.clipboard && navigator.clipboard.writeText) {
          await navigator.clipboard.writeText(text);
        } else if (typeof document !== 'undefined' && document.body && document.execCommand) {
          const ta = document.createElement('textarea');
          ta.value = text;
          ta.style.position = 'fixed';
          ta.style.opacity = '0';
          document.body.appendChild(ta);
          ta.select();
          const ok = document.execCommand('copy');
          document.body.removeChild(ta);
          if (!ok) throw new Error('copy command failed');
        } else {
          throw new Error('clipboard API unavailable');
        }
        btn.textContent = 'Copied!';
        if (btn._copyTimer) clearTimeout(btn._copyTimer);
        btn._copyTimer = setTimeout(() => {
          btn.textContent = 'Copy';
          btn._copyTimer = null;
        }, 1500);
      } catch (err) {
        showError('Failed to copy ' + label + ': ' + (err && err.message ? err.message : err));
      }
    }

    function clearFormErrors() {
      const summary = document.getElementById('form-error-summary');
      if (summary) {
        summary.style.display = 'none';
        const list = document.getElementById('form-error-summary-list');
        if (list) list.innerHTML = '';
      }
      const form = document.getElementById('submit-task-form');
      if (form) {
        form.querySelectorAll('[aria-invalid]').forEach(el => el.setAttribute('aria-invalid', 'false'));
        form.querySelectorAll('.field-error').forEach(el => {
          el.textContent = '';
          el.style.display = 'none';
        });
      }
    }

    function showFormErrors(errors) {
      clearFormErrors();
      if (!errors || errors.length === 0) return;
      const summary = document.getElementById('form-error-summary');
      const list = document.getElementById('form-error-summary-list');
      if (summary && list) {
        list.innerHTML = '';
        for (const err of errors) {
          const li = document.createElement('li');
          const a = document.createElement('a');
          a.href = '#' + err.fieldId;
          a.textContent = err.message;
          a.onclick = function(e) {
            e.preventDefault();
            const target = document.getElementById(err.fieldId);
            if (target) target.focus();
          };
          li.appendChild(a);
          list.appendChild(li);

          const targetIds = err.fieldIds || [err.fieldId];
          for (const id of targetIds) {
            const input = document.getElementById(id);
            if (input) input.setAttribute('aria-invalid', 'true');
            const errEl = document.getElementById(id + '-error');
            if (errEl) {
              errEl.textContent = 'Error: ' + err.message;
              errEl.style.display = 'block';
            }
          }
        }
        summary.style.display = 'block';
        summary.focus();
      }
    }

    // The daemon's validProject and validTaskID accept the same byte set, so
    // the form refuses what POST /tasks would answer with a bare 400.
    const NAME_RE = /^[A-Za-z0-9._-]+$/;

    function projectError(proj) {
      if (!proj) {
        return { fieldId: 'form-project', message: 'Project name is required' };
      }
      if (proj.length > 64 || !NAME_RE.test(proj)) {
        return {
          fieldId: 'form-project',
          message: 'Project must be 1-64 characters: letters, digits, dot, underscore or hyphen'
        };
      }
      return null;
    }

    function customIdError(id) {
      if (!id || id.length > 128 || !NAME_RE.test(id)) {
        return {
          fieldId: 'form-id',
          message: 'Custom ID must be 1-128 characters: letters, digits, dot, underscore or hyphen'
        };
      }
      if (id === '.' || id === '..' || /^(claim|purge)$/i.test(id)) {
        return { fieldId: 'form-id', message: 'Custom ID "' + id + '" is reserved, pick another one' };
      }
      return null;
    }

    // Each field is trimmed where the daemon trims it: asset_path yes, body no.
    function bodyError(body, asset) {
      if (body !== '' && body.trim() === '') {
        return { fieldId: 'form-body', message: 'Body cannot be only whitespace' };
      }
      if (body === '' && asset.trim() === '') {
        return {
          fieldId: 'form-body',
          fieldIds: ['form-body', 'form-asset'],
          message: 'Either Body or Asset Path must be provided'
        };
      }
      return null;
    }

    async function submitTask(e) {
      if (e && e.preventDefault) e.preventDefault();
      clearFormErrors();
      const projEl = document.getElementById('form-project');
      const bodyEl = document.getElementById('form-body');
      const prioEl = document.getElementById('form-priority');
      const assetEl = document.getElementById('form-asset');
      const idEl = document.getElementById('form-id');

      const proj = projEl ? projEl.value.trim() : '';
      const body = bodyEl ? bodyEl.value : '';
      const prioText = prioEl ? prioEl.value.trim() : '';
      const prio = prioText === '' ? null : parseInt(prioText, 10);
      const asset = assetEl ? assetEl.value.trim() : '';
      const customId = idEl ? idEl.value.trim() : '';

      const errors = [];
      const projErr = projectError(proj);
      if (projErr) {
        errors.push(projErr);
      }
      const bodyErr = bodyError(body, asset);
      if (bodyErr) {
        errors.push(bodyErr);
      }
      if (prio !== null && (!Number.isInteger(prio) || prio < 0)) {
        errors.push({ fieldId: 'form-priority', message: 'Priority must be a whole number, 0 or greater' });
      }
      if (customId !== '') {
        const idErr = customIdError(customId);
        if (idErr) {
          errors.push(idErr);
        }
      }

      if (errors.length > 0) {
        showFormErrors(errors);
        return;
      }

      const payload = {
        project: proj,
        body: body
      };
      if (prio !== null) payload.priority = prio;
      if (asset) payload.asset_path = asset;
      if (customId) payload.id = customId;

      const submitBtn = document.getElementById('submit-task-btn');
      if (submitBtn) submitBtn.disabled = true;

      try {
        await fetchJSON('/tasks', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(payload)
        });
        if (bodyEl) bodyEl.value = '';
        if (assetEl) assetEl.value = '';
        if (idEl) idEl.value = '';
        clearFormErrors();
        showError(null);
        await loadAll();
      } catch (err) {
        if (err.transport) return;
        // 409 is only ever a duplicate custom id here; every other refusal
        // lands on the body, the one field that always carries content.
        const fieldId = err.status === 409 ? 'form-id' : 'form-body';
        showFormErrors([{ fieldId: fieldId, message: err.message || 'Failed to submit task' }]);
      } finally {
        if (submitBtn) submitBtn.disabled = false;
      }
    }

    function escapeHTML(str) {
      if (str === null || str === undefined) return '';
      return String(str).replace(/[&<>'"]/g, tag => ({
        '&': '&amp;',
        '<': '&lt;',
        '>': '&gt;',
        "'": '&#39;',
        '"': '&quot;'
      }[tag] || tag));
    }

    async function loadAll() {
      if (refreshInFlight) return;
      refreshInFlight = true;
      try {
        const tasks = [loadProjects(), loadWorkers(), loadStats(), loadTasks()];
        if (selectedTaskId) tasks.push(loadTaskDetails(selectedTaskId));
        await Promise.all(tasks);
      } catch (e) {
        logFailure('Failed to refresh data:', e);
      } finally {
        refreshInFlight = false;
        scheduleRefresh();
      }
    }

    let searchDebounceTimer = null;
    function onSearchInput() {
      if (searchDebounceTimer) clearTimeout(searchDebounceTimer);
      searchDebounceTimer = setTimeout(() => {
        currentPage = 1;
        syncURL(false);
        loadTasks();
      }, 200);
    }

    function clearSearch() {
      const el = document.getElementById('filter-search');
      if (el) {
        el.value = '';
        if (searchDebounceTimer) clearTimeout(searchDebounceTimer);
        currentPage = 1;
        syncURL(false);
        loadTasks();
      }
    }

    function setupSearch() {
      const el = document.getElementById('filter-search');
      if (!el) return;
      el.addEventListener('keydown', (e) => {
        if (e.key === 'Escape') {
          clearSearch();
        }
      });
    }

    async function boot() {
      setupRowActivation();
      setupCardFilters();
      setupSearch();
      setupBodyOverlay();
      applyURLState();
      syncURL(false);
      try {
        await Promise.all([loadProjects(), loadWorkers()]);
        await Promise.all([loadStats(), loadTasks()]);
      } catch (e) {
        logFailure('Failed to boot UI:', e);
      }
      setupAutoRefresh();
    }

    function setupAutoRefresh() {
      const cb = document.getElementById('auto-refresh');
      scheduleRefresh();
      if (cb) cb.onchange = setupAutoRefresh;
    }
    window.addEventListener('popstate', () => {
      applyURLState();
      loadTasks();
      loadStats();
    });

    boot();
  </script>
</body>
</html>
