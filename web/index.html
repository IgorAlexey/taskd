<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>taskd</title>
<style>
  :root {
    --bg: #0d1117;
    --surface: #161b22;
    --border: #30363d;
    --text: #c9d1d9;
    --text-muted: #8b949e;
    --accent: #58a6ff;
    --accent-hover: #79c0ff;
    --pending: #d29922;
    --leased: #1f6feb;
    --done: #238636;
    --danger: #f85149;
    --font: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
    --mono: ui-monospace, SFMono-Regular, "SF Mono", Menlo, Consolas, monospace;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    background: var(--bg);
    color: var(--text);
    font-family: var(--font);
    font-size: 14px;
    line-height: 1.5;
    padding: 16px;
  }
  header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding-bottom: 16px;
    border-bottom: 1px solid var(--border);
    margin-bottom: 16px;
  }
  h1 {
    font-size: 18px;
    font-weight: 600;
    letter-spacing: 0.5px;
    color: #f0f6fc;
  }
  .controls {
    display: flex;
    gap: 8px;
    align-items: center;
  }
  button, input, select, textarea {
    font-family: inherit;
    font-size: 13px;
    background: var(--surface);
    color: var(--text);
    border: 1px solid var(--border);
    border-radius: 6px;
    padding: 6px 10px;
  }
  button {
    cursor: pointer;
    background: #21262d;
    font-weight: 500;
    transition: background 0.15s ease;
  }
  button:hover { background: #30363d; }
  button.primary {
    background: var(--done);
    border-color: rgba(240,246,252,0.1);
    color: #ffffff;
  }
  button.primary:hover { background: #2ea043; }
  .grid-stats {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(140px, 1fr));
    gap: 12px;
    margin-bottom: 16px;
  }
  .card {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 6px;
    padding: 12px;
  }
  .stat-val {
    font-size: 22px;
    font-weight: 700;
    color: #f0f6fc;
    margin-top: 4px;
  }
  .stat-label {
    font-size: 12px;
    color: var(--text-muted);
    text-transform: uppercase;
    letter-spacing: 0.5px;
  }
  .layout {
    display: grid;
    grid-template-columns: 1fr 380px;
    gap: 16px;
  }
  @media (max-width: 900px) {
    .layout { grid-template-columns: 1fr; }
  }
  .panel {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 6px;
    display: flex;
    flex-direction: column;
    overflow: hidden;
  }
  .panel-header {
    padding: 10px 14px;
    background: #1c2128;
    border-bottom: 1px solid var(--border);
    display: flex;
    justify-content: space-between;
    align-items: center;
    font-weight: 600;
    font-size: 13px;
  }
  .filter-bar {
    display: flex;
    gap: 8px;
    padding: 10px 14px;
    border-bottom: 1px solid var(--border);
    background: #161b22;
    align-items: center;
    flex-wrap: wrap;
  }
  table {
    width: 100%;
    border-collapse: collapse;
    font-size: 13px;
  }
  th, td {
    padding: 8px 12px;
    text-align: left;
    border-bottom: 1px solid var(--border);
  }
  th {
    color: var(--text-muted);
    font-weight: 600;
    font-size: 12px;
  }
  tbody tr:hover td {
    background: rgba(255,255,255,0.03);
  }
  tbody tr[aria-selected="true"] td,
  tbody tr[aria-selected="true"] th {
    background: rgba(88,166,255,0.1);
  }
  tbody tr:focus-within td,
  tbody tr:focus-within th {
    background: rgba(88,166,255,0.18);
  }
  tbody tr[data-task-id] { cursor: pointer; }
  tbody th {
    color: var(--text);
    font-weight: 400;
  }
  .row-select {
    background: none;
    border: 0;
    border-radius: 3px;
    padding: 0;
    font: inherit;
    color: var(--accent);
    text-align: left;
  }
  .row-select:hover {
    background: none;
    text-decoration: underline;
  }
  .row-select:focus-visible {
    outline: 2px solid var(--accent-hover);
    outline-offset: 2px;
  }
  .badge {
    display: inline-block;
    padding: 2px 6px;
    border-radius: 12px;
    font-size: 11px;
    font-weight: 600;
    text-transform: uppercase;
  }
  .badge-pending { background: rgba(210,153,34,0.15); color: var(--pending); border: 1px solid var(--pending); }
  .badge-leased { background: rgba(31,111,235,0.15); color: var(--leased); border: 1px solid var(--leased); }
  .badge-done { background: rgba(35,134,54,0.15); color: var(--done); border: 1px solid var(--done); }
  .mono { font-family: var(--mono); font-size: 12px; }
  .sidebar-section {
    padding: 14px;
    border-bottom: 1px solid var(--border);
  }
  .sidebar-section:last-child { border-bottom: none; }
  .field {
    margin-bottom: 10px;
  }
  .field label {
    display: block;
    font-size: 12px;
    color: var(--text-muted);
    margin-bottom: 4px;
    font-weight: 500;
  }
  .field input, .field textarea, .field select {
    width: 100%;
  }
  .field textarea {
    resize: vertical;
    min-height: 80px;
  }
  pre {
    background: #0d1117;
    border: 1px solid var(--border);
    border-radius: 4px;
    padding: 8px;
    font-family: var(--mono);
    font-size: 12px;
    overflow-x: auto;
    white-space: pre-wrap;
    word-break: break-all;
    max-height: 200px;
  }
  #error-banner {
    display: none;
    background: rgba(248,81,73,0.15);
    border: 1px solid var(--danger);
    color: var(--danger);
    padding: 8px 12px;
    border-radius: 6px;
    margin-bottom: 16px;
    font-size: 13px;
  }
</style>
</head>
<body>
  <div id="error-banner"></div>
  <header>
    <h1>taskd</h1>
    <div class="controls">
      <label style="font-size: 12px; color: var(--text-muted);">
        <input type="checkbox" id="auto-refresh" checked> Auto-refresh
      </label>
      <button id="refresh-btn" onclick="loadAll()">Refresh</button>
    </div>
  </header>

  <div class="grid-stats">
    <div class="card">
      <div class="stat-label">Pending</div>
      <div class="stat-val" id="stat-pending">0</div>
    </div>
    <div class="card">
      <div class="stat-label">Leased</div>
      <div class="stat-val" id="stat-leased">0</div>
    </div>
    <div class="card">
      <div class="stat-label">Done</div>
      <div class="stat-val" id="stat-done">0</div>
    </div>
    <div class="card">
      <div class="stat-label">Total</div>
      <div class="stat-val" id="stat-total">0</div>
    </div>
  </div>

  <div class="layout">
    <div class="panel">
      <div class="panel-header">
        <span>Task Queue</span>
        <span id="queue-count" style="color: var(--text-muted); font-size: 12px;">0 tasks</span>
      </div>
      <div class="filter-bar">
        <label style="color: var(--text-muted); font-size: 12px;">Project:</label>
        <select id="filter-project" onchange="loadTasks()">
          <option value="">(all)</option>
        </select>
        <label style="color: var(--text-muted); font-size: 12px; margin-left: 8px;">Status:</label>
        <select id="filter-status" onchange="loadTasks()">
          <option value="">(all)</option>
          <option value="pending">Pending</option>
          <option value="leased">Leased</option>
          <option value="done">Done</option>
        </select>
      </div>
      <div style="overflow-x: auto;">
        <table>
          <thead>
            <tr>
              <th scope="col">ID</th>
              <th scope="col">Project</th>
              <th scope="col">Status</th>
              <th scope="col">Priority</th>
              <th scope="col">Worker</th>
              <th scope="col">Summary</th>
            </tr>
          </thead>
          <tbody id="task-table-body">
            <tr><td colspan="6" style="text-align: center; color: var(--text-muted);">No tasks</td></tr>
          </tbody>
        </table>
      </div>
    </div>

    <div style="display: flex; flex-direction: column; gap: 16px;">
      <div class="panel">
        <div class="panel-header">Task Details</div>
        <div class="sidebar-section" id="task-details-content">
          <p style="color: var(--text-muted); font-style: italic;">Select a task to view details</p>
        </div>
      </div>

      <div class="panel">
        <div class="panel-header">Submit Task</div>
        <div class="sidebar-section">
          <form id="submit-task-form" onsubmit="submitTask(event)">
            <div class="field">
              <label>Project *</label>
              <input type="text" id="form-project" required placeholder="e.g. default">
            </div>
            <div class="field">
              <label>Priority</label>
              <input type="number" id="form-priority" value="0">
            </div>
            <div class="field">
              <label>Body</label>
              <textarea id="form-body" placeholder="Task description or prompt..."></textarea>
            </div>
            <div class="field">
              <label>Asset Path (optional)</label>
              <input type="text" id="form-asset" placeholder="/path/to/asset">
            </div>
            <div class="field">
              <label>Custom ID (optional)</label>
              <input type="text" id="form-id" placeholder="auto-generated if empty">
            </div>
            <button type="submit" class="primary" style="width: 100%;">Submit Task</button>
          </form>
        </div>
      </div>
    </div>
  </div>

  <script>
    let selectedTaskId = null;
    let refreshTimer = null;

    function showError(msg) {
      const b = document.getElementById('error-banner');
      if (!b) return;
      if (!msg) {
        b.style.display = 'none';
        return;
      }
      b.textContent = msg;
      b.style.display = 'block';
    }

    async function fetchJSON(url, opts) {
      try {
        const res = await fetch(url, opts);
        if (!res.ok) {
          const txt = await res.text();
          throw new Error(txt || res.statusText || ('HTTP ' + res.status));
        }
        showError(null);
        if (res.status === 204) return null;
        const ct = res.headers.get('content-type') || '';
        if (ct.includes('application/json')) {
          return await res.json();
        }
        const txt = await res.text();
        return txt ? JSON.parse(txt) : null;
      } catch (err) {
        showError(err.message);
        throw err;
      }
    }

    async function loadProjects() {
      try {
        const projects = await fetchJSON('/projects');
        const select = document.getElementById('filter-project');
        if (!select) return;
        const current = select.value;
        select.innerHTML = '<option value="">(all)</option>';
        if (Array.isArray(projects)) {
          for (const p of projects) {
            const opt = document.createElement('option');
            opt.value = p;
            opt.textContent = p;
            select.appendChild(opt);
          }
        }
        select.value = current;
      } catch (e) {
        console.error('Failed to load projects:', e);
      }
    }

    async function loadStats() {
      const select = document.getElementById('filter-project');
      const proj = select ? select.value : '';
      let url = '/stats';
      if (proj) url += '?project=' + encodeURIComponent(proj);
      try {
        const stats = await fetchJSON(url);
        if (!stats) return;
        const setVal = (id, val) => {
          const el = document.getElementById(id);
          if (el) el.textContent = val ?? 0;
        };
        setVal('stat-pending', stats.pending);
        setVal('stat-leased', stats.leased);
        setVal('stat-done', stats.done);
        setVal('stat-total', stats.total);
      } catch (e) {
        console.error('Failed to load stats:', e);
      }
    }

    function resetTaskDetails() {
      const pane = document.getElementById('task-details-content');
      if (pane) {
        pane.innerHTML = '<p style="color: var(--text-muted); font-style: italic;">Select a task to view details</p>';
      }
    }

    async function loadTasks() {
      const projEl = document.getElementById('filter-project');
      const statusEl = document.getElementById('filter-status');
      const proj = projEl ? projEl.value : '';
      const status = statusEl ? statusEl.value : '';
      let url = '/tasks?limit=200';
      if (proj) url += '&project=' + encodeURIComponent(proj);
      if (status) url += '&status=' + encodeURIComponent(status);

      try {
        const tasks = await fetchJSON(url);
        const tbody = document.getElementById('task-table-body');
        const countEl = document.getElementById('queue-count');
        const count = Array.isArray(tasks) ? tasks.length : 0;
        if (countEl) countEl.textContent = count + ' tasks';

        if (!tbody) return;

        if (!Array.isArray(tasks) || tasks.length === 0) {
          tbody.innerHTML = '<tr><td colspan="6" style="text-align: center; color: var(--text-muted); padding: 20px;">No tasks found</td></tr>';
          if (selectedTaskId) {
            selectedTaskId = null;
            resetTaskDetails();
          }
          return;
        }

        tbody.innerHTML = '';
        let foundSelected = false;
        for (const t of tasks) {
          if (!t) continue;
          const tr = document.createElement('tr');
          const tid = String(t.id || '');
          tr.dataset.taskId = tid;
          if (t.id === selectedTaskId) {
            tr.setAttribute('aria-selected', 'true');
            foundSelected = true;
          } else {
            tr.setAttribute('aria-selected', 'false');
          }
          const shortId = tid.length > 10 ? tid.slice(0, 8) + '…' : tid;
          const summary = t.body ? (t.body.length > 50 ? t.body.slice(0, 50) + '…' : t.body) : (t.asset_path || '');
          tr.innerHTML = `
            <th scope="row" class="mono"><button type="button" class="row-select" title="${escapeHTML(tid)}">${escapeHTML(shortId)}</button></th>
            <td>${escapeHTML(t.project || '')}</td>
            <td><span class="badge badge-${escapeHTML(t.status || 'unknown')}">${escapeHTML(t.status || '')}</span></td>
            <td>${escapeHTML(String(t.priority ?? 0))}</td>
            <td class="mono">${escapeHTML(t.worker || '')}</td>
            <td>${escapeHTML(summary)}</td>
          `;
          tbody.appendChild(tr);
        }

        if (selectedTaskId && !foundSelected) {
          selectedTaskId = null;
          resetTaskDetails();
        } else if (selectedTaskId && foundSelected) {
          loadTaskDetails(selectedTaskId);
        }
      } catch (e) {
        console.error('Failed to load tasks:', e);
      }
    }

    function selectTask(id) {
      if (!id) return;
      selectedTaskId = id;
      const tbody = document.getElementById('task-table-body');
      if (tbody) {
        for (const tr of tbody.querySelectorAll('tr[data-task-id]')) {
          tr.setAttribute('aria-selected', tr.dataset.taskId === id ? 'true' : 'false');
        }
      }
      loadTaskDetails(id);
    }

    function setupRowActivation() {
      const tbody = document.getElementById('task-table-body');
      if (!tbody) return;
      tbody.addEventListener('click', (e) => {
        const tr = e.target.closest('tr[data-task-id]');
        if (tr) selectTask(tr.dataset.taskId);
      });
    }

    async function loadTaskDetails(id) {
      if (!id) {
        resetTaskDetails();
        return;
      }
      try {
        const t = await fetchJSON('/tasks/' + encodeURIComponent(id));
        const pane = document.getElementById('task-details-content');
        if (!pane) return;
        if (!t) {
          pane.innerHTML = '<p style="color: var(--text-muted);">Task not found</p>';
          return;
        }
        let primStr = '';
        if (t.primitives !== null && t.primitives !== undefined) {
          if (typeof t.primitives === 'string') {
            try {
              primStr = JSON.stringify(JSON.parse(t.primitives), null, 2);
            } catch (_) {
              primStr = t.primitives;
            }
          } else {
            primStr = JSON.stringify(t.primitives, null, 2);
          }
        }
        let leaseExpStr = '';
        if (t.status === 'leased' && t.lease_expires) {
          try {
            leaseExpStr = new Date(t.lease_expires * 1000).toLocaleString();
          } catch (_) {
            leaseExpStr = String(t.lease_expires);
          }
        }
        pane.innerHTML = `
          <div class="field"><label>ID</label><span class="mono">${escapeHTML(t.id || '')}</span></div>
          <div class="field"><label>Project</label><span>${escapeHTML(t.project || '')}</span></div>
          <div class="field"><label>Status</label><span class="badge badge-${escapeHTML(t.status || 'unknown')}">${escapeHTML(t.status || '')}</span></div>
          <div class="field"><label>Priority</label><span>${escapeHTML(String(t.priority ?? 0))}</span></div>
          ${t.worker ? `<div class="field"><label>Worker</label><span class="mono">${escapeHTML(t.worker)}</span></div>` : ''}
          ${leaseExpStr ? `<div class="field"><label>Lease Expires</label><span>${escapeHTML(leaseExpStr)}</span></div>` : ''}
          ${t.asset_path ? `<div class="field"><label>Asset Path</label><span class="mono">${escapeHTML(t.asset_path)}</span></div>` : ''}
          <div class="field"><label>Body</label><pre>${escapeHTML(t.body || '')}</pre></div>
          ${primStr ? `<div class="field"><label>Primitives</label><pre>${escapeHTML(primStr)}</pre></div>` : ''}
        `;
      } catch (e) {
        console.error('Failed to load task details:', e);
      }
    }

    async function submitTask(e) {
      if (e && e.preventDefault) e.preventDefault();
      const projEl = document.getElementById('form-project');
      const bodyEl = document.getElementById('form-body');
      const prioEl = document.getElementById('form-priority');
      const assetEl = document.getElementById('form-asset');
      const idEl = document.getElementById('form-id');

      const proj = projEl ? projEl.value.trim() : '';
      const body = bodyEl ? bodyEl.value : '';
      const prio = prioEl ? (parseInt(prioEl.value, 10) || 0) : 0;
      const asset = assetEl ? assetEl.value.trim() : '';
      const customId = idEl ? idEl.value.trim() : '';

      if (!proj || proj === '*') {
        showError('Project name is required');
        return;
      }
      if (!body.trim() && !asset) {
        showError('Either Body or Asset Path must be provided');
        return;
      }
      if (prio < 0) {
        showError('Priority must be 0 or greater');
        return;
      }

      const payload = {
        project: proj,
        body: body,
        priority: prio
      };
      if (asset) payload.asset_path = asset;
      if (customId) payload.id = customId;

      try {
        const res = await fetchJSON('/tasks', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(payload)
        });
        if (res) {
          if (bodyEl) bodyEl.value = '';
          if (assetEl) assetEl.value = '';
          if (idEl) idEl.value = '';
          showError(null);
          await loadAll();
        }
      } catch (err) {
        console.error('Failed to submit task:', err);
      }
    }

    function escapeHTML(str) {
      if (str === null || str === undefined) return '';
      return String(str).replace(/[&<>'"]/g, tag => ({
        '&': '&amp;',
        '<': '&lt;',
        '>': '&gt;',
        "'": '&#39;',
        '"': '&quot;'
      }[tag] || tag));
    }

    async function loadAll() {
      try {
        await Promise.all([loadProjects(), loadStats(), loadTasks()]);
      } catch (e) {
        console.error('Failed to refresh data:', e);
      }
    }

    function setupAutoRefresh() {
      const cb = document.getElementById('auto-refresh');
      if (refreshTimer) clearInterval(refreshTimer);
      if (cb && cb.checked) {
        refreshTimer = setInterval(loadAll, 3000);
      }
      if (cb) cb.onchange = setupAutoRefresh;
    }

    setupRowActivation();
    loadAll();
    setupAutoRefresh();
  </script>
</body>
</html>
