<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>taskd</title>
<style>
  :root {
    --bg: #0d1117;
    --surface: #161b22;
    --border: #30363d;
    --text: #c9d1d9;
    --text-muted: #8b949e;
    --accent: #58a6ff;
    --accent-hover: #79c0ff;
    --pending: #d29922;
    --leased: #1f6feb;
    --done: #238636;
    --danger: #f85149;
    --font: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
    --mono: ui-monospace, SFMono-Regular, "SF Mono", Menlo, Consolas, monospace;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    background: var(--bg);
    color: var(--text);
    font-family: var(--font);
    font-size: 14px;
    line-height: 1.5;
    padding: 16px;
  }
  header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding-bottom: 16px;
    border-bottom: 1px solid var(--border);
    margin-bottom: 16px;
  }
  h1 {
    font-size: 18px;
    font-weight: 600;
    letter-spacing: 0.5px;
    color: #f0f6fc;
  }
  .controls {
    display: flex;
    gap: 8px;
    align-items: center;
  }
  button, input, select, textarea {
    font-family: inherit;
    font-size: 13px;
    background: var(--surface);
    color: var(--text);
    border: 1px solid var(--border);
    border-radius: 6px;
    padding: 6px 10px;
  }
  :focus-visible {
    outline: 3px solid var(--accent);
    outline-offset: 2px;
  }
  .skip-link {
    position: absolute;
    top: 8px;
    left: 8px;
    z-index: 10;
    clip-path: inset(50%);
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 6px;
    padding: 8px 12px;
    color: var(--text);
    font-size: 13px;
    font-weight: 500;
    text-decoration: none;
  }
  .skip-link:focus {
    clip-path: none;
  }
  button {
    cursor: pointer;
    background: #21262d;
    font-weight: 500;
    transition: background 0.15s ease;
  }
  button:hover { background: #30363d; }
  button.primary {
    background: var(--done);
    border-color: rgba(240,246,252,0.1);
    color: #ffffff;
  }
  button.primary:hover { background: #2ea043; }
  .grid-stats {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(140px, 1fr));
    gap: 12px;
    margin-bottom: 16px;
  }
  .card {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 6px;
    padding: 12px;
  }
  .stat-val {
    font-size: 22px;
    font-weight: 700;
    color: #f0f6fc;
    margin-top: 4px;
  }
  .stat-label {
    font-size: 12px;
    color: var(--text-muted);
    text-transform: uppercase;
    letter-spacing: 0.5px;
  }
  .layout {
    display: grid;
    grid-template-columns: 1fr 380px;
    gap: 16px;
  }
  @media (max-width: 900px) {
    .layout { grid-template-columns: 1fr; }
  }
  .panel {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 6px;
    display: flex;
    flex-direction: column;
    overflow: hidden;
  }
  .panel-header {
    margin: 0;
    padding: 10px 14px;
    background: #1c2128;
    border-bottom: 1px solid var(--border);
    display: flex;
    justify-content: space-between;
    align-items: center;
    font-weight: 600;
    font-size: 13px;
  }
  .panel-header h2 {
    margin: 0;
    font-size: inherit;
    font-weight: inherit;
  }
  .filter-bar {
    display: flex;
    gap: 8px;
    padding: 10px 14px;
    border-bottom: 1px solid var(--border);
    background: #161b22;
    align-items: center;
    flex-wrap: wrap;
  }
  table {
    width: 100%;
    border-collapse: collapse;
    font-size: 13px;
  }
  th, td {
    padding: 8px 12px;
    text-align: left;
    border-bottom: 1px solid var(--border);
  }
  th {
    color: var(--text-muted);
    font-weight: 600;
    font-size: 12px;
  }
  tbody tr:hover td {
    background: rgba(255,255,255,0.03);
  }
  tbody tr[aria-selected="true"] td,
  tbody tr[aria-selected="true"] th {
    background: rgba(88,166,255,0.1);
  }
  tbody tr:focus-within td,
  tbody tr:focus-within th {
    background: rgba(88,166,255,0.18);
  }
  tbody tr[data-task-id] { cursor: pointer; }
  tbody th {
    color: var(--text);
    font-weight: 400;
  }
  .row-select {
    background: none;
    border: 0;
    border-radius: 3px;
    padding: 0;
    font: inherit;
    color: var(--accent);
    text-align: left;
  }
  .row-select:hover {
    background: none;
    text-decoration: underline;
  }
  .badge {
    display: inline-block;
    padding: 2px 6px;
    border-radius: 12px;
    font-size: 11px;
    font-weight: 600;
    text-transform: uppercase;
  }
  .badge-pending { background: rgba(210,153,34,0.15); color: var(--pending); border: 1px solid var(--pending); }
  .badge-leased { background: rgba(31,111,235,0.15); color: var(--leased); border: 1px solid var(--leased); }
  .badge-done { background: rgba(35,134,54,0.15); color: var(--done); border: 1px solid var(--done); }
  .mono { font-family: var(--mono); font-size: 12px; }
  .sidebar-section {
    padding: 14px;
    border-bottom: 1px solid var(--border);
  }
  .sidebar-section:last-child { border-bottom: none; }
  .field {
    margin-bottom: 10px;
  }
  .field label, .field .field-label {
    display: block;
    font-size: 12px;
    color: var(--text-muted);
    margin-bottom: 4px;
    font-weight: 500;
  }
  .field input, .field textarea, .field select {
    width: 100%;
  }
  .field textarea {
    resize: vertical;
    min-height: 80px;
  }
  pre {
    background: #0d1117;
    border: 1px solid var(--border);
    border-radius: 4px;
    padding: 8px;
    font-family: var(--mono);
    font-size: 12px;
    overflow-x: auto;
    white-space: pre-wrap;
    word-break: break-all;
    max-height: 200px;
  }
  #error-banner {
    display: none;
    background: rgba(248,81,73,0.15);
    border: 1px solid var(--danger);
    color: var(--danger);
    padding: 8px 12px;
    border-radius: 6px;
    margin-bottom: 16px;
    font-size: 13px;
  }
  .error-summary {
    display: none;
    background: rgba(248,81,73,0.1);
    border: 2px solid var(--danger);
    border-radius: 6px;
    padding: 12px;
    margin-bottom: 14px;
  }
  .error-summary:focus {
    outline: 2px solid var(--accent);
    outline-offset: 1px;
  }
  .error-summary-title {
    font-size: 13px;
    font-weight: 700;
    color: var(--danger);
    margin-bottom: 6px;
  }
  .error-summary-list {
    list-style: disc inside;
    margin: 0;
    padding: 0;
  }
  .error-summary-list li {
    font-size: 12px;
    line-height: 1.4;
    margin-bottom: 2px;
  }
  .error-summary-list a {
    color: var(--danger);
    text-decoration: underline;
    font-weight: 500;
  }
  .error-summary-list a:hover {
    color: #ff7b72;
  }
  .field-error {
    display: none;
    color: var(--danger);
    font-size: 12px;
    font-weight: 500;
    margin-bottom: 4px;
  }
  .field input[aria-invalid="true"],
  .field textarea[aria-invalid="true"] {
    border-color: var(--danger);
    background: rgba(248,81,73,0.06);
  }
</style>
</head>
<body>
  <a class="skip-link" href="#queue">Skip to task queue</a>
  <div id="error-banner"></div>
  <header>
    <h1>taskd</h1>
    <div class="controls">
      <label for="auto-refresh" style="font-size: 12px; color: var(--text-muted);">
        <input type="checkbox" id="auto-refresh" checked> Auto-refresh
      </label>
      <button id="refresh-btn" onclick="loadAll()">Refresh</button>
    </div>
  </header>

  <main>
  <div class="grid-stats">
    <div class="card">
      <div class="stat-label">Pending</div>
      <div class="stat-val" id="stat-pending">0</div>
    </div>
    <div class="card">
      <div class="stat-label">Leased</div>
      <div class="stat-val" id="stat-leased">0</div>
    </div>
    <div class="card">
      <div class="stat-label">Done</div>
      <div class="stat-val" id="stat-done">0</div>
    </div>
    <div class="card">
      <div class="stat-label">Total</div>
      <div class="stat-val" id="stat-total">0</div>
    </div>
  </div>

  <div class="layout">
    <section class="panel" aria-labelledby="queue-heading">
      <div class="panel-header">
        <h2 id="queue-heading">Task Queue</h2>
        <span id="queue-count" style="color: var(--text-muted); font-size: 12px;">0 tasks</span>
      </div>
      <div class="filter-bar" role="group" aria-label="Task filters">
        <label for="filter-project" style="color: var(--text-muted); font-size: 12px;">Project:</label>
        <select id="filter-project" onchange="loadTasks()">
          <option value="">(all)</option>
        </select>
        <label for="filter-status" style="color: var(--text-muted); font-size: 12px; margin-left: 8px;">Status:</label>
        <select id="filter-status" onchange="loadTasks()">
          <option value="">(all)</option>
          <option value="pending">Pending</option>
          <option value="leased">Leased</option>
          <option value="done">Done</option>
        </select>
      </div>
      <div id="queue" tabindex="-1" style="overflow-x: auto;">
        <table>
          <thead>
            <tr>
              <th scope="col">ID</th>
              <th scope="col">Project</th>
              <th scope="col">Status</th>
              <th scope="col">Priority</th>
              <th scope="col">Worker</th>
              <th scope="col">Summary</th>
            </tr>
          </thead>
          <tbody id="task-table-body">
            <tr><td colspan="6" style="text-align: center; color: var(--text-muted);">No tasks</td></tr>
          </tbody>
        </table>
      </div>
    </section>

    <div style="display: flex; flex-direction: column; gap: 16px;">
      <section class="panel" aria-labelledby="details-heading">
        <h2 class="panel-header" id="details-heading">Task Details</h2>
        <div class="sidebar-section" id="task-details-content">
          <p style="color: var(--text-muted); font-style: italic;">Select a task to view details</p>
        </div>
      </section>

      <section class="panel" aria-labelledby="submit-heading">
        <h2 class="panel-header" id="submit-heading">Submit Task</h2>
        <div class="sidebar-section">
          <form id="submit-task-form" onsubmit="submitTask(event)" novalidate>
            <div id="form-error-summary" class="error-summary" role="alert" tabindex="-1">
              <div class="error-summary-title">There is a problem</div>
              <ul class="error-summary-list" id="form-error-summary-list"></ul>
            </div>
            <div class="field">
              <label for="form-project">Project *</label>
              <span class="field-error" id="form-project-error"></span>
              <input type="text" id="form-project" required aria-required="true" placeholder="e.g. default" aria-invalid="false" aria-describedby="form-project-error">
            </div>
            <div class="field">
              <label for="form-priority">Priority (1 is top, blank for default)</label>
              <span class="field-error" id="form-priority-error"></span>
              <input type="number" id="form-priority" value="" aria-invalid="false" aria-describedby="form-priority-error">
            </div>
            <div class="field">
              <label for="form-body">Body</label>
              <span class="field-error" id="form-body-error"></span>
              <textarea id="form-body" placeholder="Task description or prompt..." aria-invalid="false" aria-describedby="form-body-error"></textarea>
            </div>
            <div class="field">
              <label for="form-asset">Asset Path (optional)</label>
              <span class="field-error" id="form-asset-error"></span>
              <input type="text" id="form-asset" placeholder="/path/to/asset" aria-invalid="false" aria-describedby="form-asset-error">
            </div>
            <div class="field">
              <label for="form-id">Custom ID (optional)</label>
              <input type="text" id="form-id" placeholder="auto-generated if empty">
            </div>
            <button type="submit" class="primary" style="width: 100%;">Submit Task</button>
          </form>
        </div>
      </section>
    </div>
  </div>
  </main>

  <script>
    let selectedTaskId = null;
    let refreshTimer = null;

    function showError(msg) {
      const b = document.getElementById('error-banner');
      if (!b) return;
      if (!msg) {
        b.style.display = 'none';
        return;
      }
      b.textContent = msg;
      b.style.display = 'block';
    }

    async function fetchJSON(url, opts) {
      try {
        const res = await fetch(url, opts);
        if (!res.ok) {
          const txt = await res.text();
          throw new Error(txt || res.statusText || ('HTTP ' + res.status));
        }
        showError(null);
        if (res.status === 204) return null;
        const ct = res.headers.get('content-type') || '';
        if (ct.includes('application/json')) {
          return await res.json();
        }
        const txt = await res.text();
        return txt ? JSON.parse(txt) : null;
      } catch (err) {
        showError(err.message);
        throw err;
      }
    }

    async function loadProjects() {
      try {
        const projects = await fetchJSON('/projects');
        const select = document.getElementById('filter-project');
        if (!select) return;
        const current = select.value;
        select.innerHTML = '<option value="">(all)</option>';
        if (Array.isArray(projects)) {
          for (const p of projects) {
            const opt = document.createElement('option');
            opt.value = p;
            opt.textContent = p;
            select.appendChild(opt);
          }
        }
        select.value = current;
      } catch (e) {
        console.error('Failed to load projects:', e);
      }
    }

    async function loadStats() {
      const select = document.getElementById('filter-project');
      const proj = select ? select.value : '';
      let url = '/stats';
      if (proj) url += '?project=' + encodeURIComponent(proj);
      try {
        const stats = await fetchJSON(url);
        if (!stats) return;
        const setVal = (id, val) => {
          const el = document.getElementById(id);
          if (el) el.textContent = val ?? 0;
        };
        setVal('stat-pending', stats.pending);
        setVal('stat-leased', stats.leased);
        setVal('stat-done', stats.done);
        setVal('stat-total', stats.total);
      } catch (e) {
        console.error('Failed to load stats:', e);
      }
    }

    function resetTaskDetails() {
      const pane = document.getElementById('task-details-content');
      if (pane) {
        pane.innerHTML = '<p style="color: var(--text-muted); font-style: italic;">Select a task to view details</p>';
      }
    }

    function rowFields(t) {
      const tid = String(t.id || '');
      return {
        id: tid,
        shortId: tid.length > 10 ? tid.slice(0, 8) + '…' : tid,
        project: t.project || '',
        status: t.status || '',
        badgeClass: 'badge badge-' + (t.status || 'unknown'),
        priority: String(t.priority ?? ''),
        worker: t.worker || '',
        summary: t.body ? (t.body.length > 50 ? t.body.slice(0, 50) + '…' : t.body) : (t.asset_path || '')
      };
    }

    function createRow(t, isSelected) {
      const f = rowFields(t);
      const tr = document.createElement('tr');
      tr.dataset.taskId = f.id;
      tr.setAttribute('aria-selected', isSelected ? 'true' : 'false');
      tr.innerHTML = `
        <th scope="row" class="mono"><button type="button" class="row-select" title="${escapeHTML(f.id)}">${escapeHTML(f.shortId)}</button></th>
        <td data-field="project">${escapeHTML(f.project)}</td>
        <td data-field="status"><span class="${escapeHTML(f.badgeClass)}">${escapeHTML(f.status)}</span></td>
        <td data-field="priority">${escapeHTML(f.priority)}</td>
        <td data-field="worker" class="mono">${escapeHTML(f.worker)}</td>
        <td data-field="summary">${escapeHTML(f.summary)}</td>
      `;
      return tr;
    }

    function setText(el, text) {
      if (el && el.textContent !== text) el.textContent = text;
    }

    function updateRow(tr, t, isSelected) {
      const f = rowFields(t);
      const selStr = isSelected ? 'true' : 'false';
      if (tr.getAttribute('aria-selected') !== selStr) {
        tr.setAttribute('aria-selected', selStr);
      }
      setText(tr.querySelector('[data-field="project"]'), f.project);
      setText(tr.querySelector('[data-field="priority"]'), f.priority);
      setText(tr.querySelector('[data-field="worker"]'), f.worker);
      setText(tr.querySelector('[data-field="summary"]'), f.summary);
      const badge = tr.querySelector('[data-field="status"] .badge');
      if (badge) {
        if (badge.className !== f.badgeClass) badge.className = f.badgeClass;
        setText(badge, f.status);
      }
    }

    async function loadTasks() {
      const projEl = document.getElementById('filter-project');
      const statusEl = document.getElementById('filter-status');
      const proj = projEl ? projEl.value : '';
      const status = statusEl ? statusEl.value : '';
      let url = '/tasks?limit=200';
      if (proj) url += '&project=' + encodeURIComponent(proj);
      if (status) url += '&status=' + encodeURIComponent(status);

      try {
        const tasks = await fetchJSON(url);
        const tbody = document.getElementById('task-table-body');
        const countEl = document.getElementById('queue-count');
        const count = Array.isArray(tasks) ? tasks.length : 0;
        if (countEl) countEl.textContent = count + ' tasks';

        if (!tbody) return;

        if (!Array.isArray(tasks) || tasks.length === 0) {
          for (const tr of Array.from(tbody.querySelectorAll('tr[data-task-id]'))) {
            tr.remove();
          }
          let emptyRow = tbody.querySelector('tr:not([data-task-id])');
          if (!emptyRow) {
            emptyRow = document.createElement('tr');
            emptyRow.innerHTML = '<td colspan="6" style="text-align: center; color: var(--text-muted); padding: 20px;">No tasks found</td>';
            tbody.appendChild(emptyRow);
          }
          if (selectedTaskId) {
            selectedTaskId = null;
            resetTaskDetails();
          }
          return;
        }

        const placeholder = tbody.querySelector('tr:not([data-task-id])');
        if (placeholder) {
          placeholder.remove();
        }

        const existingRows = new Map();
        for (const tr of tbody.querySelectorAll('tr[data-task-id]')) {
          existingRows.set(tr.dataset.taskId, tr);
        }

        const validTasks = tasks.filter(t => t && t.id);
        const newIds = new Set(validTasks.map(t => String(t.id)));

        for (const [id, tr] of existingRows) {
          if (!newIds.has(id)) {
            tr.remove();
            existingRows.delete(id);
          }
        }

        let foundSelected = false;
        for (let i = 0; i < validTasks.length; i++) {
          const t = validTasks[i];
          const tid = String(t.id);
          const isSelected = (selectedTaskId !== null && selectedTaskId !== undefined && tid === String(selectedTaskId));
          if (isSelected) foundSelected = true;

          let tr = existingRows.get(tid);
          if (!tr) {
            tr = createRow(t, isSelected);
            existingRows.set(tid, tr);
          } else {
            updateRow(tr, t, isSelected);
          }

          if (tbody.children[i] !== tr) {
            tbody.insertBefore(tr, tbody.children[i] || null);
          }
        }

        if (selectedTaskId && !foundSelected) {
          selectedTaskId = null;
          resetTaskDetails();
        } else if (selectedTaskId && foundSelected) {
          loadTaskDetails(selectedTaskId);
        }
      } catch (e) {
        console.error('Failed to load tasks:', e);
      }
    }

    function selectTask(id) {
      if (!id) return;
      selectedTaskId = id;
      const tbody = document.getElementById('task-table-body');
      if (tbody) {
        for (const tr of tbody.querySelectorAll('tr[data-task-id]')) {
          tr.setAttribute('aria-selected', tr.dataset.taskId === id ? 'true' : 'false');
        }
      }
      loadTaskDetails(id);
    }

    function setupRowActivation() {
      const tbody = document.getElementById('task-table-body');
      if (!tbody) return;
      tbody.addEventListener('click', (e) => {
        const tr = e.target.closest('tr[data-task-id]');
        if (tr) selectTask(tr.dataset.taskId);
      });
    }

    async function loadTaskDetails(id) {
      if (!id) {
        resetTaskDetails();
        return;
      }
      try {
        const t = await fetchJSON('/tasks/' + encodeURIComponent(id));
        const pane = document.getElementById('task-details-content');
        if (!pane) return;
        if (!t) {
          pane.innerHTML = '<p style="color: var(--text-muted);">Task not found</p>';
          return;
        }
        let primStr = '';
        if (t.primitives !== null && t.primitives !== undefined) {
          if (typeof t.primitives === 'string') {
            try {
              primStr = JSON.stringify(JSON.parse(t.primitives), null, 2);
            } catch (_) {
              primStr = t.primitives;
            }
          } else {
            primStr = JSON.stringify(t.primitives, null, 2);
          }
        }
        let leaseExpStr = '';
        if (t.status === 'leased' && t.lease_expires) {
          try {
            leaseExpStr = new Date(t.lease_expires * 1000).toLocaleString();
          } catch (_) {
            leaseExpStr = String(t.lease_expires);
          }
        }
        pane.innerHTML = `
          <div class="field"><span class="field-label">ID</span><span class="mono">${escapeHTML(t.id || '')}</span></div>
          <div class="field"><span class="field-label">Project</span><span>${escapeHTML(t.project || '')}</span></div>
          <div class="field"><span class="field-label">Status</span><span class="badge badge-${escapeHTML(t.status || 'unknown')}">${escapeHTML(t.status || '')}</span></div>
          <div class="field"><span class="field-label">Priority</span><span>${escapeHTML(String(t.priority ?? ''))}</span></div>
          ${t.worker ? `<div class="field"><span class="field-label">Worker</span><span class="mono">${escapeHTML(t.worker)}</span></div>` : ''}
          ${leaseExpStr ? `<div class="field"><span class="field-label">Lease Expires</span><span>${escapeHTML(leaseExpStr)}</span></div>` : ''}
          ${t.asset_path ? `<div class="field"><span class="field-label">Asset Path</span><span class="mono">${escapeHTML(t.asset_path)}</span></div>` : ''}
          <div class="field"><span class="field-label">Body</span><pre>${escapeHTML(t.body || '')}</pre></div>
          ${primStr ? `<div class="field"><span class="field-label">Primitives</span><pre>${escapeHTML(primStr)}</pre></div>` : ''}
        `;
      } catch (e) {
        console.error('Failed to load task details:', e);
      }
    }

    function clearFormErrors() {
      const summary = document.getElementById('form-error-summary');
      if (summary) {
        summary.style.display = 'none';
        const list = document.getElementById('form-error-summary-list');
        if (list) list.innerHTML = '';
      }
      const form = document.getElementById('submit-task-form');
      if (form) {
        form.querySelectorAll('[aria-invalid]').forEach(el => el.setAttribute('aria-invalid', 'false'));
        form.querySelectorAll('.field-error').forEach(el => {
          el.textContent = '';
          el.style.display = 'none';
        });
      }
    }

    function showFormErrors(errors) {
      clearFormErrors();
      if (!errors || errors.length === 0) return;
      const summary = document.getElementById('form-error-summary');
      const list = document.getElementById('form-error-summary-list');
      if (summary && list) {
        list.innerHTML = '';
        for (const err of errors) {
          const li = document.createElement('li');
          const a = document.createElement('a');
          a.href = '#' + err.fieldId;
          a.textContent = err.message;
          a.onclick = function(e) {
            e.preventDefault();
            const target = document.getElementById(err.fieldId);
            if (target) target.focus();
          };
          li.appendChild(a);
          list.appendChild(li);

          const targetIds = err.fieldIds || [err.fieldId];
          for (const id of targetIds) {
            const input = document.getElementById(id);
            if (input) input.setAttribute('aria-invalid', 'true');
            const errEl = document.getElementById(id + '-error');
            if (errEl) {
              errEl.textContent = 'Error: ' + err.message;
              errEl.style.display = 'block';
            }
          }
        }
        summary.style.display = 'block';
        summary.focus();
      }
    }

    async function submitTask(e) {
      if (e && e.preventDefault) e.preventDefault();
      clearFormErrors();
      const projEl = document.getElementById('form-project');
      const bodyEl = document.getElementById('form-body');
      const prioEl = document.getElementById('form-priority');
      const assetEl = document.getElementById('form-asset');
      const idEl = document.getElementById('form-id');

      const proj = projEl ? projEl.value.trim() : '';
      const body = bodyEl ? bodyEl.value : '';
      const prioText = prioEl ? prioEl.value.trim() : '';
      const prio = prioText === '' ? null : parseInt(prioText, 10);
      const asset = assetEl ? assetEl.value.trim() : '';
      const customId = idEl ? idEl.value.trim() : '';

      const errors = [];
      if (!proj || proj === '*') {
        errors.push({ fieldId: 'form-project', message: 'Project name is required' });
      }
      if (!body.trim() && !asset) {
        errors.push({
          fieldId: 'form-body',
          fieldIds: ['form-body', 'form-asset'],
          message: 'Either Body or Asset Path must be provided'
        });
      }
      if (prio !== null && (!Number.isInteger(prio) || prio < 0)) {
        errors.push({ fieldId: 'form-priority', message: 'Priority must be a whole number, 0 or greater' });
      }

      if (errors.length > 0) {
        showFormErrors(errors);
        return;
      }

      const payload = {
        project: proj,
        body: body
      };
      if (prio !== null) payload.priority = prio;
      if (asset) payload.asset_path = asset;
      if (customId) payload.id = customId;

      try {
        const res = await fetchJSON('/tasks', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(payload)
        });
        if (res) {
          if (bodyEl) bodyEl.value = '';
          if (assetEl) assetEl.value = '';
          if (idEl) idEl.value = '';
          clearFormErrors();
          showError(null);
          await loadAll();
        }
      } catch (err) {
        console.error('Failed to submit task:', err);
      }
    }

    function escapeHTML(str) {
      if (str === null || str === undefined) return '';
      return String(str).replace(/[&<>'"]/g, tag => ({
        '&': '&amp;',
        '<': '&lt;',
        '>': '&gt;',
        "'": '&#39;',
        '"': '&quot;'
      }[tag] || tag));
    }

    async function loadAll() {
      try {
        await Promise.all([loadProjects(), loadStats(), loadTasks()]);
      } catch (e) {
        console.error('Failed to refresh data:', e);
      }
    }

    function setupAutoRefresh() {
      const cb = document.getElementById('auto-refresh');
      if (refreshTimer) clearInterval(refreshTimer);
      if (cb && cb.checked) {
        refreshTimer = setInterval(loadAll, 3000);
      }
      if (cb) cb.onchange = setupAutoRefresh;
    }

    setupRowActivation();
    loadAll();
    setupAutoRefresh();
  </script>
</body>
</html>
