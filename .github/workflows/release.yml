name: release
on:
  push:
    tags: ['v*']
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: build
        run: |
          version="${GITHUB_REF_NAME#v}"
          ldflags="-s -w -X github.com/IgorAlexey/taskd/internal/version.Version=$version"
          for os in linux darwin; do
            for arch in amd64 arm64; do
              dir="dist/$os-$arch"
              CGO_ENABLED=0 GOOS=$os GOARCH=$arch go build -trimpath -ldflags="$ldflags" -o "$dir/taskd" .
              CGO_ENABLED=0 GOOS=$os GOARCH=$arch go build -trimpath -ldflags="$ldflags" -o "$dir/taskd-tui" ./cmd/taskd-tui
              tar -C "$dir" -czf "dist/taskd_${version}_${os}_${arch}.tar.gz" taskd taskd-tui
            done
          done
      - name: release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" dist/*.tar.gz install.sh --generate-notes
